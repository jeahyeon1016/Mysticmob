# MythicMobs 5.13.0 / ModelEngine 4.1.0
EntGuardian:
  Type: ZOMBIE
  Display: '&2엔트 가디언'
  Health: 220
  Damage: 0
  Modules:
    ThreatTable: true
  Options:
    MovementSpeed: 0.11
    KnockbackResistance: 1.0
    FollowRange: 24
    Silent: true
    PreventOtherDrops: true
    PreventItemPickup: true
    PreventSunburn: true
    PreventRandomEquipment: true
  AIGoalSelectors:
    - 0 clear
    - 1 float
    - 2 meleeattack
    - 3 movetowardstarget
  AITargetSelectors:
    - 0 clear
    - 1 players
  Skills:
    - skill{s=EG_Init} @self ~onSpawn
    - skill{s=EG_Damaged;sync=true} @self ~onDamaged
    - skill{s=EG_RootPhase} @self ~onDamaged =80%
    - skill{s=EG_RootPhase60} @self ~onDamaged =60%
    - skill{s=EG_RootPhase40} @self ~onDamaged =40%
    - skill{s=EG_RootPhase20} @self ~onDamaged =20%
    - skill{s=EG_AttackRouter} @target ~onTimer:2
    - skill{s=EG_Death} @self ~onDeath

EntGuardianRoot:
  Type: ARMOR_STAND
  Health: 1
  Options:
    Invisible: true
    NoGravity: true
    Silent: true
    Invincible: true
    PreventOtherDrops: true
  Skills:
    - skill{s=EGR_Init} @self ~onSpawn
