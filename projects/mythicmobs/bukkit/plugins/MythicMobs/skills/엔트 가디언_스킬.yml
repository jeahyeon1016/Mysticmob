# Ent Guardian field-boss pattern. Damage is provisional at 10.
EG_Init:
  Skills:
    - setvariable{var=caster.count;type=INTEGER;value=0} @self
    - setvariable{var=caster.combo_attack;type=INTEGER;value=0} @self
    - meg:model{mid=ent_guardian;d=false;i=true;lpitch=true;usm=true;save=false} @self
    - meg:defaultstate{mid=ent_guardian;type=idle;state=idle;li=2;lo=2} @self
    - meg:defaultstate{mid=ent_guardian;type=walk;state=walk;li=2;lo=2} @self
    - meg:defaultstate{mid=ent_guardian;type=death;state=death} @self

EG_AttackRouter:
  Conditions:
    - variableEquals{var=caster.count;value=0} true
    - incombat true
  TargetConditions:
    - entitytype{t=PLAYER} true
    - health{h=>0} true
    - distance{d=<5} true
    - lineofsight true
  Skills:
    - skill{s=EG_Smash} @target
    - skill{s=EG_Sweep} @target

EG_Sweep:
  Cooldown: 5
  Conditions:
    - variableEquals{var=caster.count;value=0} true
  Skills:
    - setvariable{var=caster.count;type=INTEGER;value=1} @self
    - look{headOnly=false;immediately=true} @target
    - setspeed{speed=0} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - randomskill{skills=EG_RightSweep,EG_LeftSweep} @self
    - delay 50
    - setspeed{speed=1} @self
    - setvariable{var=caster.count;type=INTEGER;value=0} @self ?variableEquals{var=caster.count;value=1}

EG_RightSweep:
  Skills:
    - meg:state{mid=ent_guardian;s=right_sweep;priority=3;li=0;lo=0} @self
    - delay 28
    - particles{p=redstone;color=#43B05C;size=0.9;amount=18;hS=0.35;vS=0.05;speed=0;y=0.3} @LivingInCone{a=150;r=5;rot=15;target=players}
    - damage{a=10} @LivingInCone{a=150;r=5;rot=15;target=players}
    - skill{s=EG_ComboHit} @LivingInCone{a=150;r=5;rot=15;target=players}
    - sound{s=entity.iron_golem.attack;v=1;p=0.65} @self

EG_LeftSweep:
  Skills:
    - meg:state{mid=ent_guardian;s=left_sweep;priority=3;li=0;lo=0} @self
    - delay 28
    - particles{p=redstone;color=#43B05C;size=0.9;amount=18;hS=0.35;vS=0.05;speed=0;y=0.3} @LivingInCone{a=150;r=5;rot=-15;target=players}
    - damage{a=10} @LivingInCone{a=150;r=5;rot=-15;target=players}
    - skill{s=EG_ComboHit} @LivingInCone{a=150;r=5;rot=-15;target=players}
    - sound{s=entity.iron_golem.attack;v=1;p=0.6} @self

EG_Smash:
  Cooldown: 30
  Conditions:
    - variableEquals{var=caster.count;value=0} true
    - variableInRange{var=caster.combo_attack;value=>=20} true
  Skills:
    - setvariable{var=caster.count;type=INTEGER;value=1} @self
    - setspeed{speed=0} @self
    - look{headOnly=false;immediately=true} @target
    - meg:state{mid=ent_guardian;s=smash_ground;priority=3;li=0;lo=0} @self
    - delay 16
    - sound{s=entity.warden.tendril_clicks;v=1;p=0.7} @self
    - delay 29
    - particles{p=redstone;color=#43B05C;size=1;amount=24;hS=0.4;vS=0.05;speed=0;y=0.3} @LivingInCone{a=120;r=4;rot=0;target=players}
    - damage{a=10} @LivingInCone{a=120;r=4;rot=0;target=players}
    - skill{s=EG_ComboHit} @LivingInCone{a=120;r=4;rot=0;target=players}
    - sound{s=entity.iron_golem.damage;v=1.4;p=0.45} @self
    - setvariable{var=caster.combo_attack;type=INTEGER;value=0} @self
    - delay 35
    - setspeed{speed=1} @self
    - setvariable{var=caster.count;type=INTEGER;value=0} @self ?variableEquals{var=caster.count;value=1}

EG_RootQuake:
  Skills:
    - sound{s=entity.ender_dragon.growl;v=1.2;p=0.65;r=24} @self
    - effect:particlering{p=redstone;points=48;radius=4;color=#8AFF80;a=2;y=0.3;repeat=20;repeatInterval=1} @self
    - delay 20
    - sound{s=entity.generic.explode;v=1.3;p=0.9;r=24} @self
    - sound{s=block.stone.break;v=1.3;p=0.65;r=24} @self
    - particles{p=block_crack;m=BONE_BLOCK;a=32;hS=4;vS=0.35;s=0.08;y=0.3} @self
    - particlering{p=block_crack;m=BONE_BLOCK;points=48;radius=4;a=2;y=0.3} @self
    - damage{a=10} @PlayersInRadius{r=4}
    - delay 10
    - effect:particlering{p=redstone;points=64;radius=8;color=#8AFF80;a=2;y=0.3;repeat=20;repeatInterval=1} @self
    - delay 20
    - sound{s=entity.generic.explode;v=1.5;p=0.7;r=24} @self
    - particles{p=block_crack;m=BONE_BLOCK;a=64;hS=8;vS=0.5;s=0.12;y=0.3} @self
    - particlering{p=block_crack;m=BONE_BLOCK;points=64;radius=8;a=3;y=0.3} @self
    - damage{a=10} @PlayersInRadius{r=8}
    - delay 10
    - effect:particlering{p=redstone;points=80;radius=10;color=#8AFF80;a=2;y=0.3;repeat=20;repeatInterval=1} @self
    - delay 20
    - sound{s=entity.generic.explode;v=1.8;p=0.5;r=28} @self
    - particles{p=block_crack;m=BONE_BLOCK;a=96;hS=10;vS=0.65;s=0.16;y=0.3} @self
    - particlering{p=block_crack;m=BONE_BLOCK;points=80;radius=10;a=4;y=0.3} @self
    - damage{a=10} @PlayersInRadius{r=10}

EG_RootPhase:
  Skills:
    - setvariable{var=caster.count;type=INTEGER;value=2} @self
    - setspeed{speed=0} @self
    - meg:state{mid=ent_guardian;s=arm_inground;priority=4;li=0;lo=0} @self
    - skill{s=EG_RootQuake} @self
    - summon{type=EntGuardianRoot;amount=1;radius=0;summonerisparent=true} @BlocksInRadius{r=12;blocktypes=BONE_BLOCK;blockcentered=true;upoffset=0.5;limit=5;sort=NEAREST;stuti=0}
    - delay 25
    - setspeed{speed=1} @self
    - setvariable{var=caster.count;type=INTEGER;value=0} @self ?variableEquals{var=caster.count;value=2}

EG_RootPhase60:
  Skills:
    - setvariable{var=caster.count;type=INTEGER;value=2} @self
    - setspeed{speed=0} @self
    - meg:state{mid=ent_guardian;s=arm_inground;priority=4;li=0;lo=0} @self
    - skill{s=EG_RootQuake} @self
    - summon{type=EntGuardianRoot;amount=1;radius=0;summonerisparent=true} @BlocksInRadius{r=12;blocktypes=BONE_BLOCK;blockcentered=true;upoffset=0.5;limit=5;sort=NEAREST;stuti=5}
    - delay 25
    - setspeed{speed=1} @self
    - setvariable{var=caster.count;type=INTEGER;value=0} @self ?variableEquals{var=caster.count;value=2}

EG_RootPhase40:
  Skills:
    - setvariable{var=caster.count;type=INTEGER;value=2} @self
    - setspeed{speed=0} @self
    - meg:state{mid=ent_guardian;s=arm_inground;priority=4;li=0;lo=0} @self
    - skill{s=EG_RootQuake} @self
    - summon{type=EntGuardianRoot;amount=1;radius=0;summonerisparent=true} @BlocksInRadius{r=12;blocktypes=BONE_BLOCK;blockcentered=true;upoffset=0.5;limit=5;sort=NEAREST;stuti=10}
    - delay 25
    - setspeed{speed=1} @self
    - setvariable{var=caster.count;type=INTEGER;value=0} @self ?variableEquals{var=caster.count;value=2}

EG_RootPhase20:
  Skills:
    - setvariable{var=caster.count;type=INTEGER;value=2} @self
    - setspeed{speed=0} @self
    - meg:state{mid=ent_guardian;s=arm_inground;priority=4;li=0;lo=0} @self
    - skill{s=EG_RootQuake} @self
    - summon{type=EntGuardianRoot;amount=1;radius=0;summonerisparent=true} @BlocksInRadius{r=12;blocktypes=BONE_BLOCK;blockcentered=true;upoffset=0.5;limit=5;sort=NEAREST;stuti=15}
    - delay 25
    - setspeed{speed=1} @self
    - setvariable{var=caster.count;type=INTEGER;value=0} @self ?variableEquals{var=caster.count;value=2}

EG_Damaged:
  Conditions:
    - damageamount{a=>0} true
  Skills:
    - variableadd{var=caster.combo_attack;amount=1} @self
    - skill{s=EG_HurtSound} @self

EG_ComboHit:
  Skills:
    - variableadd{var=caster.combo_attack;amount=5} @self

EG_HurtSound:
  Skills:
    - sound{s=block.wood.hit;v=1.2;p=0.55} @self

EG_Death:
  Skills:
    - setvariable{var=caster.count;type=INTEGER;value=9} @self
    - setAI{ai=false} @self
    - remove @Children
    - sound{s=block.wood.break;v=1.5;p=0.45} @self
    - sound{s=entity.zombie.death;v=0.7;p=0.4} @self

EGR_Init:
  Skills:
    - meg:model{mid=ent_branch;d=false;i=true;lpitch=true;usm=true;save=false} @self
    - meg:state{mid=ent_branch;s=skill;priority=3;loop=LOOP;force=true;li=0;lo=0} @self

EGR_Strike:
  Skills:
    - particlesphere{p=redstone;color=#43B05C;size=0.9;amount=20;radius=2} @self
    - damage{a=10} @PlayersInRadius{r=2}

EGR_Cleanup:
  Conditions:
    - hasparent true
    - isparentalive false
  Skills:
    - remove @self
