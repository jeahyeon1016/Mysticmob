# ============================================================
# ORC KING - Mob
# MythicMobs 5.13.0 + ModelEngine 4.1.0
# Development v0.2
# Model ID: orc_king
# ============================================================

OrcKing:
  Type: ZOMBIE
  Display: '&4오크킹'
  Health: 300
  Damage: 0

  Modules:
    ThreatTable: true

  Options:
    Silent: true
    MovementSpeed: 0.24
    FollowRange: 32
    PreventOtherDrops: true
    PreventItemPickup: true
    PreventSunburn: true
    KnockbackResistance: 0.35

  AIGoalSelectors:
    - clear
    - meleeattack
    - movetowardstarget
    - randomstroll
    - lookatplayers
    - randomlookaround

  AITargetSelectors:
    - clear
    - players

  Skills:
    # Model
    - meg:model{mid=orc_king;d=false;i=true;lpitch=true;usm=true;save=false} @self ~onSpawn
    - meg:model{mid=orc_king;d=false;i=true;lpitch=true;usm=true;save=false} @self ~onLoad

    # Init
    - skill{s=OK_Init} @self ~onSpawn
    - skill{s=OK_Init} @self ~onLoad

    # Non-combat / combat locomotion
    - skill{s=OK_IdleState} @self ~onTimer:5
    - skill{s=OK_WalkState} @self ~onTimer:5
    - skill{s=OK_RunState} @target ~onTimer:5 ?incombat

    # Normal pattern router. Runner >= 10 blocks this router internally.
    - skill{s=OK_CombatRouter} @target ~onTimer:5 ?incombat

    # Combo: every received hit refreshes 10s inactivity timer;
    # actual +1 gain is globally limited by the metaskill cooldown.
    - skill{s=OK_ComboActivityTouch} @self ~onDamaged
    - skill{s=OK_ComboFromDamaged} @self ~onDamaged
    - skill{s=OK_ComboIdleReset} @self ~onTimer:20

    # Runner: only hits from a player 6+ blocks away are counted.
    # The qualifying trigger is stored as the current Runner target by Aura.
    - skill{s=OK_RunnerGain} @trigger ~onDamaged
    - skill{s=OK_RunnerStart} @PlayersInRadius{r=64} ~onTimer:2 ?incombat
    - skill{s=OK_RunnerMaintain} @PlayersInRadius{r=64} ~onTimer:2 ?incombat
    - skill{s=OK_FastRunStop} @PlayersInRadius{r=64} ~onTimer:2 ?incombat

    # OP-only damage/debug display.
    - skill{s=OK_DebugDamage} @PlayersInWorld ~onDamaged

    # Death animation.
    - skill{s=OK_Death} @self ~onDeath
