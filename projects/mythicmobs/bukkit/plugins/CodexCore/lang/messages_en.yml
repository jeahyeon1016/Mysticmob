custom-placeholders:
  my-color: '#ff0000'
  my-text: Sample Text

general:
  # noMoney: "&cYou don't have needed amount of money/tokens/items."
  noPermissions: '&cYou don''t have permissions ($<permission>)!'
  priceMustBeAboveZero: Price must be 0 or higher.
  senderIsNotPlayer: '&cThis command must be used from game.'
  notAPlayer: '&cCan''t find player named: $<name>!'
  notANumber: '&c"$<text>" it''s not a number!'
  reload: '&7Reloaded settings!'
  reload-error: '&7There was error when reloading settings!'
  save: '&7Saved settings!'
  commands:
    help: |-
      You typed: &7$<text>&r
      Valid syntax:
        &8/&7codex &rreload
    unstuck:
      warmup: '&4Teleporting... &ePlease wait $<time>s to be teleported. &4Don''t
        move.'
      teleported: '&aYou''ve been teleported!'
      err:
        cooldown: '&cYou are still on cooldown for $<time>s'
        warmingUp: '&cPlease wait to be teleported.'
        cancelled: '&cTeleport cancelled.'
Prefix: '&e%plugin% &8» &7'
Codex:
  Command:
    Usage: '&c* Usage: &f/%label% %cmd% %usage%'
    Help:
      Format: '&6» &e/%label% %cmd% %usage% &7- %description%'
      List:
      - '&8&m━━━━━━━━━━━━&8&l[ &e&l%plugin% &7- &6&lHelp &8&l]&8&m━━━━━━━━━━━━'
      - '%cmds%'
      Desc: Show help page.
    Editor:
      Desc: Opens GUI Editor.
    About:
      Desc: Some info about the plugin.
    Reload:
      Desc: Reload the plugin.
      Done: Reloaded!
  Editor:
    Tips:
      Commands:
      - '{message: ~prefix: false;}&7'
      - '&b&lCommand Tips:'
      - '&7'
      - '&2• &a[CONSOLE] <command> &2- Execute from Console.'
      - '&2• &a[OP] <command> &2- Execute as an Operator.'
      - '&2• (no prefix) &a<command> &2- Execute from a Player.'
      - '&2• &a%player% &2- Player name placeholder.'
      - '&7'
      Header:
      - '{message: ~prefix: false;}&7'
      - '&e&lSUGGESTED (ALLOWED) VALUES:'
      Hint: '&b&nClick to select!'
      Exit:
        Name: '&b<Click this message to &dExit &bthe &dEdit Mode&b>'
        Hint: '&7Click to exit edit mode.'
    Display:
      Edit:
        Format:
        - '{message: ~type: TITLES; ~fadeIn: 10; ~stay: -1; ~fadeOut: 10;}%title%'
        - '&7%message%'
        Title: '&a&lEditing...'
      Done:
        Title: '&a&lDone!'
      Error:
        Title: '&c&lError!'
        Number:
          Invalid: '&c&lInvalid number!'
          MustDecimal: '&7Must be &cInteger &7or &cDecimal'
          MustInteger: '&7Must be &cInteger'
        Type:
          Title: '&c&lInvalid Type!'
          Values: '&7See allowed values in chat.'
    Actions:
      Section:
        Add: '&7Enter unique section id...'
      Subject:
        Add: '&7Select a subject...'
        Invalid: '&cInvalid provided!'
        Hint:
        - '%description%'
        - '&7'
        - '&d&nClick to select!'
        NoParams: '&c* No Params Available *'
      Param:
        Add: '&7Select a param and type it''s value...'
        Edit: '&7Enter a new value...'
        Hint: '&d&nClick to select!'
        Invalid: '&cNo such param!'
      Action:
        ActionBar:
          Desc: '&7Sends a message to action bar.'
        Broadcast:
          Desc: '&7Broadcasts a message to whole server.'
        Burn:
          Desc: '&7Burns an entity.'
        CommandConsole:
          Desc: '&7Executes a command from console.'
        CommandOp:
          Desc: '&7Executes a command with OP permissions.'
        CommandPlayer:
          Desc: '&7Executes a command by a player.'
        Hunger:
          Desc: '&7Changes player''s hunger level.'
        Saturation:
          Desc: '&7Changes player''s saturation level.'
        Damage:
          Desc: '&7Damages an entity.'
        Firework:
          Desc: '&7Launches a random firework.'
        Goto:
          Desc: '&7Executes actions of certain actions section.'
        Health:
          Desc: '&7Changes entity''s health level.'
        Hook:
          Desc: '&7Pulls towards the target.'
        Lightning:
          Desc: '&7Summons a lightning strike.'
        Message:
          Desc: '&7Send a message to a target.'
        ParticleSimple:
          Desc: '&7Plays certain particle.'
        Potion:
          Desc: '&7Adds certain potion effect.'
        ProgressBar:
          Desc: '&7Displays progress bar.'
        Projectile:
          Desc: '&7Launches certain projectile.'
        Sound:
          Desc: '&7Plays certain sound.'
        Teleport:
          Desc: '&7Teleport to the target.'
        Throw:
          Desc: '&7Pulls away targets.'
        Titles:
          Desc: '&7Shows custom titles.'
      Condition:
        EntityHealth:
          Desc: '&7Checks the target''s health.'
        EntityType:
          Desc: '&7Checks the target''s type.'
        Permission:
          Desc: '&7Checks the target''s permission.'
        VaultBalance:
          Desc: '&7Checks the player''s balance.'
        WorldTime:
          Desc: '&7Checks the world''s time.'
      TargetSelector:
        FromSight:
          Desc: '&7Selects a target from executor''s sight.'
        Radius:
          Desc: '&7Selects targets in a radius.'
        Self:
          Desc: '&7Selects executor as a target.'
