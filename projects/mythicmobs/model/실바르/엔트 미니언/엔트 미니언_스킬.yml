# count: 0=대기/추격, 1=공격, 2=소환, 9=사망
# 공격 피해: 11틱(0.55초, 20TPS 기준 0.56초 근사)
# 공격 판정: 전방 0~2.2블록, 좌우 ±0.5블록, 높이 ±1.5블록

EM_Init:
  Skills:
    - setvariable{var=caster.count;type=INTEGER;value=2} @self
    - meg:model{mid=ent_minion;d=false;i=true;lpitch=true;usm=true;save=false} @self
    - meg:defaultstate{mid=ent_minion;type=idle;state=idle;li=2;lo=2} @self
    - meg:defaultstate{mid=ent_minion;type=walk;state=walk;li=2;lo=2} @self
    - meg:defaultstate{mid=ent_minion;type=death;state=death} @self
    - setspeed{speed=0} @self
    - sound{s=block.wood.place;v=1.1;p=0.75} @self
    - meg:state{mid=ent_minion;s=spawn;priority=3;li=0;lo=0} @self
    - delay 37
    - skill{s=EM_SpawnFinish} @self

EM_SpawnFinish:
  Conditions:
    - variableEquals{var=caster.count;value=2} true
  Skills:
    - setspeed{speed=1} @self
    - setvariable{var=caster.count;type=INTEGER;value=0} @self

EM_Aggro:
  TargetConditions:
    - entitytype{t=PLAYER} true
    - health{h=>0} true
    - distance{d=<20} true
  Skills:
    - threat{amount=100} @trigger
    - setTarget @trigger

EM_TryAttack:
  Cooldown: 2
  Conditions:
    - variableEquals{var=caster.count;value=0} true
    - incombat true
  TargetConditions:
    - entitytype{t=PLAYER} true
    - health{h=>0} true
    - distance{d=<1.9} true
    - lineofsight true
  Skills:
    - look{headOnly=false;immediately=true} @target
    - setvariable{var=caster.count;type=INTEGER;value=1} @self
    - setspeed{speed=0} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - sound{s=block.wood.hit;v=1.2;p=0.8} @self
    - meg:state{mid=ent_minion;s=attack;priority=3;li=0;lo=0} @self
    - delay 11
    - skill{s=EM_Impact} @PlayersInRadius{r=3}
    - delay 11
    - skill{s=EM_AttackFinish} @self

EM_Impact:
  Conditions:
    - variableEquals{var=caster.count;value=1} true
  TargetConditions:
    - entitytype{t=PLAYER} true
    - health{h=>0} true
    - lineofsight true
    - gamemode{m=SPECTATOR} false
    - gamemode{m=CREATIVE} false
  Skills:
    - setvariable{var=target.em_forward;type=FLOAT;duration=1;value="-(<target.l.x>-<caster.l.x>)*sin(<caster.l.yaw>*3.141592653589793/180)+(<target.l.z>-<caster.l.z>)*cos(<caster.l.yaw>*3.141592653589793/180)"}
    - setvariable{var=target.em_side;type=FLOAT;duration=1;value="(<target.l.x>-<caster.l.x>)*cos(<caster.l.yaw>*3.141592653589793/180)+(<target.l.z>-<caster.l.z>)*sin(<caster.l.yaw>*3.141592653589793/180)"}
    - setvariable{var=target.em_height;type=FLOAT;duration=1;value="<target.l.y>-<caster.l.y>"}
    - skill{s=EM_Damage}

EM_Damage:
  TargetConditions:
    - variableInRange{var=target.em_forward;value=0to2.2} true
    - variableInRange{var=target.em_side;value=-0.5to0.5} true
    - variableInRange{var=target.em_height;value=-1.5to1.5} true
  Skills:
    - damage{a=10}
    - sound{s=block.wood.hit;v=1.2;p=0.65} @target
    - sound{s=entity.zombie.hurt;v=0.55;p=0.55} @target

EM_AttackFinish:
  Conditions:
    - variableEquals{var=caster.count;value=1} true
  Skills:
    - meg:state{mid=ent_minion;s=attack;remove=true} @self
    - setspeed{speed=1} @self
    - setvariable{var=caster.count;type=INTEGER;value=0} @self

EM_HurtSound:
  Skills:
    - sound{s=block.wood.hit;v=1.2;p=0.9} @self
    - sound{s=entity.zombie.hurt;v=0.45;p=0.5} @self

EM_Death:
  Skills:
    - setvariable{var=caster.count;type=INTEGER;value=9} @self
    - setAI{ai=false} @self
    - meg:state{mid=ent_minion;s=spawn;remove=true} @self
    - meg:state{mid=ent_minion;s=attack;remove=true} @self
    - sound{s=block.wood.break;v=1.3;p=0.7} @self
    - sound{s=entity.zombie.death;v=0.7;p=0.55} @self
