# ORC KING v0.6 — MythicMobs 5.13.0 / ModelEngine 4.1.0
# count: idle=0, walk=-1, run=-2, attacks=1/2/3, throw=4,
# summon=5, glaive=6, runner throw=7, fast run=8, death=99.
# UUID variables are per-boss target references, not extra combat counters.
# Spear: steer a gravity-capable projectile for 5 ticks, then let it fall.
# charge_start/charge_end are intentionally unassigned.

OK_Init:
  Skills:
    - setvariable{var=caster.ok_last_special;value=0;type=INTEGER} @self
    - setvariable{var=caster.combo;value=0;type=INTEGER} @self
    - setvariable{var=caster.runner;value=0;type=INTEGER} @self
    - setvariable{var=caster.count;value=0;type=INTEGER} @self
    - setvariable{var=caster.ok_runner_target;value="00000000-0000-0000-0000-000000000000";type=STRING} @self
    - setvariable{var=caster.ok_chase_target;value="00000000-0000-0000-0000-000000000000";type=STRING} @self
    - auraremove{aura=OK_ComboActivity} @self
    - auraremove{aura=OK_ComboGainLock} @self
    - auraremove{aura=OK_RunnerGainLock} @self
    - auraremove{aura=OK_RunnerPresent} @self
    - skill{s=OK_GlaiveClear} @self
    - skill{s=OK_Unlock} @self
    - meg:defaultstate{mid=orc_king;t=death;s=death} @self

# Runner gets first choice; normal routing remains available if the ranged
# attacker is now <=5 blocks away or no longer a valid target.
OK_Tick:
  Conditions:
    - variableInRange{var=caster.count;value=-2to8} true
  Skills:
    - skill{s=OK_RunnerStart} @UUID{u=<caster.var.ok_runner_target>}
    - skill{s=OK_RunnerMaintain} @UUID{u=<caster.var.ok_chase_target>}
    - skill{s=OK_FastRunStop} @UUID{u=<caster.var.ok_chase_target>}
    - skill{s=OK_RunnerLost} @self
    - skill{s=OK_CombatRouter} @target ?incombat
    - skill{s=OK_IdleState} @self
    - skill{s=OK_WalkState} @self
    - skill{s=OK_RunState} @self

OK_StopLocomotion:
  Skills:
    - meg:state{mid=orc_king;s=idle;r=true;i=true;p=1} @self
    - meg:state{mid=orc_king;s=walk;r=true;i=true;p=1} @self
    - meg:state{mid=orc_king;s=run;r=true;i=true;p=1} @self

OK_Freeze:
  Skills:
    - skill{s=OK_StopLocomotion} @self
    - setAI{ai=false} @self
    - setspeed{speed=0;type=WALK} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self

OK_Unlock:
  Conditions:
    - variableEquals{var=caster.count;value=99} false
  Skills:
    - setspeed{speed=1;type=WALK} @self
    - setAI{ai=true} @self
    - setvariable{var=caster.count;value=0;type=INTEGER} @self

OK_IdleState:
  Conditions:
    - variableInRange{var=caster.count;value=-2to0} true
    - moving false
  Skills:
    - skill{s=OK_StopLocomotion} @self ?variableInRange{var=caster.count;value=-2to-1}
    - setvariable{var=caster.count;value=0;type=INTEGER} @self
    - meg:state{mid=orc_king;s=idle;priority=1;loop=LOOP;force=false;li=2;lo=2} @self

OK_WalkState:
  Conditions:
    - variableInRange{var=caster.count;value=-2to0} true
    - incombat false
    - moving true
  Skills:
    - skill{s=OK_StopLocomotion} @self ?!variableEquals{var=caster.count;value=-1}
    - setvariable{var=caster.count;value=-1;type=INTEGER} @self
    - meg:state{mid=orc_king;s=walk;priority=1;loop=LOOP;force=false;li=2;lo=2} @self

OK_RunState:
  Conditions:
    - variableInRange{var=caster.count;value=-2to0} true
    - incombat true
    - moving true
  Skills:
    - skill{s=OK_StopLocomotion} @self ?!variableEquals{var=caster.count;value=-2}
    - setvariable{var=caster.count;value=-2;type=INTEGER} @self
    - meg:state{mid=orc_king;s=run;priority=1;loop=LOOP;force=false;li=1;lo=1} @self

# Both directions share ONE 20-tick gain lock; activity refresh is outside it.
OK_ComboActivityTouch:
  Skills:
    - auraremove{aura=OK_ComboActivity} @self
    - aura{auraName=OK_ComboActivity;duration=200} @self

OK_ComboFromDamaged:
  TriggerConditions:
    - entitytype{t=PLAYER} true
  Skills:
    - skill{s=OK_ComboActivityTouch} @self
    - skill{s=OK_ComboGain1} @self

OK_ComboGain1:
  Conditions:
    - hasaura{n=OK_ComboGainLock} false
  Skills:
    - aura{auraName=OK_ComboGainLock;duration=20} @self
    - variableadd{var=caster.combo;amount=1} @self

OK_ComboFromBossHit:
  TriggerConditions:
    - entitytype{t=PLAYER} true
  Skills:
    - skill{s=OK_ComboActivityTouch} @self
    - skill{s=OK_ComboGain2} @self

OK_ComboGain2:
  Conditions:
    - hasaura{n=OK_ComboGainLock} false
  Skills:
    - aura{auraName=OK_ComboGainLock;duration=20} @self
    - variableadd{var=caster.combo;amount=2} @self

OK_ComboIdleReset:
  Conditions:
    - variableInRange{var=caster.combo;value=>0} true
    - hasaura{n=OK_ComboActivity} false
  Skills:
    - setvariable{var=caster.combo;value=0;type=INTEGER} @self

OK_CombatRouter:
  Conditions:
    - variableInRange{var=caster.count;value=-2to0} true
  Skills:
    - skill{s=OK_Router_Base} @target ?variableInRange{var=caster.combo;value=0to10}
    - skill{s=OK_Router_Mid} @target ?variableInRange{var=caster.combo;value=11to20}
    - skill{s=OK_Router_High} @target ?variableInRange{var=caster.combo;value=>20}

OK_Router_Base:
  Skills:
    - randomskill{skills=OK_Attack1 2,OK_Attack2 1} @target ?targetwithin{d=3}
    - skill{s=OK_Attack1} @target ?targetwithin{d=4} ?targetnotwithin{d=3}

OK_Router_Mid:
  Skills:
    - randomskill{skills=OK_Attack1 1,OK_Attack2 1,OK_Attack3 1} @target ?targetwithin{d=3}
    - randomskill{skills=OK_Attack1 1,OK_Attack3 1} @target ?targetwithin{d=4} ?targetnotwithin{d=3}
    - randomskill{skills=OK_Attack3 1} @target ?targetwithin{d=5} ?targetnotwithin{d=4}
    - skill{s=OK_GlaiveSmash} @target ?targetwithin{d=10} ?targetnotwithin{d=5}

OK_Router_High:
  Skills:
    - setvariable{var=caster.ok_special_choice;value=<caster.var.ok_last_special>;type=INTEGER} @self
    - randomskill{skills=OK_Attack1 1,OK_Attack2 1,OK_Attack3 1,OK_Summon 1} @target ?targetwithin{d=3} ?!variableEquals{var=caster.ok_special_choice;value=5}
    - randomskill{skills=OK_Attack1 3,OK_Attack2 3,OK_Attack3 3,OK_Summon 1} @target ?targetwithin{d=3} ?variableEquals{var=caster.ok_special_choice;value=5}
    - randomskill{skills=OK_Attack1 1,OK_Attack3 1,OK_Summon 1} @target ?targetwithin{d=4} ?targetnotwithin{d=3} ?!variableEquals{var=caster.ok_special_choice;value=5}
    - randomskill{skills=OK_Attack1 3,OK_Attack3 3,OK_Summon 1} @target ?targetwithin{d=4} ?targetnotwithin{d=3} ?variableEquals{var=caster.ok_special_choice;value=5}
    - randomskill{skills=OK_Attack3 1,OK_Summon 1} @target ?targetwithin{d=5} ?targetnotwithin{d=4} ?!variableEquals{var=caster.ok_special_choice;value=5}
    - randomskill{skills=OK_Attack3 3,OK_Summon 1} @target ?targetwithin{d=5} ?targetnotwithin{d=4} ?variableEquals{var=caster.ok_special_choice;value=5}
    - randomskill{skills=OK_GlaiveSmash 1,OK_Summon 1} @target ?targetwithin{d=10} ?targetnotwithin{d=5} ?variableEquals{var=caster.ok_special_choice;value=0}
    - randomskill{skills=OK_GlaiveSmash 1,OK_Summon 3} @target ?targetwithin{d=10} ?targetnotwithin{d=5} ?variableEquals{var=caster.ok_special_choice;value=6}
    - randomskill{skills=OK_GlaiveSmash 3,OK_Summon 1} @target ?targetwithin{d=10} ?targetnotwithin{d=5} ?variableEquals{var=caster.ok_special_choice;value=5}
    - skill{s=OK_Summon} @target ?targetwithin{d=24} ?targetnotwithin{d=10}
    - skill{s=OK_Summon} @target ?targetnotwithin{d=24}



# Attack 1: hit 17/20 seconds. Positive user angles point LEFT.
OK_Attack1:
  Conditions:
    - variableInRange{var=caster.count;value=-2to0} true
  TargetConditions:
    - entitytype{t=PLAYER} true
    - distance{d=0to4} true
  Skills:
    - setvariable{var=caster.count;value=1;type=INTEGER} @self
    - skill{s=OK_Freeze} @self
    - look{headOnly=false;force=true;immediately=true} @target
    - meg:state{mid=orc_king;s=attack1;priority=4;override=true;loop=ONCE;force=true;li=0;lo=1} @self
    # 2 ticks before impact: the swing sound makes the coming hit readable.
    - delay 15
    - skill{s=OK_SwingCue} @self ?variableEquals{var=caster.count;value=1}
    - delay 2
    - skill{s=OK_Attack1_Hit} @self
    - delay 13
    - skill{s=OK_Unlock} @self ?variableEquals{var=caster.count;value=1}

OK_Attack1_Hit:
  Conditions:
    - variableEquals{var=caster.count;value=1} true
  Skills:
    - damage{a=10;ignoreArmor=false} @LivingInCone{a=180;r=4;rot=0;target=players}
    - skill{s=OK_SlashFeedback} @LivingInCone{a=180;r=4;rot=0;target=players}
    - effect:particles{p=sweep_attack;amount=3;hS=1.1;vS=0.15;speed=0} @Forward{f=1.4;yo=1}

# Attack 2: hit 15/20 seconds. Positive user angles point LEFT.
OK_Attack2:
  Conditions:
    - variableInRange{var=caster.count;value=-2to0} true
  TargetConditions:
    - entitytype{t=PLAYER} true
    - distance{d=0to3} true
  Skills:
    - setvariable{var=caster.count;value=2;type=INTEGER} @self
    - skill{s=OK_Freeze} @self
    - look{headOnly=false;force=true;immediately=true} @target
    - meg:state{mid=orc_king;s=attack2;priority=4;override=true;loop=ONCE;force=true;li=0;lo=1} @self
    - delay 13
    - skill{s=OK_SwingCue} @self ?variableEquals{var=caster.count;value=2}
    - delay 2
    - skill{s=OK_Attack2_Hit} @self
    - delay 15
    - skill{s=OK_Unlock} @self ?variableEquals{var=caster.count;value=2}

OK_Attack2_Hit:
  Conditions:
    - variableEquals{var=caster.count;value=2} true
  Skills:
    - damage{a=10;ignoreArmor=false} @LivingInCone{a=210;r=3;rot=-15;target=players}
    - skill{s=OK_SlashFeedback} @LivingInCone{a=210;r=3;rot=-15;target=players}
    - effect:particles{p=sweep_attack;amount=3;hS=0.9;vS=0.15;speed=0} @Forward{f=1.2;yo=1}

# Attack 3: hit 15/20 seconds. Positive user angles point LEFT.
OK_Attack3:
  Conditions:
    - variableInRange{var=caster.count;value=-2to0} true
    - variableInRange{var=caster.combo;value=>10} true
  TargetConditions:
    - entitytype{t=PLAYER} true
    - distance{d=0to5} true
  Skills:
    - setvariable{var=caster.count;value=3;type=INTEGER} @self
    - skill{s=OK_Freeze} @self
    - look{headOnly=false;force=true;immediately=true} @target
    - meg:state{mid=orc_king;s=attack3;priority=4;override=true;loop=ONCE;force=true;li=0;lo=1} @self
    - delay 13
    - skill{s=OK_ThrustCue} @self ?variableEquals{var=caster.count;value=3}
    - delay 2
    - skill{s=OK_Attack3_Hit} @self
    - delay 15
    - skill{s=OK_Unlock} @self ?variableEquals{var=caster.count;value=3}

OK_Attack3_Hit:
  Conditions:
    - variableEquals{var=caster.count;value=3} true
  Skills:
    - damage{a=10;ignoreArmor=false} @LivingInCone{a=60;r=5;rot=0;target=players}
    - skill{s=OK_ThrustFeedback} @LivingInCone{a=60;r=5;rot=0;target=players}
    - effect:particleline{p=crit;amount=1;distanceBetween=0.22;fromOrigin=true} @Forward{f=4.5;yo=1.1}

# Perceptual timing layer. Cues occur 2 ticks before damage; feedback is
# emitted only at entities actually inside the hit cone on the damage tick.
OK_SwingCue:
  Skills:
    - sound{s=entity.player.attack.sweep;v=0.85;p=0.72} @self

OK_ThrustCue:
  Skills:
    - sound{s=entity.player.attack.strong;v=0.8;p=0.66} @self

OK_SlashFeedback:
  TargetConditions:
    - entitytype{t=PLAYER} true
  Skills:
    - sound{s=entity.player.attack.strong;v=0.65;p=0.72}
    - effect:particles{p=damage_indicator;amount=4;hS=0.25;vS=0.35;speed=0.08;yo=1}

OK_ThrustFeedback:
  TargetConditions:
    - entitytype{t=PLAYER} true
  Skills:
    - sound{s=entity.iron_golem.attack;v=0.55;p=0.88}
    - effect:particles{p=crit;amount=5;hS=0.16;vS=0.25;speed=0.05;yo=1}

# One projectile throughout: 5 ticks (0.25s) of guidance, then ballistic flight.
OK_Throw:
  Conditions:
    - variableInRange{var=caster.count;value=-2to0} true
    - variableInRange{var=caster.combo;value=>10} true
    - variableInRange{var=caster.runner;value=>9} true
  TargetConditions:
    - entitytype{t=PLAYER} true
    - distance{d=0to24} true
  Skills:
    - setvariable{var=caster.count;value=4;type=INTEGER} @self
    - skill{s=OK_Freeze} @self
    - look{headOnly=false;force=true;immediately=true} @target
    - meg:state{mid=orc_king;s=throw;priority=4;override=true;loop=ONCE;force=true;li=0;lo=1} @self
    - delay 14
    - skill{s=OK_ThrowRelease} @target
    - delay 19
    - skill{s=OK_Unlock} @self ?variableEquals{var=caster.count;value=4}

OK_ThrowRelease:
  Conditions:
    - variableEquals{var=caster.count;value=4} true
  Skills:
    - setvariable{var=skill.ok_spear_target;type=STRING;value="<target.uuid>"} @target
    - projectile{onStart=OK_SpearStart;onTick=OK_SpearFlight;onHit=OK_SpearHit;v=18;g=0;i=1;hR=0.45;vR=0.55;md=80;mr=32;syo=1.55;sfo=1;tyo=1;stopAtBlock=true;stopAtEntity=true;hitPlayers=true;hitNonPlayers=false;hitTarget=true;requireLineOfSight=false} @target

# SKILL scope isolates each launch; callbacks share that launch's registry.
OK_SpearStart:
  Skills:
    - setvariable{var=skill.ok_spear_age;type=INTEGER;value=0}

OK_SpearFlight:
  Skills:
    - variableadd{var=skill.ok_spear_age;amount=1}
    - skill{s=OK_SpearGuide} @UUID{u=<skill.var.ok_spear_target>} ?variableInRange{var=skill.ok_spear_age;value=1to5}
    - modifyProjectile{trait=GRAVITY;action=SET;value=0.012} ?variableEquals{var=skill.ok_spear_age;value=5}
    - skill{s=OK_SpearTick} @origin

OK_SpearGuide:
  TargetConditions:
    - entitytype{t=PLAYER} true
  Skills:
    # Aim at torso, not feet; UUID stays fixed even if the boss changes aggro.
    - setProjectileDirection{magnitude=0.35} @LocationsOfTargets{yo=1}

OK_SpearTick:
  Skills:
    - effect:particles{p=dust;color=#B8B8B8;size=0.8;amount=2;hS=0.01;vS=0.01;speed=0} @origin
    - effect:particleline{p=dust;color=#69513A;size=0.5;distanceBetween=0.12;fromOrigin=true;hS=0;vS=0} @ProjectileForward{f=-1.2}

OK_SpearHit:
  TargetConditions:
    - entitytype{t=PLAYER} true
  Skills:
    - damage{a=10;ignoreArmor=false}
    # A piercing spear must not turn back toward a player it already passed.
    - setvariable{var=skill.ok_spear_age;type=INTEGER;value=5} ?variableInRange{var=skill.ok_spear_age;value=0to4}
    - modifyProjectile{trait=GRAVITY;action=SET;value=0.012}

# Same Orc_Archer definition, with a modifier ONLY on the summoned instances.
OK_Summon:
  Cooldown: 30
  Conditions:
    - variableInRange{var=caster.count;value=-2to0} true
    - variableInRange{var=caster.combo;value=>20} true
  Skills:
    - setvariable{var=caster.ok_last_special;value=5;type=INTEGER} @self
    - setvariable{var=caster.count;value=5;type=INTEGER} @self
    - skill{s=OK_Freeze} @self
    - meg:state{mid=orc_king;s=summon;priority=5;override=true;loop=ONCE;force=true;li=0;lo=1} @self
    - delay 25
    - skill{s=OK_SummonSpawn} @self
    - delay 28
    - skill{s=OK_SummonFinish} @self
    - delay 15
    - skill{s=OK_Unlock} @self ?variableEquals{var=caster.count;value=5}

OK_SummonSpawn:
  Conditions:
    - variableEquals{var=caster.count;value=5} true
  Skills:
    - setvariable{var=caster.ok_summon_target;value="00000000-0000-0000-0000-000000000000";type=STRING} @self
    - setvariable{var=caster.ok_summon_target;value="<target.uuid>";type=STRING} @target
    - summon{type=Orc_Archer;amount=1;radius=0;copyThreatTable=false;onSummon=OK_ArcherSpawned} @Forward{f=0;sideOffset=2}
    - summon{type=Orc_Archer;amount=1;radius=0;copyThreatTable=false;onSummon=OK_ArcherSpawned} @Forward{f=0;sideOffset=-2}

OK_ArcherSpawned:
  Skills:
    - setvariable{var=target.ok_summon_target;value="<caster.var.ok_summon_target>";type=STRING}
    - sudoskill{s=OrcArcher_KingSummoned;cat=true}

OK_SummonFinish:
  Conditions:
    - variableEquals{var=caster.count;value=5} true
  Skills:
    - variablesubtract{var=caster.combo;amount=10} @self
    - setvariable{var=caster.combo;type=INTEGER;value=0} @self ?variableInRange{var=caster.combo;value=<0}

# Glaive phases: -1 inactive, 0 takeoff, 1 airborne chase, 2 landing/slash.
# Original glaive_smash is retained in the model for compatibility only.
OK_GlaiveSmash:
  Conditions:
    - variableInRange{var=caster.count;value=-2to0} true
    - variableInRange{var=caster.combo;value=>10} true
  TargetConditions:
    - entitytype{t=PLAYER} true
    - distance{d=>5} true
    - distance{d=0to10} true
  Skills:
    - setvariable{var=caster.ok_last_special;value=6;type=INTEGER} @self
    - setvariable{var=caster.ok_glaive_target;value="<target.uuid>";type=STRING} @target
    - setvariable{var=caster.count;value=6;type=INTEGER} @self
    - setvariable{var=caster.ok_glaive_phase;value=0;type=INTEGER} @self
    - setvariable{var=caster.ok_glaive_age;value=0;type=INTEGER} @self
    - skill{s=OK_Freeze} @self
    - look{headOnly=false;force=true;immediately=true} @target
    # Play the full 22-tick takeoff in 16 ticks; HOLD only covers scheduler skew.
    - meg:state{mid=orc_king;s=glaive_start;priority=6;override=true;loop=HOLD;force=true;speed=1.375;li=0;lo=0} @self

# No delayed callbacks: cancellation/death cannot leave an old impact scheduled.
OK_GlaiveTick:
  Conditions:
    - variableEquals{var=caster.count;value=6} true
  Skills:
    - variableadd{var=caster.ok_glaive_age;amount=1} @self
    - setvariable{var=caster.ok_glaive_valid;value=0;type=INTEGER} @self
    - skill{s=OK_GlaiveTarget} @UUID{u=<caster.var.ok_glaive_target>}
    - skill{s=OK_GlaiveFinish} @self ?variableEquals{var=caster.ok_glaive_valid;value=0}
    # Safety ceiling for unreachable targets; adjust here if longer chases are wanted.
    - skill{s=OK_GlaiveFinish} @self ?variableEquals{var=caster.ok_glaive_phase;value=1} ?variableInRange{var=caster.ok_glaive_age;value=>=200}
    - skill{s=OK_GlaiveBegin} @self ?variableEquals{var=caster.ok_glaive_phase;value=0} ?variableInRange{var=caster.ok_glaive_age;value=>=16}
    - skill{s=OK_GlaiveChase} @UUID{u=<caster.var.ok_glaive_target>}
    - skill{s=OK_SmashTick} @self

OK_GlaiveTarget:
  TargetConditions:
    - entitytype{t=PLAYER} true
    - health{h=>0} true
    - distance{d=0to64} true
  Skills:
    - setvariable{var=caster.ok_glaive_valid;value=1;type=INTEGER} @self

OK_GlaiveBegin:
  Conditions:
    - variableEquals{var=caster.count;value=6} true
    - variableEquals{var=caster.ok_glaive_phase;value=0} true
  Skills:
    - setvariable{var=caster.ok_glaive_phase;value=1;type=INTEGER} @self
    - setvariable{var=caster.ok_glaive_age;value=0;type=INTEGER} @self
    # Register the next state before removal; movement starts on the following tick.
    - meg:state{mid=orc_king;s=glaive;priority=6;override=true;loop=LOOP;force=true;skiplastframe=true;merge=true;li=1;lo=0} @self
    - meg:state{mid=orc_king;s=glaive_start;r=true;i=true;p=6} @self

OK_GlaiveChase:
  Conditions:
    - variableInRange{var=caster.ok_glaive_age;value=>=1} true
    - variableEquals{var=caster.count;value=6} true
    - variableEquals{var=caster.ok_glaive_phase;value=1} true
  TargetConditions:
    - entitytype{t=PLAYER} true
    - health{h=>0} true
    - distance{d=0to64} true
  Skills:
    - setAI{ai=true} @self ?variableEquals{var=caster.ok_glaive_age;value=1}
    - setspeed{speed=2;type=WALK} @self ?variableEquals{var=caster.ok_glaive_age;value=1}
    - look{headOnly=false;force=true;immediately=true} @UUID{u=<caster.var.ok_glaive_target>}
    - goto{s=1;sh=0;sv=0} @UUID{u=<caster.var.ok_glaive_target>}
    - skill{s=OK_SmashBegin} @UUID{u=<caster.var.ok_glaive_target>}

OK_SmashBegin:
  Conditions:
    - variableEquals{var=caster.count;value=6} true
    - variableEquals{var=caster.ok_glaive_phase;value=1} true
  TargetConditions:
    - distance{d=0to3} true
    - lineofsight true
  Skills:
    - setvariable{var=caster.ok_glaive_phase;value=2;type=INTEGER} @self
    - setvariable{var=caster.ok_glaive_age;value=0;type=INTEGER} @self
    - skill{s=OK_Freeze} @self
    - clearpath @self
    - look{headOnly=false;force=true;immediately=true} @UUID{u=<caster.var.ok_glaive_target>}
    - spin{auraName=OK_SmashFacing;d=40;v=0} @self
    - meg:state{mid=orc_king;s=glaive;r=true;i=true;p=6} @self
    # Merge the blend into the timeline so the 2-tick blend does not delay impact.
    - meg:state{mid=orc_king;s=smash;priority=6;override=true;loop=ONCE;force=true;merge=true;li=2;lo=1} @self

OK_SmashTick:
  Conditions:
    - variableEquals{var=caster.count;value=6} true
    - variableEquals{var=caster.ok_glaive_phase;value=2} true
  Skills:
    - skill{s=OK_SmashCue} @self ?variableEquals{var=caster.ok_glaive_age;value=5}
    - skill{s=OK_GlaiveHit} @self ?variableEquals{var=caster.ok_glaive_age;value=7}
    - skill{s=OK_GlaiveFinish} @self ?variableInRange{var=caster.ok_glaive_age;value=>=40}

OK_GlaiveFinish:
  Conditions:
    - variableEquals{var=caster.count;value=6} true
  Skills:
    - skill{s=OK_Freeze} @self
    - skill{s=OK_GlaiveClear} @self
    - skill{s=OK_Unlock} @self

OK_GlaiveClear:
  Skills:
    - auraremove{aura=OK_SmashFacing} @self
    - meg:state{mid=orc_king;s=glaive_start;r=true;i=true;p=6} @self
    - meg:state{mid=orc_king;s=glaive;r=true;i=true;p=6} @self
    - meg:state{mid=orc_king;s=smash;r=true;i=true;p=6} @self
    - setvariable{var=caster.ok_glaive_phase;value=-1;type=INTEGER} @self
    - setvariable{var=caster.ok_glaive_age;value=0;type=INTEGER} @self
    - setvariable{var=caster.ok_glaive_valid;value=0;type=INTEGER} @self
    - setvariable{var=caster.ok_glaive_target;value="00000000-0000-0000-0000-000000000000";type=STRING} @self

OK_GlaiveHit:
  Conditions:
    - variableEquals{var=caster.count;value=6} true
    - variableEquals{var=caster.ok_glaive_phase;value=2} true
    - variableEquals{var=caster.ok_glaive_age;value=7} true
  Skills:
    - damage{a=15;ignoreArmor=false} @LivingInCone{a=180;r=4;rot=0;target=players}
    - skill{s=OK_SmashFeedback} @LivingInCone{a=180;r=4;rot=0;target=players}
    - sound{s=block.anvil.land;v=1.15;p=0.58} @self
    - effect:particles{p=cloud;amount=24;hS=1.6;vS=0.2;speed=0.05;yo=0.15} @Forward{f=1.5}

OK_SmashCue:
  Skills:
    - sound{s=entity.ravager.attack;v=0.9;p=0.55} @self

OK_SmashFeedback:
  TargetConditions:
    - entitytype{t=PLAYER} true
  Skills:
    - sound{s=entity.generic.explode;v=0.55;p=0.75}
    - effect:particles{p=damage_indicator;amount=7;hS=0.35;vS=0.45;speed=0.1;yo=1}

# Every ranged hit updates last attacker, even while the 10-tick gain gate is closed.
OK_RunnerGain:
  TargetConditions:
    - entitytype{t=PLAYER} true
    - distance{d=6to99999} true
  Skills:
    - setvariable{var=caster.ok_runner_target;value="<trigger.uuid>";type=STRING} @self
    - skill{s=OK_RunnerGainGate} @self

OK_RunnerGainGate:
  Conditions:
    - hasaura{n=OK_RunnerGainLock} false
  Skills:
    - aura{auraName=OK_RunnerGainLock;duration=10} @self
    - randomskill{skills=OK_RunnerGain1 1,OK_RunnerGain2 2} @self

OK_RunnerGain1:
  Skills:
    - variableadd{var=caster.runner;amount=1} @self

OK_RunnerGain2:
  Skills:
    - variableadd{var=caster.runner;amount=2} @self

OK_RunnerStart:
  Conditions:
    # Throw requires BOTH combo > 10 and runner >= 10.
    - variableInRange{var=caster.combo;value=>10} true
    - variableInRange{var=caster.runner;value=>9} true
    - variableInRange{var=caster.count;value=-2to0} true
  TargetConditions:
    - entitytype{t=PLAYER} true
    - distance{d=>5} true
    - distance{d=0to64} true
  Skills:
    - setvariable{var=caster.ok_chase_target;value="<caster.var.ok_runner_target>";type=STRING} @self
    - setvariable{var=caster.count;value=7;type=INTEGER} @self
    - clearThreat{} @self
    - threat{amount=200;mode=set} @UUID{u=<caster.var.ok_chase_target>}
    - setTarget @UUID{u=<caster.var.ok_chase_target>}
    - skill{s=OK_Freeze} @self
    - look{headOnly=false;force=true;immediately=true} @UUID{u=<caster.var.ok_chase_target>}
    - meg:state{mid=orc_king;s=throw;priority=7;override=true;loop=ONCE;force=true;li=0;lo=1} @self
    - delay 14
    - skill{s=OK_RunnerRelease} @UUID{u=<caster.var.ok_chase_target>}
    - delay 19
    - skill{s=OK_FastRunBegin} @self

OK_RunnerRelease:
  Conditions:
    - variableEquals{var=caster.count;value=7} true
  Skills:
    # Piercing and immunity persist across the guidance/gravity transition.
    - setvariable{var=skill.ok_spear_target;type=STRING;value="<caster.var.ok_chase_target>"} @self
    - projectile{onStart=OK_SpearStart;onTick=OK_SpearFlight;onHit=OK_SpearHit;v=20;g=0;i=1;hR=0.45;vR=0.55;md=100;mr=40;syo=1.55;sfo=1;tyo=1;immuneDelay=10000;stopAtBlock=true;stopAtEntity=false;hitPlayers=true;hitNonPlayers=false;hitTarget=true;requireLineOfSight=false} @UUID{u=<caster.var.ok_chase_target>}

OK_FastRunBegin:
  Conditions:
    - variableEquals{var=caster.count;value=7} true
  Skills:
    - setvariable{var=caster.count;value=8;type=INTEGER} @self
    - setspeed{speed=1.5;type=WALK} @self
    - setAI{ai=true} @self
    - aura{auraName=OK_RunnerPresent;duration=40} @self
    - meg:state{mid=orc_king;s=run;priority=7;loop=LOOP;force=true;li=1;lo=1} @self

OK_RunnerMaintain:
  Conditions:
    - variableEquals{var=caster.count;value=8} true
  TargetConditions:
    - entitytype{t=PLAYER} true
    - distance{d=0to64} true
  Skills:
    - auraremove{aura=OK_RunnerPresent} @self
    - aura{auraName=OK_RunnerPresent;duration=40} @self
    - setTarget @UUID{u=<caster.var.ok_chase_target>}
    - goto{s=1;sh=0;sv=0} @UUID{u=<caster.var.ok_chase_target>}

OK_FastRunStop:
  Conditions:
    - variableEquals{var=caster.count;value=8} true
  TargetConditions:
    - entitytype{t=PLAYER} true
    - distance{d=0to2} true
  Skills:
    - skill{s=OK_RunnerFinish} @self

OK_RunnerLost:
  Conditions:
    - variableEquals{var=caster.count;value=8} true
    - hasaura{n=OK_RunnerPresent} false
  Skills:
    - skill{s=OK_RunnerFinish} @self

OK_RunnerFinish:
  Conditions:
    - variableEquals{var=caster.count;value=8} true
  Skills:
    # SET, never ADD. Other players' naturally accumulated threat is retained.
    - threat{amount=30;mode=set} @UUID{u=<caster.var.ok_chase_target>}
    - meg:state{mid=orc_king;s=run;r=true;i=true;p=7} @self
    - auraremove{aura=OK_RunnerPresent} @self
    - setvariable{var=caster.runner;value=0;type=INTEGER} @self
    - skill{s=OK_Unlock} @self

# Default OP permission, NOT an isOp() check. Do not grant this node to non-OPs.
# No explicit @target here: retain only the permission-filtered recipients.
OK_DebugDamage:
  TargetConditions:
    - entitytype{t=PLAYER} true
    - haspermission{p=minecraft.command.op} true
  Skills:
    - message{m="&8[OrcKing DEBUG] &f<trigger.name> &7-> damage=&e<skill.var.damage-amount-post{default=<skill.var.damage-amount>}> &7| combo=&e<caster.var.combo> &7| runner=&e<caster.var.runner> &7| count=&e<caster.var.count> &7| ThreatTop=&e<caster.tt.top>"}

OK_Death:
  Skills:
    - setvariable{var=caster.count;value=99;type=INTEGER} @self
    - skill{s=OK_GlaiveClear} @self
    - skill{s=OK_Freeze} @self
    - meg:state{mid=orc_king;s=run;r=true;i=true;p=7} @self
    - meg:state{mid=orc_king;s=attack1;r=true;i=true;p=4} @self
    - meg:state{mid=orc_king;s=attack2;r=true;i=true;p=4} @self
    - meg:state{mid=orc_king;s=attack3;r=true;i=true;p=4} @self
    - meg:state{mid=orc_king;s=throw;r=true;i=true;p=4} @self
    - meg:state{mid=orc_king;s=summon;r=true;i=true;p=5} @self
    - meg:state{mid=orc_king;s=glaive_smash;r=true;i=true;p=6} @self
    - meg:state{mid=orc_king;s=throw;r=true;i=true;p=7} @self
    - meg:state{mid=orc_king;s=death;priority=10;override=true;loop=ONCE;force=true;li=0;lo=1} @self

# Rear half-space relative to the base entity's facing at the damage event.
# Only player attackers affect this override; no cooldown was requested.
OK_RearHitThreat:
  TargetConditions:
    - entitytype{t=PLAYER} true
    - fieldofview{angle=180;rotation=180} true
  Skills:
    # Evaluate direction now, but overwrite after this hit's normal threat update.
    - delay 1
    - skill{s=OK_RearHitThreatApply} @trigger

OK_RearHitThreatApply:
  Conditions:
    - variableEquals{var=caster.count;value=99} false
  Skills:
    - clearThreat{} @self
    - threat{amount=100;mode=set} @trigger
    - setTarget @trigger
