# ============================================================
# Pattern4 - 고블린 시체 부활
#
# 샤먼이 주문을 외운 뒤:
# - 되살아난 부하 1마리
# - 되살아난 전사 1마리
# 를 주변 땅에서 소환.
#
# 소환몹 쪽에는 DetectPlayer/Rally 스킬이 아예 없으므로
# 나팔 호출은 절대 발생하지 않는다.
# ============================================================

GoblinShaman_Pattern4_SummonUndead:
  Cooldown: 20
  Conditions:
    - variableIsSet{var=caster.shaman_final_active} false
    - variableIsSet{var=caster.shaman_flee_counter} false
    - variableIsSet{var=caster.shaman_casting} false
    - targetwithin{d=16} true

  Skills:
    # 소환 도중 다른 이동/스킬보다 이 패턴을 우선.
    - setvariable{var=caster.shaman_casting;value=1;type=INTEGER;duration=54}
    - potion{type=SLOWNESS;duration=54;level=255;particles=false} @self

    # 먼저 플레이어를 확실히 바라본 뒤 주문 시작.
    - look{headOnly=false;force=true;immediately=true} @target
    - delay 2
    - look{headOnly=false;force=true;immediately=true} @target

    # 현재 샤먼 모델에 전용 pattern4가 없으므로
    # 기존 캐스팅 동작 중 가장 무난한 pattern3 포즈를 임시 사용.
    - state{s=pattern3;li=0;lo=0} @self

    # 죽은 고블린들을 깨우는 전조.
    - sound{s=entity.evoker.prepare_wololo;v=0.90;p=0.48} @self
    - effect:particlering{particle=soul;radius=2.6;points=28;amount=1;hS=0;vS=0;y=0.12} @self
    - effect:particles{p=ash;amount=26;hS=1.6;vS=0.25;y=0.20} @self

    - delay 10
    - look{headOnly=false;force=true;immediately=true} @target
    - sound{s=block.soul_sand.break;v=0.85;p=0.60} @self
    - effect:particles{p=soul;amount=16;hS=1.5;vS=0.55;y=0.45} @self

    # 샤먼이 플레이어를 바라본 방향을 기준으로
    # 정확히 좌/우에 한 마리씩 부활시킨다.
    #
    # Worker  : 샤먼 왼쪽 3블럭
    # Warrior : 샤먼 오른쪽 3블럭
    #
    # 랜덤 noise는 제거해서 항상 양옆에서 올라오게 함.
    - delay 6
    - look{headOnly=false;force=true;immediately=true} @target
    - summon{t=Goblin_Undead_Worker;a=1;yr=0;noise=0} @Forward{f=0;sideOffset=-3;y=0}

    - delay 3
    - look{headOnly=false;force=true;immediately=true} @target
    - summon{t=Goblin_Undead_Warrior;a=1;yr=0;noise=0} @Forward{f=0;sideOffset=3;y=0}

    - sound{s=entity.zombie_villager.converted;v=0.65;p=0.62} @self
    - effect:particles{p=soul;amount=22;hS=1.8;vS=0.70;y=0.40} @self


GoblinShaman_Pattern1:
  Cooldown: 9
  Conditions:
    - variableIsSet{var=caster.shaman_final_active} false
    - variableIsSet{var=caster.shaman_flee_counter} false
    - variableIsSet{var=caster.shaman_casting} false
    - targetwithin{d=15} true
    - targetwithin{d=5} false

  Skills:
    - setvariable{var=caster.shaman_casting;value=1;type=INTEGER;duration=70}
    - potion{type=SLOWNESS;duration=70;level=255;particles=false} @self
    # 스킬 시작 전 최우선 조준 단계:
    # 이동을 잠근 상태에서 플레이어를 강제로 바라본 뒤 실제 패턴 시작.
    - look{headOnly=false;force=true;immediately=true} @target
    - delay 2
    - look{headOnly=false;force=true;immediately=true} @target
    - state{s=pattern1;li=0;lo=0} @self
    - sound{s=entity.evoker.prepare_summon;v=0.8;p=0.72} @self

    # --------------------------------------------------------
    # 이상적인 단일 projectile 구조
    #
    # 1) 처음부터 projectile 하나 생성
    # 2) caster 변수 fireball_velocity = 0
    # 3) onTick에서 매 틱 modifyProjectile로 현재 속도를 이 변수에 맞춤
    # 4) 2.25초 뒤 변수만 14로 변경
    # 5) 같은 MOB bullet이 그대로 출발
    #
    # charge helper / 발사용 helper 없음.
    # --------------------------------------------------------
    # 실제 projectile 기본 속도는 처음부터 정상값 14.
    # onStart에서 실제 velocity vector만 0.001배로 줄여
    # 방향정보를 유지한 채 사실상 정지시킨다.
    - setvariable{var=caster.shaman_fireball_release;value=0;type=INTEGER}

    - projectile{
        bulletType=MOB;
        mob=Goblin_Shaman_Fireball_Projectile;
        onStart=GoblinShaman_P1_Fireball_FREEZE;
        onTick=GoblinShaman_P1_Fireball_TICK;
        onEnd=GoblinShaman_P1_Fireball_END;
        v=14;
        i=1;
        hR=0.9;
        vR=0.9;
        md=120;
        mr=40;
        syo=1.35;
        sfo=1.25;
        tyo=0;
        stopAtBlock=true;
        stopAtEntity=true
      } @target

    # 0.00 ~ 2.25초 : 같은 projectile은 정지한 채 충전
    - skill{s=GoblinShaman_P1_MagicCircle} @self
    - delay 5
    - look{headOnly=false;force=true;immediately=true} @target
    - skill{s=GoblinShaman_P1_MagicCircle} @self
    - delay 5
    - look{headOnly=false;force=true;immediately=true} @target
    - skill{s=GoblinShaman_P1_MagicCircle} @self
    - delay 5
    - look{headOnly=false;force=true;immediately=true} @target
    - skill{s=GoblinShaman_P1_MagicCircle} @self
    - delay 5
    - look{headOnly=false;force=true;immediately=true} @target
    - skill{s=GoblinShaman_P1_MagicCircle} @self
    - delay 5
    - look{headOnly=false;force=true;immediately=true} @target
    - skill{s=GoblinShaman_P1_MagicCircle} @self
    - delay 5
    - look{headOnly=false;force=true;immediately=true} @target
    - skill{s=GoblinShaman_P1_MagicCircle} @self
    - delay 5
    - look{headOnly=false;force=true;immediately=true} @target
    - skill{s=GoblinShaman_P1_MagicCircle} @self
    - delay 5
    - look{headOnly=false;force=true;immediately=true} @target
    - skill{s=GoblinShaman_P1_MagicCircle} @self
    - delay 5

    # 45틱 = 2.25초
    # 여기서는 projectile을 직접 건드리지 않고 변수만 바꿈.
    # 실제 modifyProjectile은 계속 onTick 내부에서 실행됨.
    - sound{s=entity.blaze.shoot;v=1.0;p=0.72} @self
    - setvariable{var=caster.shaman_fireball_release;value=1;type=INTEGER}


GoblinShaman_P1_MagicCircle:
  Skills:
    - effect:particlering{particle=flame;radius=1.35;points=24;amount=1;hS=0;vS=0;y=0.10} @self
    - effect:particlering{particle=enchant;radius=0.85;points=16;amount=1;hS=0;vS=0;y=0.12} @self


GoblinShaman_P1_Fireball_FREEZE:
  Skills:
    # v=14로 만들어진 projectile의 실제 방향 벡터를 보존하면서
    # 0.001배로 줄여 사실상 정지.
    # 정확히 0으로 만들지 않는 이유는 발사 방향 벡터를 잃지 않기 위해서.
    - projectilevelocity{mode=MULTIPLY;vx=0.001;vy=0.001;vz=0.001}


GoblinShaman_P1_Fireball_RELEASE:
  Conditions:
    - variableEquals{var=caster.shaman_fireball_release;value=1}
  Skills:
    # 1) 먼저 같은 projectile의 실제 속도를 원래 v=14 수준으로 복원.
    - projectilevelocity{mode=MULTIPLY;vx=1000;vy=1000;vz=1000}

    # 2) 속도가 정상으로 복구된 뒤 방향만 현재 플레이어에게 재조준.
    # projectile callback에서는 기존 @target 문맥을 믿지 않고
    # projectile 위치 기준 가장 가까운 플레이어를 직접 찾는다.
    - setprojectiledirection{magnitude=1} @NearestPlayer{r=30}

    # 같은 projectile에서 한 번만 실행.
    - setvariable{var=caster.shaman_fireball_release;value=2;type=INTEGER}


GoblinShaman_P1_Fireball_TICK:
  Skills:
    # release가 1인 그 틱에 현재 projectile 문맥에서 실제 벡터를 복원.
    - skill{s=GoblinShaman_P1_Fireball_RELEASE}

    # 테스트 v6에서 맞춘 파티클 -0.25Y 보정
    - effect:particles{p=flame;amount=9;hS=0.20;vS=0.20;y=-0.25} @origin
    - effect:particles{p=small_flame;amount=6;hS=0.15;vS=0.15;y=-0.25} @origin
    - effect:particles{p=smoke;amount=1;hS=0.06;vS=0.06;y=-0.25} @origin


GoblinShaman_P1_Fireball_END:
  Skills:
    - effect:particles{p=flame;amount=32;hS=0.75;vS=0.65;y=-0.25} @origin
    - effect:particles{p=small_flame;amount=18;hS=0.60;vS=0.55;y=-0.25} @origin
    - effect:particles{p=smoke;amount=12;hS=0.50;vS=0.40;y=-0.25} @origin
    - damage{a=12} @PlayersNearOrigin{r=1.9}
    - throw{velocity=0.25;velocityY=0.10} @PlayersNearOrigin{r=1.9}
    - sound{s=entity.generic.explode;v=0.90;p=1.05} @origin

