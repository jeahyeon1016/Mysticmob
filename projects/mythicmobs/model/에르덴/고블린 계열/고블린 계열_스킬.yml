# ============================================================
# Goblin Pack Skills
# v1.49
# ============================================================

# ------------------------------------------------------------
# 고블린 부하
# ------------------------------------------------------------

GoblinWorker_Attack:
  Skills:
    # 일꾼이 워리어를 '도망 목적지'로 AI 타겟 잡았을 때도
    # meleeattack이 공격 이벤트를 발생시키므로 실제 공격은 항상 취소.
    - cancelevent

    # 현재 AI 타겟이 PLAYER일 때만 실제 공격 애니메이션/판정 실행.
    # 워리어를 향해 도망가는 동안에는 공격 모션을 절대 재생하지 않음.
    - skill{s=GoblinWorker_AttackExecute} @target

GoblinWorker_AttackExecute:
  Conditions:
    - variableIsSet{var=caster.worker_attack_lock} false
    - variableIsSet{var=caster.goblin_calling} false
  TargetConditions:
    - entitytype{t=PLAYER} true
  Skills:
    # 24틱 = 1.20초 동안 다음 평타 시작 잠금
    - setvariable{var=caster.worker_attack_lock;value=1;type=INTEGER;duration=24}
    - look{headOnly=false;immediately=true} @target
    - state{s=attack;li=0;lo=0} @self

    # 0.75초 = 15틱
    - delay 15
    - skill{s=GoblinWorker_AttackHit} @self
    - sound{s=entity.player.attack.sweep;v=0.65;p=1.25} @self

GoblinWorker_AttackHit:
  Skills:
    # 전방 90도 / 3블럭 부채꼴 판정
    - damage{a=4} @LivingInCone{a=90;r=3;rot=0;target=players}

# ------------------------------------------------------------
# 고블린 공통 인식 / 소집 시스템
# ------------------------------------------------------------
#
# 기본 인식: 7블럭
# 소집 반경: 소집한 고블린 기준 20블럭
#
# goblin_call_used
#   - 최초 소집을 이미 했는지 표시
#   - 자연 인식으로 소집하면 1
#   - 다른 고블린의 소집을 받고 온 개체도 즉시 1
#   -> 소집되어 온 고블린은 다시 소집하지 않음
#
# goblin_recruited
#   - 다른 고블린의 소집을 받고 합류한 개체 표시
# ------------------------------------------------------------

GoblinWorker_DetectPlayer:
  Conditions:
    - variableIsSet{var=caster.goblin_call_used} false
    - playerwithin{d=7} true
  Skills:
    # 일꾼이 직접 플레이어를 발견한 경우:
    # 1) 위협 플레이어를 인식
    # 2) 최초 1회 소집
    # 3) 가까운 워리어에게 도망
    - settarget @NearestPlayer{r=7}
    - skill{s=GoblinWorker_CallOnce} @self

GoblinWarrior_DetectPlayer:
  Conditions:
    - variableIsSet{var=caster.goblin_call_used} false
    - playerwithin{d=7} true
  Skills:
    - settarget @NearestPlayer{r=7}
    - skill{s=GoblinWarrior_CallOnce} @self

GoblinWorker_CallOnce:
  Skills:
    # 이 개체는 이후 다시 소집하지 않음
    - setvariable{var=caster.goblin_call_used;value=1;type=INTEGER}

    # 소집 모션 동안 이동/공격 잠금
    - setvariable{var=caster.goblin_calling;value=1;type=INTEGER;duration=24}
    - potion{type=SLOWNESS;duration=24;level=255;particles=false} @self

    # 일꾼 도움 요청 모션
    - state{s=call;li=0;lo=0} @self

    # 낮은 염소뿔 소리 1회만 재생
    - sound{s=item.goat_horn.sound.0;v=1.15;p=0.76} @self

    - effect:particles{p=angry_villager;amount=5;hS=0.25;vS=0.25;y=1.65} @self

    # 소집자 기준 반경 20블럭의 두 고블린 종류에만 신호
    - signal{s=GOBLIN_RALLY} @MobsInRadius{r=20;types=Goblin_Worker,Goblin_Warrior,Goblin_Shaman,Goblin_Thrower}

    # call 애니메이션(1.2초)이 끝난 뒤에만 워리어 쪽으로 이동 시작.
    - delay 24

    # '직접 발견한 최초 1회'에만 가장 가까운 워리어를 찾아 도망감.
    # 20블럭 안에 워리어가 없으면 이 스킬 자체가 실행되지 않아서
    # DetectPlayer에서 잡아둔 플레이어 타겟을 그대로 유지 = 즉시 전투.
    - skill{s=GoblinWorker_StartFleeToWarrior} @MobsInRadius{r=20;types=Goblin_Warrior;sort=NEAREST;limit=1}

GoblinWorker_StartFleeToWarrior:
  Skills:
    # 이 메타스킬은 @MobsInRadius로 선택된 '워리어'를 상속 타겟으로 받음.
    # @target은 몹의 기존 AI 타겟(플레이어)을 가리키므로 사용하면 다시 플레이어에게 감.
    # @TargetedTarget은 이 메타스킬에 상속된 워리어를 정확히 가리킴.
    - setvariable{var=caster.worker_fleeing;value=1;type=INTEGER}
    - settarget @TargetedTarget

GoblinWarrior_CallOnce:
  Skills:
    - setvariable{var=caster.goblin_call_used;value=1;type=INTEGER}

    # rally 모션 동안 이동/공격 잠금 (1.15초 ≈ 23틱)
    - setvariable{var=caster.goblin_calling;value=1;type=INTEGER;duration=23}
    - potion{type=SLOWNESS;duration=23;level=255;particles=false} @self

    # 워리어는 rally 모션으로 소집
    - state{s=rally;li=0;lo=0} @self

    - sound{s=item.goat_horn.sound.0;v=1.25;p=0.72} @self

    - effect:particles{p=crit;amount=6;hS=0.3;vS=0.35;y=1.8} @self
    - signal{s=GOBLIN_RALLY} @MobsInRadius{r=20;types=Goblin_Worker,Goblin_Warrior,Goblin_Shaman,Goblin_Thrower}

Goblin_ReceiveRally:
  Conditions:
    # 이미 직접 발견해서 소집했거나, 이전에 소집된 고블린은 신호를 다시 받지 않음.
    # 호출자 자신도 CallOnce 시작에서 goblin_call_used=1이므로 자기 신호 무시.
    - variableIsSet{var=caster.goblin_call_used} false
  Skills:
    # 소집되어 온 고블린은 다시 소집 패턴을 실행하지 않음
    - setvariable{var=caster.goblin_call_used;value=1;type=INTEGER}
    - setvariable{var=caster.goblin_recruited;value=1;type=INTEGER}

    # 소집자는 플레이어에서 최대 7블럭,
    # 수신자는 소집자에서 최대 20블럭이므로 플레이어 탐색 최대치를 27로 둠.
    - settarget @NearestPlayer{r=27}
    - effect:particles{p=cloud;amount=3;hS=0.15;vS=0.1;y=0.4} @self

# 일꾼이 워리어에게 도망가는 도중 매 틱 검사.
# 현재 AI 타겟이 워리어이고 그 워리어 3블럭 안에 들어가면
# 다시 플레이어를 타겟으로 잡고 함께 싸우기 시작.
GoblinWorker_FleeCheck:
  Conditions:
    - variableIsSet{var=caster.worker_fleeing} true
    - variableIsSet{var=caster.worker_joined} false
  Skills:
    # 기존 targetwithin 체크는 현재 AI 타겟 기준 판정 때문에
    # 워리어 도착 감지가 불안정했음.
    # 이제 '실제로 3블럭 안에 워리어가 존재하는지' 직접 검사.
    - skill{s=GoblinWorker_JoinFight} @MobsInRadius{r=3;types=Goblin_Warrior;limit=1;sort=NEAREST}

GoblinWorker_JoinFight:
  TargetConditions:
    - distance{d=<3.1} true
  Skills:
    # 워리어 근처에 도착한 순간 1회만 실행
    - setvariable{var=caster.worker_joined;value=1;type=INTEGER}

    # 도망 상태 자체를 해제
    - variableUnset{var=caster.worker_fleeing} @self

    # 워리어 타겟을 버리고 즉시 플레이어로 전환
    - settarget @NearestPlayer{r=27}
    - effect:particles{p=crit;amount=4;hS=0.2;vS=0.2;y=1.0} @self

# 직접 맞았을 때 어그로 처리.
# 워리어에게 도망가는 중에는 피격돼도 목적지 타겟을 플레이어로 덮어쓰지 않음.
# 워리어가 없어서 바로 전투 중이거나, 워리어 도착 후에는 정상적으로 공격자를 타겟.
GoblinWorker_AggroOnDamaged:
  Conditions:
    - variableIsSet{var=caster.worker_fleeing} false
  Skills:
    - settarget @trigger

# 워리어 전투 중 강공격 패턴
GoblinWarrior_CombatPattern:
  Conditions:
    - targetwithin{d=4} true
  Skills:
    - skill{s=GoblinWarrior_HeavyAttack} @target 0.32

GoblinWorker_HurtSound:
  Cooldown: 0.35
  Skills:
    # 작고 날카로운 고블린 목소리. 좀비 사운드 사용 X.
    - sound{s=entity.pillager.hurt;v=0.78;p=1.34} @self
    - sound{s=entity.evoker.hurt;v=0.18;p=1.48} @self

GoblinWorker_Death:
  Skills:
    - state{s=death;li=0;lo=0} @self
    # 작은 고블린: 짧고 높은 비명
    - sound{s=entity.pillager.death;v=0.78;p=1.32} @self
    - sound{s=entity.evoker.death;v=0.16;p=1.48} @self

GoblinWarrior_NormalAttack:
  Skills:
    # 바닐라 좀비 평타를 항상 취소해서 선딜 이전의 즉발 데미지 방지
    - cancelevent
    - skill{s=GoblinWarrior_NormalAttackExecute} @self

GoblinWarrior_NormalAttackExecute:
  Conditions:
    - variableIsSet{var=caster.warrior_attack_lock} false
    - variableIsSet{var=caster.goblin_calling} false
  Skills:
    # 29틱 = 1.45초 동안 다음 평타 시작 잠금
    - setvariable{var=caster.warrior_attack_lock;value=1;type=INTEGER;duration=29}
    - state{s=attack;li=0;lo=0} @self

    # 요청 타점 0.82초.
    # MythicMobs delay는 1틱(0.05초) 단위라 가장 가까운 16틱 = 0.80초로 적용.
    - delay 16
    - skill{s=GoblinWarrior_NormalHit} @target
    - sound{s=entity.player.attack.strong;v=0.9;p=0.8} @self

GoblinWarrior_NormalHit:
  TargetConditions:
    - distance{d=<3.2} true
    - fieldofview{angle=100} true
  Skills:
    - damage{a=8} @target

# 전사가 가끔 강공격을 사용하도록 별도 패턴으로 호출할 수 있음.
GoblinWarrior_HeavyAttack:
  Cooldown: 5
  Conditions:
    - variableIsSet{var=caster.goblin_calling} false
  Skills:
    - state{s=heavy_attack;li=0;lo=0} @self
    - sound{s=item.armor.equip_iron;v=0.55;p=0.75} @self

    # 0.85초 = 17틱
    - delay 17
    - effect:particles{p=sweep_attack;amount=3;hS=0.8;vS=0.2;y=1.0} @self
    - damage{a=13} @PlayersInRadius{r=2.8}
    - throw{velocity=0.45;velocityY=0.12} @PlayersInRadius{r=2.8}
    - sound{s=entity.player.attack.knockback;v=1.0;p=0.75} @self

GoblinWarrior_HurtSound:
  Cooldown: 0.35
  Skills:
    # 일반 고블린보다 굵고 무거운 톤.
    - sound{s=entity.vindicator.hurt;v=0.82;p=1.08} @self
    - sound{s=entity.pillager.hurt;v=0.22;p=1.16} @self

GoblinWarrior_Death:
  Skills:
    - state{s=death;li=0;lo=0} @self
    # 전사: 같은 종족이지만 더 굵고 무거운 톤
    - sound{s=entity.vindicator.death;v=0.86;p=0.94} @self
    - sound{s=entity.pillager.death;v=0.20;p=1.02} @self

GoblinShaman_DetectPlayer:
  Conditions:
    - playerwithin{d=7} true
  Skills:
    - settarget @NearestPlayer{r=7}



# ------------------------------------------------------------
# 샤먼 근접 도주 -> 즉시 반격 메커니즘
# ------------------------------------------------------------
#
# fleeplayers AI는 '이동'만 담당한다.
# 아래 스킬은 전투 상태를 메커니즘으로 제어:
#
# 플레이어 3블럭 진입
#   -> flee counter lock
#   -> 0.6초 동안 도주
#   -> 플레이어를 즉시 바라봄
#   -> 바로 주문 시전
#
# 일반 패턴 타이머가 도주 도중 먼저 주문을 쓰지 못하도록
# shaman_casting / shaman_flee_counter 변수로 잠금.
GoblinShaman_FleeCounter:
  Conditions:
    - variableIsSet{var=caster.shaman_final_active} false
    - variableIsSet{var=caster.shaman_casting} false
    - variableIsSet{var=caster.shaman_flee_counter} false
    - targetwithin{d=3} true

  Skills:
    # 현재 플레이어를 확실하게 전투 타겟으로 유지
    - settarget @NearestPlayer{r=7}

    # 도주 중 일반 주문 타이머 차단
    - setvariable{var=caster.shaman_flee_counter;value=1;type=INTEGER}
    - setvariable{var=caster.shaman_casting;value=1;type=INTEGER}

    # fleeplayers AI가 먼저 거리를 벌림.
    # 12틱 = 0.6초
    - delay 12

    # ========================================================
    # 도주 종료 -> 공격 준비
    # 여기부터는 이동 AI보다 공격 준비가 무조건 우선.
    # ========================================================

    # 먼저 완전히 멈춤.
    - potion{type=SLOWNESS;duration=8;level=255;particles=false} @self

    # 플레이어를 몸 전체로 강제 조준.
    - look{headOnly=false;force=true;immediately=true} @target

    # 2틱 동안 시선을 고정해 이동 AI가 방향을 다시 뺏지 못하게 함.
    - delay 2
    - look{headOnly=false;force=true;immediately=true} @target

    # 일반 Pattern 조건을 다시 열고 즉시 반격.
    - variableUnset{var=caster.shaman_casting} @self
    - variableUnset{var=caster.shaman_flee_counter} @self

    # 5블럭보다 멀면 화염구.
    # Pattern1이 성공하면 shaman_casting이 즉시 다시 잡혀 Pattern2는 실패.
    - skill{s=GoblinShaman_Pattern1} @target

    # 아직 5블럭 이내면 연쇄 불기둥.
    - skill{s=GoblinShaman_Pattern2} @target


# 캐스팅 상태에서는 2틱마다 현재 타겟을 다시 바라봄.
# 플레이어가 옆으로 움직여도 주문 시전 방향이 계속 플레이어를 따라감.
GoblinShaman_CastLook:
  Conditions:
    - variableIsSet{var=caster.shaman_final_active} false
    - variableIsSet{var=caster.shaman_casting} true
  Skills:
    # force=true:
    # 걷기/도주/pathfinding/기타 회전 AI보다 우선해서
    # 시전 중에는 몸 전체가 현재 플레이어 타겟을 강제로 바라봄.
    - look{headOnly=false;force=true;immediately=true} @target

# ------------------------------------------------------------
# 기본 마력탄
# ------------------------------------------------------------

# ------------------------------------------------------------
# Pattern2 [연쇄 불기둥] : 전방 순차 화염기둥
# ------------------------------------------------------------

GoblinShaman_Pattern2:
  Cooldown: 6
  Conditions:
    - variableIsSet{var=caster.shaman_final_active} false
    - variableIsSet{var=caster.shaman_flee_counter} false
    - variableIsSet{var=caster.shaman_casting} false
    - targetwithin{d=10} true
  Skills:
    - setvariable{var=caster.shaman_casting;value=1;type=INTEGER;duration=34}
    - potion{type=SLOWNESS;duration=34;level=255;particles=false} @self
    # 스킬 시작 전 최우선 조준 단계:
    # 이동을 잠근 상태에서 플레이어를 강제로 바라본 뒤 실제 패턴 시작.
    - look{headOnly=false;force=true;immediately=true} @target
    - delay 2
    - look{headOnly=false;force=true;immediately=true} @target
    - state{s=pattern2;li=0;lo=0} @self

    # 0.00 ~ 0.75초 : 기 모으기
    - sound{s=entity.evoker.prepare_attack;v=0.85;p=0.72} @self
    - effect:particles{p=flame;amount=12;hS=0.25;vS=0.35;y=1.35} @self
    - delay 5
    - look{headOnly=false;force=true;immediately=true} @target
    - effect:particles{p=flame;amount=16;hS=0.28;vS=0.40;y=1.35} @self
    - delay 5
    - look{headOnly=false;force=true;immediately=true} @target
    - effect:particles{p=small_flame;amount=20;hS=0.32;vS=0.45;y=1.35} @self

    # 0.75초 이후:
    # 각 기둥을 샤먼 정면 기준으로 직접 다른 @Forward 좌표에 생성.
    # nested skill + @origin 구조를 제거해서 모든 기둥이 같은 자리에서
    # 터지는 문제를 없앰.
    #
    # 거리: 2.5 -> 5.5 -> 8.5 -> 11.5

    # 1번 기둥
    - delay 5
    - look{headOnly=false;force=true;immediately=true} @target
    - effect:particlering{particle=flame;radius=1.15;points=20;amount=1;hS=0;vS=0;y=0.08} @Forward{f=2.5;y=0}
    - effect:particlering{particle=smoke;radius=0.75;points=12;amount=1;hS=0;vS=0;y=0.10} @Forward{f=2.5;y=0}
    - effect:particles{p=lava;amount=7;hS=0.45;vS=0.12;y=0.18} @Forward{f=2.5;y=0}
    - sound{s=entity.generic.explode;v=0.55;p=0.72} @Forward{f=2.5;y=0}
    - sound{s=block.lava.pop;v=0.80;p=0.78} @Forward{f=2.5;y=0}
    - effect:particles{p=explosion;amount=1;hS=0.12;vS=0.08;y=0.15} @Forward{f=2.5;y=0}
    - effect:particles{p=lava;amount=12;hS=0.55;vS=0.35;y=0.35} @Forward{f=2.5;y=0}
    - effect:particles{p=large_smoke;amount=8;hS=0.50;vS=0.30;y=0.30} @Forward{f=2.5;y=0}
    - totem{onTick=GoblinShaman_P2_FirePillarTick;onHit=GoblinShaman_P2_FirePillarHit;ch=1;i=1;md=7;hR=1.50;vR=3.2;yo=0.1;hs=true;hfs=0.1} @Forward{f=2.5;y=0}

    # 2번 기둥
    - delay 4
    - look{headOnly=false;force=true;immediately=true} @target
    - effect:particlering{particle=flame;radius=1.15;points=20;amount=1;hS=0;vS=0;y=0.08} @Forward{f=5.5;y=0}
    - effect:particlering{particle=smoke;radius=0.75;points=12;amount=1;hS=0;vS=0;y=0.10} @Forward{f=5.5;y=0}
    - effect:particles{p=lava;amount=7;hS=0.45;vS=0.12;y=0.18} @Forward{f=5.5;y=0}
