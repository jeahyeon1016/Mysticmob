        md=140;
        mr=50;
        syo=7.1;
        sfo=0;
        tyo=0;
        stopAtBlock=true;
        stopAtEntity=true
      } @target

    - sound{s=block.respawn_anchor.charge;v=0.65;p=0.72} @self

    # 0.85 ~ 2.75초 동안 같은 projectile이 그 자리에서 charge
    - delay 5
    - look{headOnly=false;force=true;immediately=true} @target
    - delay 4
    - look{headOnly=false;force=true;immediately=true} @target
    - delay 5
    - look{headOnly=false;force=true;immediately=true} @target
    - delay 8
    - look{headOnly=false;force=true;immediately=true} @target
    - delay 8
    - look{headOnly=false;force=true;immediately=true} @target
    - delay 8
    - look{headOnly=false;force=true;immediately=true} @target

    # projectile 생성 후 정확히 38틱 = 1.90초
    # 전체 패턴 기준 0.85 + 1.90 = 2.75초
    #
    # 여기서도 projectile을 새로 만들지 않음.
    # release 플래그만 올리고, 실제 velocity vector 복원은
    # 바로 다음 projectile onTick에서 실행.
    - sound{s=entity.blaze.shoot;v=1.2;p=0.55} @self
    - setvariable{var=caster.shaman_meteor_release;value=1;type=INTEGER}



GoblinShaman_P3_Meteor_FREEZE:
  Skills:
    # v=14 방향 벡터는 유지하고 0.001배로 줄여 사실상 정지.
    - projectilevelocity{mode=MULTIPLY;vx=0.001;vy=0.001;vz=0.001}


GoblinShaman_P3_Meteor_RELEASE:
  Conditions:
    - variableEquals{var=caster.shaman_meteor_release;value=1}
  Skills:
    # 1) 먼저 원래 v=14 수준으로 실제 velocity 복원.
    - projectilevelocity{mode=MULTIPLY;vx=1000;vy=1000;vz=1000}

    # 2) 복구된 속도의 크기는 유지하고,
    # 발사 순간 projectile 기준 가장 가까운 플레이어 방향으로만 회전.
    - setprojectiledirection{magnitude=1} @NearestPlayer{r=40}

    - setvariable{var=caster.shaman_meteor_release;value=2;type=INTEGER}


GoblinShaman_P3_Meteor_TICK:
  Skills:
    # 발사 틱에 실제 projectile vector를 복원.
    - skill{s=GoblinShaman_P3_Meteor_RELEASE}

    # 정지/비행 모두 같은 projectile origin
    - effect:particles{p=portal;amount=8;hS=0.30;vS=0.28} @origin
    - effect:particles{p=witch;amount=5;hS=0.22;vS=0.20} @origin
    - effect:particles{p=large_smoke;amount=3;hS=0.18;vS=0.18} @origin


GoblinShaman_P3_Meteor_END:
  Skills:
    - effect:particles{p=witch;amount=42;hS=1.35;vS=0.80} @origin
    - effect:particles{p=portal;amount=34;hS=1.20;vS=0.70} @origin
    - effect:particles{p=large_smoke;amount=30;hS=1.30;vS=0.75} @origin
    - effect:particles{p=explosion;amount=3;hS=0.55;vS=0.35} @origin
    - damage{a=14} @PlayersNearOrigin{r=3.5}
    - throw{velocity=0.55;velocityY=0.22} @PlayersNearOrigin{r=3.5}
    - sound{s=entity.generic.explode;v=1.30;p=0.68} @origin

