# 피격 / 사망
# ------------------------------------------------------------

GoblinShaman_HurtSound:
  Cooldown: 0.35
  Skills:
    # 같은 고블린 계열이지만 샤먼은 더 높은 피치.
    - sound{s=entity.evoker.hurt;v=0.74;p=1.42} @self
    - sound{s=entity.pillager.hurt;v=0.20;p=1.50} @self

GoblinShaman_FinalSuicideCheck:
  Conditions:
    - variableIsSet{var=caster.shaman_casting} false
    - variableIsSet{var=caster.shaman_final_active} false
    - variableIsSet{var=caster.shaman_final_done} false
    - health{h=<10} true
  Skills:
    - skill{s=GoblinShaman_FinalSuicide} @self


GoblinShaman_FinalInvulnerability:
  Conditions:
    - variableIsSet{var=caster.shaman_final_active} true
  Skills:
    # 최종 패턴 연출 도중에는 플레이어가 샤먼을 먼저 죽일 수 없음.
    - cancelevent


GoblinShaman_FinalSuicide:
  Conditions:
    - variableIsSet{var=caster.shaman_final_active} false
    - variableIsSet{var=caster.shaman_final_done} false
  Skills:
    # 전투당 1회 잠금.
    - setvariable{var=caster.shaman_final_active;value=1;type=INTEGER}
    - setvariable{var=caster.shaman_final_done;value=1;type=INTEGER}

    # 모든 일반 패턴/도주 메커니즘을 casting 상태로 봉인.
    - setvariable{var=caster.shaman_casting;value=1;type=INTEGER;duration=160}
    - potion{type=SLOWNESS;duration=160;level=255;particles=false} @self

    # 기존 death 포즈를 "7초 부유 자살 모션"으로 개조한 상태.
    - state{s=death;li=0;lo=0} @self

    - sound{s=entity.witch.death;v=0.75;p=0.55} @self
    - sound{s=entity.evoker.prepare_wololo;v=0.95;p=0.42} @self

    # 시작 저주 폭발
    - effect:particlering{particle=witch;radius=2.2;points=28;amount=1;hS=0;vS=0;y=0.40} @self
    - effect:particles{p=reverse_portal;amount=28;hS=1.15;vS=0.80;y=1.15} @self
    - effect:particles{p=soul;amount=16;hS=0.85;vS=0.70;y=0.85} @self

    # 저주 이펙트는 별도 스킬에서 7초 동안 계속 반복.
    - skill{s=GoblinShaman_FinalCurseVFX} @self

    # --------------------------------------------------------
    # 1차 부활 - 0.75초
    # Worker + Warrior 동시에, 샤먼 주변 비교적 넓은 무작위 위치 (약 7블럭)
    # --------------------------------------------------------
    - delay 15
    - sound{s=block.soul_sand.break;v=0.9;p=0.58} @self
    - summon{t=Goblin_Undead_Worker;a=1;yr=0;noise=7.0} @SelfLocation
    - summon{t=Goblin_Undead_Warrior;a=1;yr=0;noise=7.0} @SelfLocation

    # --------------------------------------------------------
    # 2차 부활 - 2.00초 (약 7블럭)
    # --------------------------------------------------------
    - delay 25
    - sound{s=block.soul_sand.break;v=0.9;p=0.54} @self
    - summon{t=Goblin_Undead_Worker;a=1;yr=0;noise=7.0} @SelfLocation
    - summon{t=Goblin_Undead_Warrior;a=1;yr=0;noise=7.0} @SelfLocation

    # --------------------------------------------------------
    # 3차 부활 - 3.25초 (약 8블럭)
    # --------------------------------------------------------
    - delay 25
    - sound{s=block.soul_sand.break;v=0.95;p=0.50} @self
    - summon{t=Goblin_Undead_Worker;a=1;yr=0;noise=8.0} @SelfLocation
    - summon{t=Goblin_Undead_Warrior;a=1;yr=0;noise=8.0} @SelfLocation

    # --------------------------------------------------------
    # 4차 부활 - 4.50초 (약 9블럭)
    # 총 8마리 완성
    # --------------------------------------------------------
    - delay 25
    - sound{s=block.soul_sand.break;v=1.0;p=0.46} @self
    - summon{t=Goblin_Undead_Worker;a=1;yr=0;noise=9.0} @SelfLocation
    - summon{t=Goblin_Undead_Warrior;a=1;yr=0;noise=9.0} @SelfLocation

    # 마지막 2.5초는 샤먼 주위 저주가 계속 유지되며
    # 이미 부활한 고블린들이 플레이어를 공격.
    - delay 50

    # 정확히 7초 후 자살.
    - effect:particles{p=reverse_portal;amount=55;hS=1.35;vS=1.10;y=1.10} @self
    - effect:particles{p=soul;amount=28;hS=1.00;vS=0.95;y=0.95} @self
    - sound{s=entity.evoker.death;v=0.72;p=0.62} @self
    - sound{s=entity.vex.death;v=0.32;p=0.70} @self

    # 자기 자신을 죽이기 직전에 피격 무효 플래그 해제.
    # final_done은 남겨 재발동 방지.
    - variableUnset{var=caster.shaman_final_active} @self
    - damage{a=999999;ia=true} @self


