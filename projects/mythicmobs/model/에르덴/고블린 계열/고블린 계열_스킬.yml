        v=12;
        gravity=0.14;
        i=1;
        hR=0.48;
        vR=0.48;
        md=100;
        mr=32;
        syo=1.25;
        sfo=0.75;
        tyo=1.85;
        stopAtBlock=true;
        stopAtEntity=true
      } @target


GoblinThrower_Rock_TICK:
  Skills:
    # 돌 모델 자체가 보이므로 파티클은 아주 약하게만 보조.
    - effect:particles{p=smoke;amount=1;hS=0.05;vS=0.05;y=-0.10} @origin


GoblinThrower_Rock_HIT:
  Skills:
    # projectile가 플레이어에게 직접 닿았을 때
    # 그 피격 대상을 그대로 받아 확실하게 데미지 적용.
