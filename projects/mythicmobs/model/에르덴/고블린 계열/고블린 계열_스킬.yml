GoblinThrower_DetectPlayer:
  Conditions:
    # Worker / Warrior와 동일한 자연 인식 범위.
    - playerwithin{d=7} true
  Skills:
    - settarget @NearestPlayer{r=7}


# 공격 중에는 pathfinding / flee / 걷기 회전보다 플레이어 조준 우선.
GoblinThrower_CastLook:
  Conditions:
    - variableIsSet{var=caster.thrower_casting} true
  Skills:
    - look{headOnly=false;force=true;immediately=true} @target


GoblinThrower_RockAttack:
  Cooldown: 2.6
  Conditions:
    - variableIsSet{var=caster.thrower_casting} false
    - targetwithin{d=14} true
    - targetwithin{d=3} false
  TargetConditions:
    - entitytype{t=PLAYER} true

  Skills:
    # --------------------------------------------------------
    # 공격 전 조준 단계
    # 여기서부터 공격이 끝날 때까지 이동 정지.
    # look force를 매 틱 다시 걸기 때문에 다른 AI보다 방향 제어가 우선.
    # --------------------------------------------------------
    - setvariable{var=caster.thrower_casting;value=1;type=INTEGER;duration=24}
    - potion{type=SLOWNESS;duration=24;level=255;particles=false} @self

    - look{headOnly=false;force=true;immediately=true} @target
    - delay 2
    - look{headOnly=false;force=true;immediately=true} @target

    # attack 애니메이션 시작 시점을 0.00초로 본다.
    - state{s=attack;li=0;lo=0} @self

    # --------------------------------------------------------
    # attack 애니메이션 0.75초 = 정확히 15틱
    # 이 프레임에서 실제 돌 projectile 발사.
    # --------------------------------------------------------
    - delay 15
    - look{headOnly=false;force=true;immediately=true} @target
    - sound{s=entity.snowball.throw;v=0.85;p=0.70} @self

    # 발사 순간 거리를 다시 확인해서 궤도를 나눔.
    # 가까운 플레이어에게는 낮은 조준점/약한 중력으로 직선에 가깝게,
    # 먼 플레이어에게만 기존의 강한 포물선을 사용.
    - skill{s=GoblinThrower_RockLaunch_Close} @target
    - skill{s=GoblinThrower_RockLaunch_Far} @target

    # attack 전체 길이가 1.0초라 남은 5틱 동안 후속 포즈 유지.
    - delay 5



GoblinThrower_RockLaunch_Close:
  Conditions:
    # 6블럭 이내에서는 높은 포물선이 머리 위로 넘어가므로
    # 낮고 빠른 투척 궤도를 사용한다.
    - targetwithin{d=6} true
  Skills:
    - projectile{
        bulletType=MOB;
        mob=Goblin_Thrower_Rock_Projectile;
        onTick=GoblinThrower_Rock_TICK;
        onHit=GoblinThrower_Rock_HIT;
        onEnd=GoblinThrower_Rock_END;
        v=12;
        gravity=0.045;
        i=1;
        hR=0.48;
        vR=0.48;
        md=100;
        mr=32;
        syo=1.20;
        sfo=0.45;
        tyo=0.65;
        stopAtBlock=true;
        stopAtEntity=true
      } @target


GoblinThrower_RockLaunch_Far:
