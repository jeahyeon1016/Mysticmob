# ============================================================
# Slime Queen Field Boss Skills
# v1.11: spawn 전용 모델/Active 본체 교체를 완전히 제거.
#        main 모델 안에 spawn 애니메이션을 병합하고 같은 display에서 이어 재생.
# Final v1.16
#
# 설계 원칙:
# 1) 모션을 보면 피할 수 있어야 한다.
# 2) 강한 공격은 방향을 먼저 보여준 뒤 고정한다.
# 3) 긴 팔 공격은 긴 사거리 대신 낮은 피해/위치조작 역할.
# 4) 3~7블럭 공격은 0~2블럭 안전지대를 실제로 유지한다.
# 5) v0.3: 채팅 라인을 YAML-safe 문자열로 수정.
#    v0.2의 &d / &f / &e 색코드가 YAML anchor로 해석되어
#    스킬 파일 전체가 파싱 실패하는 문제가 있었음.
# 6) v0.5: 이 서버에서 @Cone 시각화가 캐스터 발밑에 뭉치는 현상이 있어 제거.
#    @Forward{f=거리;rot=각도;lockpitch=true} 위치를 촘촘히 직접 찍어서
#    실제 공격 가능 영역 전체를 바닥에 표시한다.
# 7) 타격 직전 end_rod / 타격 직후 crit.
# 8) v0.6: Scratch/Swing은 pull mechanic으로 실제 끌어오기.
# 9) Uppercut 2종은 약 7블럭 수직 에어본.
# 10) Lunge 방어는 onDamaged 스킬을 sync=true로 실행해 실제 데미지 이벤트 취소.
# 11) v0.7: 어퍼컷 helper의 모든 victim mechanic에 @target 명시.
#     throw{v=0;vy=1.10}으로 약 7블럭 수직 에어본.
# 12) v0.7: 근접 패턴 선택을 @self + targetwithin{d=6.5}로 변경.
# 13) v0.8: 어퍼컷을 throw가 아니라 velocity SET(y=1.10, delay=1)로 변경.
#     데미지/넉백 다음 틱에 수직속도를 강제로 설정해 약 7블럭 에어본.
# 14) v0.8: 모든 다단 패턴은 모션 시작 순간 플레이어 위치로 방향 1회 고정.
# 15) v0.8: 오른손 스매쉬는 0.95~1.40초 동안 오른60 -> 왼90 스윕,
#     피격자는 여제 기준 왼쪽으로 1.25블럭 밀림.
# 16) v0.9: Scratch/Swing 끌어오기는 데미지 1틱 뒤 강한 pull 적용.
#     Scratch pull velocity=4.5~5.0 / Swing=3.8.
# 17) v0.9: 오른쪽 회전공격 모든 회전 판정에 강한 throw 적용.
#     velocity=2.0 / velocityY=0.24.
# 18) v1.0: 이동 효과를 직접 재타겟팅하지 않고, 타격 순간 잡힌 플레이어를
#     meta-skill @target으로 보존한 뒤 1틱 후 적용.
# 19) v1.0: Pull은 공식 예제 수준으로 Scratch=10 / Swing=8,
#     Roundhouse는 throw velocity=10 / velocityY=1.2.
# 20) v1.1: leftsmash_rightuppercut 실제 bbmodel 키프레임 재검토.
#     1타 0.75s: 3~7 / 왼쪽 55도(rot=-27.5)
#     2타 2.05s: 3~7 / 정면 60도(rot=0)
# 21) v1.1: Roundhouse는 target 변수로 플레이어당 최대 1회만 타격.
#     넉백도 velocity=3.0 / velocityY=0.30으로 하향.
# 22) v1.2: Grab 4종은 damage와 pull을 하나의 meta-skill에 통합.
#     같은 @target에 damage -> 1틱 -> pull을 실행하므로 판정 완전 일치.
#     damage에는 ignoreinvulnerability=true, preventknockback=true 적용.
# 23) v1.2: 오른 어퍼컷 -> 왼손 강타 2타는 yoffset 0/3/6 레이어로
#     Y축 판정 확대. HitOnce로 중복 데미지 방지.
# 24) v1.3: 오른손 펀치 사거리 8 -> 9.5블럭으로 소폭 증가.
#     데미지/넉백/디버그 파티클 범위 모두 동일하게 확장.
# 25) v1.4: 모든 공격 패턴 공통 규칙 확정.
#     AI OFF -> 이동 0 -> 플레이어 바라봄 -> 즉시 애니메이션 실행.
#     다단기/회전기/스윕기는 이 고정축 기준으로만 판정이 이동한다.
#    타격 후 crit 파티클을 표시한다. 전 파티클이 안 보이면 범위/타겟터 문제,
#    전 파티클은 보이는데 데미지가 없으면 데미지 로직 문제로 구분 가능.
#
# Cone rotation prototype:
#   rot < 0 = 왼쪽
#   rot > 0 = 오른쪽
# 인게임에서 좌우가 반대로 보이면 rot 부호만 일괄 반전하면 됨.
# ============================================================

# ============================================================
# INIT / LOCOMOTION
# ============================================================

SlimeQueen_Init:
  Skills:
    # ========================================================
    # v1.11 NO-SWAP SPAWN
    # 처음부터 끝까지 같은 mob + 같은 BetterModel을 유지한다.
    # ========================================================

    - setvariable{var=caster.spawning;value=1;type=INTEGER} @self
    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    - setvariable{var=caster.anim_move;value=0;type=INTEGER} @self
    - setvariable{var=caster.shield;value=0;type=INTEGER} @self

    - setAI{ai=false} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self

    # BetterModel EntityTracker는 이름이 "spawn"인 애니메이션을
    # 모델 부착 시 built-in spawn animation으로 자동 1회 재생한다.
    # 수동 state=spawn을 다시 호출하면 애니메이션이 재시작될 수 있으므로 제거.
    #
    # ========================================================
    # Spawn sound timeline
    # 0.00 ~ 3.36s : 몸을 일으키는 무겁고 점액질인 소리
    # ========================================================
    - sound{s=block.slime_block.place;v=1.6;p=0.48} @self
    - sound{s=entity.slime.squish;v=1.1;p=0.58} @self
    - delay 20
    - sound{s=block.slime_block.step;v=1.35;p=0.52} @self
    - delay 20
    - sound{s=entity.slime.squish;v=1.3;p=0.50} @self
    - delay 27

    # ========================================================
    # 3.36 ~ 6.24s : "뭔가 온다" 긴장감
    # ========================================================
    - sound{s=entity.warden.heartbeat;v=1.4;p=0.68} @self
    - delay 20
    - sound{s=entity.warden.heartbeat;v=1.55;p=0.78} @self
    - delay 20
    - sound{s=entity.warden.heartbeat;v=1.7;p=0.90} @self
    - delay 18

    # ========================================================
    # 6.24s : 손이 갑자기 올라오는 보스 등장 포인트
    # ========================================================
    - sound{s=entity.warden.roar;v=1.35;p=0.72} @self
    - sound{s=block.slime_block.break;v=1.8;p=0.52} @self
    - effect:particles{particle=cloud;amount=28;hS=2.0;vS=2.4;speed=0.10} @self
    - effect:particles{particle=slime;amount=22;hS=1.8;vS=2.2;speed=0.08} @self

    # 남은 스폰 애니메이션 마무리
    - delay 45

    # display/model 교체 없이 같은 모델에서 바로 idle로 전환
    - state{mid=slimegirlprincess;s=idle;f=true} @self
    - setvariable{var=caster.spawning;value=0;type=INTEGER} @self
    - setAI{ai=true} @self
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self

SlimeQueen_WalkStart:
  Conditions:
    - variableEquals{var=caster.busy;value=0} true
    - variableEquals{var=caster.anim_move;value=0} true
    - moving true
  Skills:
    - setvariable{var=caster.anim_move;value=1;type=INTEGER} @self
    - state{mid=slimegirlprincess;s=walk;f=true} @self

SlimeQueen_IdleStart:
  Conditions:
    - variableEquals{var=caster.busy;value=0} true
    - variableEquals{var=caster.anim_move;value=1} true
    - moving false
  Skills:
    - setvariable{var=caster.anim_move;value=0;type=INTEGER} @self
    - state{mid=slimegirlprincess;s=idle;f=true} @self

# ============================================================
# SPAWN / DEATH
# ============================================================

SlimeQueen_SpawnInvulnerable:
  Conditions:
    - variableEquals{var=caster.spawning;value=1} true
  Skills:
    - cancelEvent
    - sound{s=block.slime_block.hit;v=0.8;p=0.65} @self

SlimeQueen_Death:
  Skills:
    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    - setAI{ai=false} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - state{mid=slimegirlprincess;s=death;f=true} @self
    - sound{s=entity.slime.death;v=1.8;p=0.65} @self

# ============================================================
# PATTERN SELECTORS v1.5
#
# 핵심 규칙:
# - 플레이어가 "실제로 그 공격에 맞을 수 있는 거리"에 있을 때만
#   해당 패턴이 후보에 들어간다.
# - 구간은 서로 겹치지 않는다.
# - busy=0인 경우에만 새 패턴 선택.
# - 개별 패턴 Cooldown 30초는 그대로 유지.
#
# 거리별 후보:
# 0~3      : 0거리부터 맞는 근접/광역 공격
# 3~5      : 사실상 모든 패턴 사용 가능
# 5~7      : 5블럭 스매쉬류 제외
# 7~8      : 7블럭 한계 공격 제외, 8블럭 이상만
# 8~9      : 장거리 스크래치 / 회전 / 오른펀치
# 9~9.5    : 오른스크래치 / 회전 / 오른펀치
# 9.5~10   : 오른스크래치 / 회전
# 10~11.2  : 오른스크래치만
# ============================================================

# ------------------------------------------------------------
# 0 ~ 3
# ------------------------------------------------------------
SlimeQueen_Select_R0_3:
  Conditions:
    - variableEquals{var=caster.busy;value=0} true
  TargetConditions:
    - distance{d=<3} true
  Skills:
    - randomskill{skills=SlimeQueen_LeftScratch,SlimeQueen_RightScratch,SlimeQueen_LeftSwing,SlimeQueen_RightSwing,SlimeQueen_LeftSmash,SlimeQueen_RightSmash,SlimeQueen_LeftLunge,SlimeQueen_RightLunge,SlimeQueen_LeftHeavySmash,SlimeQueen_RightRoundhouse,SlimeQueen_RightPunch,SlimeQueen_RightUppercut_LeftSmash}

# ------------------------------------------------------------
# 3 ~ 5
# 모든 패턴이 실제로 플레이어를 타격 가능한 핵심 전투 거리
# ------------------------------------------------------------
SlimeQueen_Select_R3_5:
  Conditions:
    - variableEquals{var=caster.busy;value=0} true
  TargetConditions:
    - distance{d=>=3} true
    - distance{d=<5} true
  Skills:
    - randomskill{skills=SlimeQueen_LeftScratch,SlimeQueen_RightScratch,SlimeQueen_LeftSwing,SlimeQueen_RightSwing,SlimeQueen_LeftSmash,SlimeQueen_RightSmash,SlimeQueen_LeftLunge,SlimeQueen_RightLunge,SlimeQueen_LeftHeavySmash,SlimeQueen_LeftSmash_RightUppercut,SlimeQueen_LeftJumpSmash,SlimeQueen_RightRoundhouse,SlimeQueen_RightUppercut_LeftSmash,SlimeQueen_RightPunch}

# ------------------------------------------------------------
# 5 ~ 7
# 사거리 5짜리 Smash/HeavySmash 제외
# ------------------------------------------------------------
SlimeQueen_Select_R5_7:
  Conditions:
    - variableEquals{var=caster.busy;value=0} true
  TargetConditions:
    - distance{d=>=5} true
    - distance{d=<7} true
  Skills:
    - randomskill{skills=SlimeQueen_LeftScratch,SlimeQueen_RightScratch,SlimeQueen_LeftSwing,SlimeQueen_RightSwing,SlimeQueen_LeftLunge,SlimeQueen_RightLunge,SlimeQueen_LeftSmash_RightUppercut,SlimeQueen_LeftJumpSmash,SlimeQueen_RightRoundhouse,SlimeQueen_RightUppercut_LeftSmash,SlimeQueen_RightPunch}

# ------------------------------------------------------------
# 7 ~ 8
# 7블럭 한계 기술 제외
# ------------------------------------------------------------
SlimeQueen_Select_R7_8:
  Conditions:
    - variableEquals{var=caster.busy;value=0} true
  TargetConditions:
    - distance{d=>=7} true
    - distance{d=<8} true
  Skills:
    - randomskill{skills=SlimeQueen_LeftScratch,SlimeQueen_RightScratch,SlimeQueen_LeftLunge,SlimeQueen_RightLunge,SlimeQueen_RightRoundhouse,SlimeQueen_RightPunch}

# ------------------------------------------------------------
# 8 ~ 9
# ------------------------------------------------------------
SlimeQueen_Select_R8_9:
  Conditions:
    - variableEquals{var=caster.busy;value=0} true
  TargetConditions:
    - distance{d=>=8} true
    - distance{d=<9} true
  Skills:
    - randomskill{skills=SlimeQueen_LeftScratch,SlimeQueen_RightScratch,SlimeQueen_RightRoundhouse,SlimeQueen_RightPunch}

# ------------------------------------------------------------
# 9 ~ 9.5
# 왼손 Scratch(9) 제외
# ------------------------------------------------------------
SlimeQueen_Select_R9_9p5:
  Conditions:
    - variableEquals{var=caster.busy;value=0} true
  TargetConditions:
    - distance{d=>=9} true
    - distance{d=<9.5} true
  Skills:
    - randomskill{skills=SlimeQueen_RightScratch,SlimeQueen_RightRoundhouse,SlimeQueen_RightPunch}

# ------------------------------------------------------------
# 9.5 ~ 10
# RightPunch(9.5) 제외
# ------------------------------------------------------------
SlimeQueen_Select_R9p5_10:
  Conditions:
    - variableEquals{var=caster.busy;value=0} true
  TargetConditions:
    - distance{d=>=9.5} true
    - distance{d=<10} true
  Skills:
    - randomskill{skills=SlimeQueen_RightScratch,SlimeQueen_RightRoundhouse}

# ------------------------------------------------------------
# 10 ~ 11.2
# RightScratch(11)만 사용.
# 11 경계에서 좌표 오차가 있을 수 있어 11.2까지 여유.
# ------------------------------------------------------------
SlimeQueen_Select_R10_11p2:
  Conditions:
    - variableEquals{var=caster.busy;value=0} true
  TargetConditions:
    - distance{d=>=10} true
    - distance{d=<11.2} true
  Skills:
    - skill{s=SlimeQueen_RightScratch}

# ============================================================
# COMMON HELPERS
# ============================================================

# 3~7블럭 중거리 타격 + 짧은 제자리 스턴
SlimeQueen_MidStunHit:
  TargetConditions:
    - distance{d=>=3} true
    - distance{d=<7.2} true
  Skills:
    - damage{a=6} @target
    - potion{type=SLOWNESS;duration=20;level=10;particles=false} @target

# 3~7블럭 어퍼컷
SlimeQueen_MidUppercutHit:
  TargetConditions:
    - distance{d=<7.2} true
  Skills:
    - damage{a=8} @target
    - effect:particles{particle=cloud;amount=14;hS=0.35;vS=0.55;speed=0.10} @target
    - sound{s=entity.slime.jump;v=1.25;p=0.72} @target
    - velocity{m=SET;x=0;y=1.10;z=0;delay=1} @target

# Jump Smash 1타: 3~7블럭
SlimeQueen_JumpFirstHit:
  TargetConditions:
    - distance{d=>=3} true
    - distance{d=<7.2} true
  Skills:
    - damage{a=18} @target
# 오른 어퍼컷 -> 왼 스매쉬의 1타
SlimeQueen_RightUppercutHit:
  TargetConditions:
    - distance{d=<7.2} true
  Skills:
    - damage{a=8} @target
    - effect:particles{particle=cloud;amount=14;hS=0.35;vS=0.55;speed=0.10} @target
    - sound{s=entity.slime.jump;v=1.25;p=0.72} @target
    - velocity{m=SET;x=0;y=1.10;z=0;delay=1} @target

# 오른 어퍼컷 -> 왼 스매쉬의 2타
SlimeQueen_LeftComboSmashHit:
  TargetConditions:
    - distance{d=>=3} true
    - distance{d=<9.2} true
  Skills:
    - damage{a=15} @target
    - potion{type=SLOWNESS;duration=60;level=2;particles=false} @target

# ============================================================
# LEFT SCRATCH
#
# animation: leftscratch (1.36s)
# 사거리 9
# 왼쪽 + 전방
# 피격 시 여제 쪽으로 끌어옴
# ============================================================

SlimeQueen_LeftScratch:
  Cooldown: 30
  Conditions:
    - variableEquals{var=caster.busy;value=0} true
  Skills:
    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    # 패턴 시작 순간 플레이어 방향으로 히트박스 기준축 고정
    - setAI{ai=false} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - look{headOnly=false;immediately=true} @target
    - state{mid=slimegirlprincess;s=leftscratch;f=true} @self
    - sound{s=entity.slime.squish;v=1.2;p=0.90} @self

    # 약 0.50초 타격
    - delay 10
    - skill{s=SQ_Debug_Pre_r0to9_a95_rotm27p5} @self
    - skill{s=SQ_GrabHit_Scratch} @LivingInCone{a=95;r=9;rot=-27.5;target=players}
    - skill{s=SQ_Debug_Post_r0to9_a95_rotm27p5} @self

    - delay 16
    - setAI{ai=true} @self
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self

# ============================================================
# RIGHT SCRATCH
#
# animation: rightscratch (1.52s)
# 사거리 11
# 오른쪽 + 정면
# 피격 시 끌어옴
# ============================================================

SlimeQueen_RightScratch:
  Cooldown: 30
  Conditions:
    - variableEquals{var=caster.busy;value=0} true
  Skills:
    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    # 패턴 시작 순간 플레이어 방향으로 히트박스 기준축 고정
    - setAI{ai=false} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - look{headOnly=false;immediately=true} @target
    - state{mid=slimegirlprincess;s=rightscratch;f=true} @self
    - sound{s=entity.slime.squish;v=1.2;p=0.86} @self

    # 약 0.65초
    - delay 13
    - skill{s=SQ_Debug_Pre_r0to11_a95_rot22p5} @self
    - skill{s=SQ_GrabHit_Scratch} @LivingInCone{a=95;r=11;rot=22.5;target=players}
    - skill{s=SQ_Debug_Post_r0to11_a95_rot22p5} @self

    - delay 16
    - setAI{ai=true} @self
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self

# ============================================================
# LEFT SWING
#
# animation: leftswing (0.84s)
# 왼110 / 오른40 / 7블럭
# 끌어오기
# ============================================================

SlimeQueen_LeftSwing:
  Cooldown: 30
  Conditions:
    - variableEquals{var=caster.busy;value=0} true
  Skills:
    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    # 패턴 시작 순간 플레이어 방향으로 히트박스 기준축 고정
    - setAI{ai=false} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - look{headOnly=false;immediately=true} @target
    - state{mid=slimegirlprincess;s=leftswing;f=true} @self
    - sound{s=entity.slime.squish;v=1.0;p=1.05} @self

    - delay 11
    - skill{s=SQ_Debug_Pre_r0to7_a150_rot-35} @self
    - skill{s=SQ_GrabHit_Swing} @LivingInCone{a=150;r=7;rot=-35;target=players}
    - skill{s=SQ_Debug_Post_r0to7_a150_rot-35} @self

    - delay 5
    - setAI{ai=true} @self
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self

# ============================================================
# RIGHT SWING
#
# animation: rightswing (0.84s)
# 오른90 / 왼30 / 7블럭
# 끌어오기
# ============================================================

SlimeQueen_RightSwing:
