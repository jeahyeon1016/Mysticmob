# ============================================================
# GRAB HIT HELPERS v1.2
#
# damage + grab가 같은 meta target(@target)을 공유.
# 즉 잡히는 대상과 데미지 대상이 100% 동일하다.
# ============================================================

SQ_GrabHit_Scratch:
  Skills:
    - damage{a=6;ignoreinvulnerability=true;preventknockback=true} @target
    - effect:particles{particle=crit;amount=10;hS=0.3;vS=0.45;speed=0.06} @target
    - delay 1
    - pull{velocity=10} @target
    - sound{s=entity.slime.squish;v=1.0;p=1.12} @target
    - effect:particles{particle=slime;amount=12;hS=0.35;vS=0.6;speed=0.04} @target

SQ_GrabHit_Swing:
  Skills:
    - damage{a=7;ignoreinvulnerability=true;preventknockback=true} @target
    - effect:particles{particle=crit;amount=10;hS=0.3;vS=0.45;speed=0.06} @target
    - delay 1
    - pull{velocity=8} @target
    - sound{s=entity.slime.squish;v=0.9;p=1.18} @target
    - effect:particles{particle=slime;amount=10;hS=0.3;vS=0.5;speed=0.04} @target

