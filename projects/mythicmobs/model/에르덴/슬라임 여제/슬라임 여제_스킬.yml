SQ_Roundhouse_HitOnce:
  # 같은 회전공격에서 이미 맞은 플레이어면 이후 회전 구간은 무시.
  # target-scope 변수는 40틱 뒤 자동 삭제된다.
  TargetConditions:
    - variableEquals{var=target.sq_roundhouse_hit;value=1} cancel
  Skills:
    - setvariable{var=target.sq_roundhouse_hit;value=1;type=INTEGER;duration=40}
    - damage{a=9} @target

    # 데미지와 같은 틱의 기본 넉백에 덮이지 않도록 1틱 뒤 밀쳐냄.
    # v1.0의 velocity=10은 너무 강했으므로 중간 강도로 낮춤.
    - delay 1
    - throw{velocity=4.5;velocityY=0.38} @target
    - sound{s=entity.player.attack.knockback;v=0.9;p=0.85} @target
    - effect:particles{particle=cloud;amount=10;hS=0.35;vS=0.4;speed=0.10} @target

