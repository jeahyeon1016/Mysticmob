    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    # 패턴 시작 순간 플레이어 방향으로 히트박스 기준축 고정
    - setAI{ai=false} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - look{headOnly=false;immediately=true} @target
    - state{mid=slimegirlprincess;s=rightuppercut_leftsmash;f=true} @self
    - sound{s=entity.slime.squish;v=1.25;p=0.66} @self

    # 1타
    - delay 34
    - skill{s=SQ_Debug_Pre_Uppercut_0to7_R120_L10_v19} @self
    - skill{s=SlimeQueen_RightUppercutHit} @LivingInCone{a=130;r=7;rot=55;target=players}
    - skill{s=SQ_Debug_Post_Uppercut_0to7_R120_L10_v19} @self

    # 2타: 왼손 강타
    # 오른손 어퍼컷으로 띄운 플레이어까지 손의 Y축 판정이 닿도록
    # 동일한 수평 범위를 y=0 / +3 / +6블럭의 3개 레이어로 검사.
    # 같은 플레이어가 여러 레이어에 걸려도 HitOnce 변수로 1번만 맞는다.
    - delay 20
    - delay 6
    - skill{s=SQ_Debug_Pre_r3to9_a60_rot0} @self

    - skill{s=SlimeQueen_LeftComboSmashAirHitOnce} @LivingInCone{a=60;r=9;rot=0;yo=0;target=players}
    - skill{s=SlimeQueen_LeftComboSmashAirHitOnce} @LivingInCone{a=60;r=9;rot=0;yo=3;target=players}
    - skill{s=SlimeQueen_LeftComboSmashAirHitOnce} @LivingInCone{a=60;r=9;rot=0;yo=6;target=players}

    - skill{s=SQ_Debug_Post_r3to9_a60_rot0} @self

    - delay 14
    - setAI{ai=true} @self
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self


SlimeQueen_LeftComboSmashAirHitOnce:
  TargetConditions:
    - variableEquals{var=target.sq_left_combo_airhit;value=1} cancel
  Skills:
    - setvariable{var=target.sq_left_combo_airhit;value=1;type=INTEGER;duration=12}
    - damage{a=15;ignoreinvulnerability=true} @target
    - potion{type=SLOWNESS;duration=60;level=2;particles=false} @target
    - effect:particles{particle=crit;amount=14;hS=0.35;vS=0.7;speed=0.08} @target

# ============================================================
# RIGHT PUNCH
#
# animation: 2.68s
# 약 1.45초에 오른쪽 90도 / 사거리 8
# 단발 판정 + 강한 밀쳐내기
# ============================================================

SlimeQueen_RightPunch:
  Cooldown: 30
  Conditions:
    - variableEquals{var=caster.busy;value=0} true
  Skills:
    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    # 패턴 시작 순간 플레이어 방향으로 히트박스 기준축 고정
    - setAI{ai=false} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - look{headOnly=false;immediately=true} @target
    - state{mid=slimegirlprincess;s=rightpunch;f=true} @self
    - sound{s=block.slime_block.hit;v=1.3;p=0.62} @self

    - delay 29
    - skill{s=SQ_Debug_Pre_r0to9p5_a90_rot45} @self
    - damage{a=10} @LivingInCone{a=90;r=9.5;rot=45;target=players}
    - effect:particles{particle=cloud;amount=16;hS=1.0;vS=0.45;speed=0.12} @self
    - effect:particles{particle=sweep_attack;amount=7;hS=1.0;vS=0.4;speed=0.02} @self
    - sound{s=entity.player.attack.knockback;v=1.0;p=0.68} @self
    - skill{s=SQ_Debug_Post_r0to9p5_a90_rot45} @self
    - throw{velocity=1.55;velocityY=0.14} @LivingInCone{a=90;r=9.5;rot=45;target=players}

    - delay 25
    - setAI{ai=true} @self
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self


