# ============================================================
# Copper Origin - Stalactite v0.41 DIRECTION + SIGNAL HIT
# SLIME ROLLBACK + EXACT 2-HIT COUNTER
#
# 공식 MythicMobs Variables 문서 기준:
# - caster INTEGER variable
# - variableadd{amount=1}
# - variableEquals
#
# 한 번의 ~onDamaged 이벤트에서:
# 1) 현재 damage-cause가 PROJECTILE인지 확인
# 2) hit_count +1
# 3) count==1이면 경고
# 4) count==2이면 낙하
# ============================================================

CopperStalactite_v28_Refresh:
  Skills:
    - skill{s=CopperStalactite_v28_Scan} @SelfLocation

CopperStalactite_v28_Scan:
  Skills:
    - foreach{skill=CopperStalactite_v28_ProcessMarker;targettype=LOCATION} @BlocksInRadius{radius=24;radiusy=16;shape=CUBE;noair=true;blocktypes=DIAMOND_BLOCK;blockcentered=true}

CopperStalactite_v28_ProcessMarker:
  Skills:
    - skill{s=CopperStalactite_v28_PlaceIfValid} @TargetedLocation{yoffset=-1}

CopperStalactite_v28_PlaceIfValid:
  TargetConditions:
    - blocktype{type=AIR,POINTED_DRIPSTONE} true
  Skills:
    - setblock{material=POINTED_DRIPSTONE[vertical_direction=down,thickness=tip,waterlogged=false];physics=false}
    - skill{s=CopperStalactite_v28_SpawnHitboxIfEmpty} @TargetedLocation{yoffset=-0.25}

CopperStalactite_v28_SpawnHitboxIfEmpty:
  TargetConditions:
    - mobsInRadius{types=CopperOrigin_StalactiteHitbox_v28;amount=0;radius=0.40} true
  Skills:
    - summon{type=CopperOrigin_StalactiteHitbox_v28;amount=1;radius=0}

# ============================================================
# SINGLE DAMAGE ENTRY
# ============================================================
CopperStalactite_v28_OnHit:
  Conditions:
    # 현재 ~onDamaged 이벤트의 원인을 직접 검사
    - stringEquals{value1="<skill.var.damage-cause>";value2="PROJECTILE"} true
  Skills:
    # 매 화살마다 정확히 +1
    - variableadd{var=caster.stalactite_hit_count;amount=1} @self

    # 1발째만 경고
    - skill{s=CopperStalactite_v28_FirstFeedback} @self

    # 2발째만 낙하
    - skill{s=CopperStalactite_v28_Drop} @self

CopperStalactite_v28_FirstFeedback:
  Conditions:
    - variableEquals{var=caster.stalactite_hit_count;value=1}
  Skills:
    - sound{s=block.pointed_dripstone.hit;v=1.0;p=0.72} @self
    - sound{s=block.stone.break;v=0.35;p=0.55} @self
    - effect:particles{particle=BLOCK;material=POINTED_DRIPSTONE;amount=10;hS=0.12;vS=0.12;speed=0.035} @BlocksInRadius{radius=0;radiusy=2;shape=CUBE;blocktypes=POINTED_DRIPSTONE;blockcentered=true}
    - effect:particles{particle=ASH;amount=8;hS=0.10;vS=0.20;speed=0.01} @SelfLocation{yoffset=0.55}

CopperStalactite_v28_Drop:
  Conditions:
    - variableEquals{var=caster.stalactite_hit_count;value=2}
  Skills:
    - sound{s=block.pointed_dripstone.break;v=1.15;p=0.70} @self
    - sound{s=entity.generic.explode;v=0.25;p=1.35} @self
    - effect:particles{particle=BLOCK;material=POINTED_DRIPSTONE;amount=26;hS=0.20;vS=0.20;speed=0.09} @BlocksInRadius{radius=0;radiusy=2;shape=CUBE;blocktypes=POINTED_DRIPSTONE;blockcentered=true}
    - effect:particles{particle=ASH;amount=16;hS=0.14;vS=0.25;speed=0.025} @SelfLocation{yoffset=0.55}
    # v0.40 핵심:
    # 1) POINTED_DRIPSTONE이 아직 블록으로 존재할 때 피해 proxy를 먼저 같은 위치에 생성.
    # 2) 그 다음 실제 POINTED_DRIPSTONE만 blockdestabilize.
    #
    # 시각 종유석은 기존에 설치한
    # POINTED_DRIPSTONE[vertical_direction=down,thickness=tip] 자체가 떨어지므로
    # v0.39 방향 수정 방식 유지.
    #
    # 피해 proxy는 BARRIER FALLING_BLOCK이라 모래 모델이 보이지 않으며,
    # HurtsEntities:true로 FALLING_BLOCK 피해 이벤트만 담당.
    - summon{type=CopperOrigin_StalactiteDamageProxy_v40;amount=1;radius=0} @BlocksInRadius{radius=0;radiusy=2;shape=CUBE;blocktypes=POINTED_DRIPSTONE;blockcentered=true}

    - blockdestabilize @BlocksInRadius{radius=0;radiusy=2;shape=CUBE;blocktypes=POINTED_DRIPSTONE;blockcentered=true}
    - remove @self

# ============================================================
# CLEAR
# ============================================================
CopperStalactite_v28_Clear:
  Skills:
    - skill{s=CopperStalactite_v28_ClearScan} @SelfLocation

CopperStalactite_v28_ClearScan:
  Skills:
    - foreach{skill=CopperStalactite_v28_ClearMarker;targettype=LOCATION} @BlocksInRadius{radius=24;radiusy=16;shape=CUBE;noair=true;blocktypes=DIAMOND_BLOCK;blockcentered=true}

CopperStalactite_v28_ClearMarker:
  Skills:
    - skill{s=CopperStalactite_v28_ClearOnlyDripstone} @TargetedLocation{yoffset=-1}

CopperStalactite_v28_ClearOnlyDripstone:
  TargetConditions:
    - blocktype{type=POINTED_DRIPSTONE} true
  Skills:
    - setblock{material=AIR;physics=false}


# ============================================================
# Invisible FallingBlock damage proxy cleanup
# 바닥 1블록 위에서 제거해서 월드에 블록으로 설치되지 않게 함.
# ============================================================

CopperOrigin_StalactiteDamageProxy_Cleanup:
  TargetConditions:
    - blocktype{type=AIR} false
  Skills:
    - remove @self


# ============================================================
# v0.41 RELIABLE BOSS HIT
#
# FallingBlock의 바닐라 피해 이벤트에 의존하지 않고,
# 피해 proxy가 CopperOriginBoss 반경 1.8 안에 들어오면
# 공식 signal mechanic으로 보스에게 STALACTITE_HIT을 보낸다.
# ============================================================

CopperOrigin_StalactiteProxy_HitCheck:
  Conditions:
    - mobsInRadius{types=CopperOriginBoss;amount=>0;radius=1.8} true
  Skills:
    - signal{s=STALACTITE_HIT} @MobsInRadius{r=1.8;t=CopperOriginBoss}
    - remove @self
