    - meg:partvis{mid=viking;pid=back;v=true;em=true} @self
    - meg:partvis{mid=viking;pid=hip;v=true;em=true} @self
    - meg:changepart{mid=viking;pid=back;nmid=viking_parts;npid=back_shield} @self
