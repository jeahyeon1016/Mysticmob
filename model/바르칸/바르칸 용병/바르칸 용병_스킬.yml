# ============================================================
# LOADOUTS - SPAWN STORAGE STATE
#
# 중요:
# ChangePart로 "빈 파츠"를 넣어서 지우지 않는다.
# 렌더 큐브가 없는 파츠는 교체가 눈에 안 먹을 수 있으므로
# back / hip 비우기는 PartVis로 확실하게 처리한다.
# ============================================================

# --------------------
# HIP ONLY -> idle + grab_gear_hip
# --------------------

BarkanMerc_Loadout_AxeHip:
  Skills:
    - setvariable{var=caster.loadout;type=STRING;val=AXE_HIP} @self
    - setvariable{var=caster.combat_type;type=STRING;val=RIGHT} @self
    - setvariable{var=caster.peace_idle;type=STRING;val=HIP} @self
    - setvariable{var=caster.has_shield;type=INTEGER;val=0} @self
    - meg:partvis{mid=viking;pid=back;v=false;em=true} @self
    - meg:partvis{mid=viking;pid=hip;v=true;em=true} @self
    - meg:changepart{mid=viking;pid=hip;nmid=viking;npid=hip} @self

BarkanMerc_Loadout_HammerHip:
  Skills:
    - setvariable{var=caster.loadout;type=STRING;val=HAMMER_HIP} @self
    - setvariable{var=caster.combat_type;type=STRING;val=RIGHT} @self
    - setvariable{var=caster.peace_idle;type=STRING;val=HIP} @self
    - setvariable{var=caster.has_shield;type=INTEGER;val=0} @self
    - meg:partvis{mid=viking;pid=back;v=false;em=true} @self
    - meg:partvis{mid=viking;pid=hip;v=true;em=true} @self
    - meg:changepart{mid=viking;pid=hip;nmid=viking_parts;npid=hip_hammer} @self

BarkanMerc_Loadout_MaceHip:
  Skills:
    - setvariable{var=caster.loadout;type=STRING;val=MACE_HIP} @self
    - setvariable{var=caster.combat_type;type=STRING;val=RIGHT} @self
    - setvariable{var=caster.peace_idle;type=STRING;val=HIP} @self
    - setvariable{var=caster.has_shield;type=INTEGER;val=0} @self
    - meg:partvis{mid=viking;pid=back;v=false;em=true} @self
    - meg:partvis{mid=viking;pid=hip;v=true;em=true} @self
    - meg:changepart{mid=viking;pid=hip;nmid=viking_parts;npid=hip_mace} @self

# --------------------
# HIP WEAPON + BACK SHIELD -> idle + grab_gear
# --------------------

BarkanMerc_Loadout_AxeShield:
