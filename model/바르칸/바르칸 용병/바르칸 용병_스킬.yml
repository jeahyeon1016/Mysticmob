    - setvariable{var=caster.peace_idle;type=STRING;val=HIP} @self
    - setvariable{var=caster.has_shield;type=INTEGER;val=1} @self
    - meg:partvis{mid=viking;pid=back;v=true;em=true} @self
    - meg:partvis{mid=viking;pid=hip;v=true;em=true} @self
