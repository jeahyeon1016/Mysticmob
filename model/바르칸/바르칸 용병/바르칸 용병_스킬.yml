# ============================================================
# Barkan Mercenary v3.6 - Static Standoff TEST6
#
# 핵심 변수
#   count:
#     0 = 자유
#     1 = grab / 공격 중
#     2 = block 중
#
#   drawn:
#     0 = 무기 보관 상태
#     1 = 손에 장비를 꺼낸 상태
#
#   combat_started:
#     0 = 비전투
#     1 = 현재 타겟과 전투 진입
#
#   standoff:
#     0 = 일반 전투
#     1 = grab 직후 aggro_idle 대치 상태
#
#   standoff_attack_ready:
#     0 = 최소 대치시간(0.8초) 중
#     1 = 플레이어가 공격거리 안이면 선공 가능
#
#   engaged:
#     0 = 아직 실제 교전 전
#     1 = 공격/추격/실피격이 시작된 본격 교전
#
#   chase:
#     0 = 대치/정지
#     1 = run + goto 추격
#
#   far_pending:
#     1 = 공격거리 밖 2초 대기 타이머 진행 중
#
#   combat_combo:
#     실제 공격 적중 +1
#     실제 피해를 받음 +1
#     3초간 교환 없으면 0
#
#   combo_live:
#     마지막 유효 교환 후 60틱 동안 존재하는 임시 변수
#
#   block_active:
#     block 애니메이션 시작 후 9틱(0.45s) 동안 존재
#     이 동안 전방 180도 공격만 취소
#
# ============================================================
# 애니메이션
#
# idle             : hip에 무기가 있는 평상시 대기
# idle_nohip       : hip에 무기가 없는 평상시 대기
# walk             : 비전투 이동
# run              : 전투 추격
# aggro_idle       : 플레이어와 대치/공격 대기
#
# grab_gear_hip    : hip 단독 무기
# grab_gear        : hip 무기 + back 방패
# grab_gear_back   : hip 없음 + back 혼합 파츠
#
# melee1           : 0.25s / 5틱 / 2블럭 / -30~+30
# melee2           : 0.21s / 4틱 / 2블럭 / -90~+60
# left_melee1      : 0.25s / 5틱 / 2블럭 / -60~+60
# shield_melee1    : 0.29s / 6틱 / 2블럭 / -60~+80 / 뇌진탕
# block            : 0~0.42s 전방 -90~+90 방어
# kick             : 모델 핵심 프레임 약 0.417s / 8틱 / 2블럭 / -30~+30 / 밀치기
#
# death / death2 / death3 : 스폰 때 랜덤 1개 지정
#
# idle_kneel은 현재 전투 설계에서 용도가 확정되지 않아 비활성.
# ============================================================


# ============================================================
# SPAWN / VISUAL RANDOMIZATION
# ============================================================

BarkanMerc_Spawn:
  Skills:
    - meg:model{mid=viking;usm=true} @self

    - setvariable{var=caster.count;type=INTEGER;val=0} @self
    - setvariable{var=caster.drawn;type=INTEGER;val=0} @self
    - setvariable{var=caster.ready;type=INTEGER;val=0} @self
    - setvariable{var=caster.combat_started;type=INTEGER;val=0} @self
    - setvariable{var=caster.engaged;type=INTEGER;val=0} @self
    - setvariable{var=caster.standoff;type=INTEGER;val=0} @self
    - setvariable{var=caster.standoff_attack_ready;type=INTEGER;val=0} @self
    - setvariable{var=caster.chase;type=INTEGER;val=0} @self
    - setvariable{var=caster.far_pending;type=INTEGER;val=0} @self
    - setvariable{var=caster.combat_combo;type=INTEGER;val=0} @self
    - setvariable{var=caster.has_shield;type=INTEGER;val=0} @self

    - randomskill{skills=BarkanMerc_Head1,BarkanMerc_Head2,BarkanMerc_Head3,BarkanMerc_Head4,BarkanMerc_Head5,BarkanMerc_Head6,BarkanMerc_Head7,BarkanMerc_Head8} @self
    - randomskill{skills=BarkanMerc_Body1,BarkanMerc_Body2,BarkanMerc_Body3} @self

    # 허용 조합:
    # 1) hip 무기 단독
    # 2) hip 무기 + back 방패
    # 3) hip 없음 + back 혼합장비
    - randomskill{skills=BarkanMerc_Loadout_AxeHip 1.0,BarkanMerc_Loadout_HammerHip 0.8,BarkanMerc_Loadout_MaceHip 0.8,BarkanMerc_Loadout_AxeShield 1.4,BarkanMerc_Loadout_HammerShield 1.1,BarkanMerc_Loadout_MaceShield 1.0,BarkanMerc_Loadout_AxeShieldBack 1.3,BarkanMerc_Loadout_HammerShieldBack 1.1,BarkanMerc_Loadout_DualAxeBack 0.8} @self

    - meg:defaultstate{mid=viking;t=walk;s=walk;li=2;lo=2} @self
    - skill{s=BarkanMerc_SetPeaceIdle} @self

    # 죽을 때 사용할 모션을 스폰 때 미리 랜덤 확정
    - randomskill{skills=BarkanMerc_Death1,BarkanMerc_Death2,BarkanMerc_Death3} @self


# ============================================================
# HEAD / BODY
# ============================================================

