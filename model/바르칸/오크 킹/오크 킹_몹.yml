# ============================================================
# ORC KING - Mob
# MythicMobs 5.13.0 + ModelEngine 4.1.0
# Development v0.6
# Model ID: orc_king
# ============================================================

OrcKing:
  Type: ZOMBIE
  Display: '&4오크킹'
  Health: 300
  Damage: 0

  Modules:
    ThreatTable: true

  Options:
    Silent: true
    MovementSpeed: 0.24
    FollowRange: 32
    PreventOtherDrops: true
    PreventItemPickup: true
    PreventSunburn: true
    KnockbackResistance: 0.70

  AIGoalSelectors:
    - clear
    - meleeattack
    - movetowardstarget
    - randomstroll
    - lookatplayers
    - randomlookaround

  AITargetSelectors:
    - clear
    - players

  Skills:
    # Model
    - meg:model{mid=orc_king;d=false;i=true;lpitch=true;usm=true;save=false} @self ~onSpawn
    - meg:model{mid=orc_king;d=false;i=true;lpitch=true;usm=true;save=false} @self ~onLoad

    # Init
    - skill{s=OK_Init} @self ~onSpawn
    - skill{s=OK_Init} @self ~onLoad

    # One dispatcher: runner first, then normal attacks and locomotion.
    - skill{s=OK_Tick} @self ~onTimer:2
    - cancelevent{sync=true} @self ~onAttack
    - skill{s=OK_ComboFromDamaged} @self ~onDamaged
    - skill{s=OK_ComboFromBossHit} @self ~onSkillDamage
    - skill{s=OK_ComboIdleReset} @self ~onTimer:1
    - skill{s=OK_RunnerGain} @trigger ~onDamaged
    - skill{s=OK_RearHitThreat} @trigger ~onDamaged

    # OP-only damage/debug display.
    - skill{s=OK_DebugDamage} @PlayersInWorld ~onDamaged

    # Death animation.
    - skill{s=OK_Death} @self ~onDeath
