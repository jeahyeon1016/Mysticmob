# ============================================================
# ORC ARCHER - SKILLS
# Development v1.4
#
# 핵심:
# - 8블럭 밖: 타겟에게 접근
# - 8블럭 이내: 더 이상 접근하지 않음
# - 가까워질수록 공격 간격 감소
# - attack 시작 후 7틱(약 0.35초, 0.33초에 가장 근접한 정수틱)에 발사
#
# 발사 주기 (거리 구간 세분화):
# - 20~24블럭 : 2.20초
# - 16~20블럭 : 1.90초
# - 12~16블럭 : 1.60초
# - 8~12블럭  : 1.30초
# - 6~8블럭   : 1.08초
# - 4~6블럭   : 0.93초
# - 0~4블럭   : 0.70초
# ============================================================

OrcArcher_Init:
  Skills:
    # Preserve summoned-instance multiplier across a Mythic reload.
    - setvariable{var=caster.ok_damage_multiplier;type=FLOAT;value="<caster.var.ok_damage_multiplier{default=1}>"} @self
    - setAI{ai=true} @self
    - setvariable{var=caster.count;type=INTEGER;value=0} @self
    - setspeed{speed=1;type=WALK} @self


# ============================================================
# STAND-OFF MOVEMENT
# ============================================================

OrcArcher_Chase:
  Conditions:
    - variableEquals{var=caster.count;value=0} true
  TargetConditions:
    - entitytype{t=PLAYER} true
    - distance{d=>8.2}
  Skills:
    - setspeed{speed=1;type=WALK} @self
    - goto{s=1;sh=0;sv=0} @target


OrcArcher_StopAtRange:
  Conditions:
    - variableEquals{var=caster.count;value=0} true
  TargetConditions:
    - entitytype{t=PLAYER} true
    - distance{d=0to8.2}
  Skills:
    - setspeed{speed=0;type=WALK} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - look{headOnly=false;force=true;immediately=true} @target


# ============================================================
# ATTACK ROUTER
# 거리구간이 겹치지 않으므로 현재 거리의 스킬 하나만 실행됨.
# ============================================================

OrcArcher_AttackRouter:
  Conditions:
    - variableEquals{var=caster.count;value=0} true
  Skills:
    - skill{s=OrcArcher_Attack_0_4} @target
    - skill{s=OrcArcher_Attack_4_6} @target
    - skill{s=OrcArcher_Attack_6_8} @target
    - skill{s=OrcArcher_Attack_8_12} @target
    - skill{s=OrcArcher_Attack_12_16} @target
    - skill{s=OrcArcher_Attack_16_20} @target
    - skill{s=OrcArcher_Attack_20_24} @target


# 0 ~ 4 : 초근접 폭딜 연사
OrcArcher_Attack_0_4:
  Cooldown: 0.70
  Conditions:
    - variableEquals{var=caster.count;value=0} true
  TargetConditions:
    - entitytype{t=PLAYER} true
    - distance{d=0to4}
  Skills:
    - skill{s=OrcArcher_Attack_Base} @target

# 4 ~ 6
OrcArcher_Attack_4_6:
  Cooldown: 0.93
  Conditions:
    - variableEquals{var=caster.count;value=0} true
  TargetConditions:
    - entitytype{t=PLAYER} true
    - distance{d=>4}
    - distance{d=0to6}
  Skills:
    - skill{s=OrcArcher_Attack_Base} @target

# 6 ~ 8
OrcArcher_Attack_6_8:
  Cooldown: 1.08
  Conditions:
    - variableEquals{var=caster.count;value=0} true
  TargetConditions:
    - entitytype{t=PLAYER} true
    - distance{d=>6}
    - distance{d=0to8}
  Skills:
    - skill{s=OrcArcher_Attack_Base} @target

# 8 ~ 12
OrcArcher_Attack_8_12:
  Cooldown: 1.30
  Conditions:
    - variableEquals{var=caster.count;value=0} true
  TargetConditions:
    - entitytype{t=PLAYER} true
    - distance{d=>8}
    - distance{d=0to12}
  Skills:
    - skill{s=OrcArcher_Attack_Base} @target

# 12 ~ 16
OrcArcher_Attack_12_16:
  Cooldown: 1.60
  Conditions:
    - variableEquals{var=caster.count;value=0} true
  TargetConditions:
    - entitytype{t=PLAYER} true
    - distance{d=>12}
    - distance{d=0to16}
  Skills:
    - skill{s=OrcArcher_Attack_Base} @target

# 16 ~ 20
OrcArcher_Attack_16_20:
  Cooldown: 1.90
  Conditions:
    - variableEquals{var=caster.count;value=0} true
  TargetConditions:
    - entitytype{t=PLAYER} true
    - distance{d=>16}
    - distance{d=0to20}
  Skills:
    - skill{s=OrcArcher_Attack_Base} @target

# 20 ~ 24
OrcArcher_Attack_20_24:
  Cooldown: 2.20
  Conditions:
    - variableEquals{var=caster.count;value=0} true
  TargetConditions:
    - entitytype{t=PLAYER} true
    - distance{d=>20}
    - distance{d=0to24}
  Skills:
    - skill{s=OrcArcher_Attack_Base} @target


# ============================================================
# ATTACK
# attack = 0.9167초 ~= 18.3틱
# 0.33초 발사 지점 -> 7틱 사용
# ============================================================

OrcArcher_Attack_Base:
  Conditions:
    - variableEquals{var=caster.count;value=0} true
  Skills:
    - setvariable{var=caster.count;type=INTEGER;value=1} @self

    # 공격 중 잠깐 고정
    - setspeed{speed=0;type=WALK} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - look{headOnly=false;force=true;immediately=true;repeat=7;repeatInterval=1} @target

    - meg:state{mid=orc_archer;s=attack;priority=4;override=true;loop=ONCE;force=true;li=1;lo=1} @self
    - sound{s=item.crossbow.loading_start;v=0.55;p=0.90} @self

    # 0.33초 ~= 6.6틱 -> 7틱
    - delay 7
    - skill{s=OrcArcher_FireArrow} @target

    # Do not unlock an archer that died during the wind-up.
    - setvariable{var=caster.count;type=INTEGER;value=0} @self ?variableEquals{var=caster.count;value=1}


# ============================================================
# ARROW PROJECTILE
# 현재는 Mythic projectile + 화살 궤적 파티클 방식.
# 실제 바닐라 Arrow 엔티티 대신 안정적인 커스텀 판정을 우선 사용.
# ============================================================

OrcArcher_FireArrow:
  Conditions:
    - variableEquals{var=caster.count;value=1} true
  Skills:
    - sound{s=entity.arrow.shoot;v=0.70;p=0.88} @self
    - projectile{onTick=OrcArcher_ArrowTick;onHit=OrcArcher_ArrowHit;v=22;i=1;hR=0.30;vR=0.30;mr=32;syo=1.55;sfo=0.80;tyo=1.05;stopAtBlock=true;stopAtEntity=true} @target


OrcArcher_ArrowTick:
  Skills:
    - effect:particles{particle=crit;amount=1;hS=0.02;vS=0.02;speed=0} @origin


OrcArcher_ArrowHit:
  TargetConditions:
    - entitytype{t=PLAYER} true
  Skills:
    # 임시 피해값. '강한 원거리 공격' 기준으로 일반몹 대비 높게 설정.
    - damage{amount="9*<caster.var.ok_damage_multiplier{default=1}>";ignoreArmor=false}
    - sound{s=block.wood.hit;v=0.85;p=0.72}
    - sound{s=entity.generic.hurt;v=0.35;p=0.78}


# ============================================================
# DEATH
# ============================================================

OrcArcher_Death:
  Skills:
    - setvariable{var=caster.count;type=INTEGER;value=99} @self
    - setspeed{speed=0;type=WALK} @self
    - meg:state{mid=orc_archer;s=death;priority=10;override=true;loop=ONCE;force=true;li=1;lo=1} @self
    - sound{s=entity.ravager.death;v=0.50;p=1.05} @self

# Called by the king's onSummon callback via sudoskill.
# No second mob definition: only this spawned instance gets 70% skill damage.
# Bush emergence placeholder: 28 ticks (king timeline 1.25s -> 2.65s).
OrcArcher_KingSummoned:
  Skills:
    - setvariable{var=caster.ok_damage_multiplier;type=FLOAT;value=0.7} @self
    - setvariable{var=caster.count;type=INTEGER;value=2} @self
    - setAI{ai=false} @self
    - setspeed{speed=0;type=WALK} @self
    - effect:particles{p=dust;color=#3E682D;size=1.3;amount=25;hS=0.7;vS=0.6;speed=0;repeat=6;repeatInterval=4} @self
    - sound{s=block.azalea_leaves.break;v=0.7;p=0.8} @self
    - delay 28
    - skill{s=OrcArcher_KingSummonedReady} @self

OrcArcher_KingSummonedReady:
  Conditions:
    - variableEquals{var=caster.count;value=2} true
  Skills:
    - effect:particles{p=cloud;amount=8;hS=0.4;vS=0.2;speed=0.02} @self
    - setAI{ai=true} @self
    - setspeed{speed=1;type=WALK} @self
    - setvariable{var=caster.count;type=INTEGER;value=0} @self
    - skill{s=OrcArcher_KingTarget} @UUID{u=<caster.var.ok_summon_target>}

# Seed this archer's own threat table after its summon windup, never clone the king's.
OrcArcher_KingTarget:
  TargetConditions:
    - entitytype{t=PLAYER} true
    - health{h=>0} true
    - distance{d=0to64} true
  Skills:
    - threat{amount=1}
    - settarget