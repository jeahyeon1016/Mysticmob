Direwolf_Desert_Normal:
  Type: WOLF
  Display: '&6황야 늑대'
  Health: 35
  Damage: 0
  Armor: 1

  Options:
    Silent: true
    MovementSpeed: 0.30
    FollowRange: 12
    PreventOtherDrops: true
    PreventItemPickup: true
    KnockbackResistance: 0.10

  AIGoalSelectors:
    - clear
    - float
    - meleeattack
    - movetowardstarget
    - randomstroll
    - lookatplayers
    - randomlookaround

  AITargetSelectors:
    - clear
    - attacker

  Skills:
    - skill{s=DirewolfDesert_Init} @self ~onSpawnOrLoad
    - skill{s=DirewolfDesert_WalkStart} @self ~onTimer:2
    - skill{s=DirewolfDesert_IdleStart} @self ~onTimer:2
    - skill{s=DirewolfDesert_AttackRouter} @self ~onTimer:4
    - sound{s=entity.wolf.hurt;v=0.50;p=0.95} @self ~onDamaged
    - skill{s=DirewolfDesert_Death} @self ~onDeath

Direwolf_Desert_SlashFX:
  Type: ARMOR_STAND
  Display: ''
  Health: 1
  Damage: 0
  Options:
    Marker: true
    Invisible: true
    Invincible: true
    Silent: true
    NoGravity: true
    Collidable: false
    PreventOtherDrops: true
    PreventItemPickup: true
  AIGoalSelectors:
    - clear
  AITargetSelectors:
    - clear
  Skills:
    - model{mid=direwolfslash;n=false} @self ~onSpawn
    - state{s=idle;li=0;lo=0} @self ~onSpawn
    - remove{delay=16} @self ~onSpawn

