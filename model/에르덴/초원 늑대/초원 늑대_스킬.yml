# ============================================================
# 황야 늑대 / Desert Direwolf Skills
# MythicMobs + BetterModel
# Development v2.9
#
# 확정 기획
# - 할퀴기: 0.32s 타점 / 전방 좌우 30도 = 총 60도 / 3블럭
# - 물기  : 0.16s 타점 / 전방 좌우 30도 = 총 60도 / 2블럭
# - 근접 공격 비율: 할퀴기 2 : 물기 1 (공격 시작 거리 2.1블럭으로 통일)
# - death: death 애니메이션 연결
#
# v2.9
# - v2.5에서 제거된 DirewolfDesert_Howl의 잔재 호출 DirewolfDesert_HowlCheck 제거
# - "Could not find MetaSkill DirewolfDesert_Howl" 리로드 오류 수정
# - 실제 전투/이동/공격 로직 변경 없음
#
# v2.8
# - 할퀴기/물기 공격 범위 표시용 파티클 제거
# - 실제 LivingInCone 피해 판정과 slash/bite VFX는 그대로 유지
#
# v2.7
# - 스킬 로직 변경 없음
# - 몹 파일의 피격 wolf.hurt 볼륨 0.63 -> 0.50
#
# v2.6
# - 스킬 로직 변경 없음
# - 몹 파일의 피격 wolf.hurt 볼륨만 약 30% 감소
#
# v2.5
# - howl 스킬 블록 완전 제거
# - 랜덤 대기 중 howl 호출 제거
# - idle / walk / swipe / bite / death만 사용
#
# v2.4
# - 커스텀 direwolf:desert_howl 제거
# - 바닐라 entity.wolf.whine 단일 사운드로 변경
# - howl 기능 제거
#
# v2.3
# - 커스텀 sound volume을 1.0으로 올리고 MASTER 카테고리/radius 24 명시
# - 사운드 이벤트 키는 direwolf:desert_howl 유지
#
# v2.2
# - howl 중 busy/AI lock으로 idle/walk가 삭제된 howl 애니메이션을 중간에 덮어쓰는 현상 수정
# - 기존 여러 바닐라 wolf 사운드 레이어 제거
# - 0.84초에 direwolf:desert_howl 커스텀 OGG 1회 재생, 2.44초에 깔끔하게 종료
#
# v2.1
# - howl 사운드를 wolf_big.whine / wolf_big.ambient 조합으로 변경
# - 0.84~2.44초 구간 유지, 더 굵고 길게 들리도록 피치/레이어 조정
#
# v2.0
# - howl 소리 시작점을 애니메이션 0.84초(17틱)에 맞춤
# - 2.44초(49틱)까지 약 1.6초 동안 낮은 피치 wolf ambient/whine를 겹쳐
#   짧은 짖음보다 길게 이어지는 늑대 하울링 느낌으로 조정
#
# v1.9
# - 삭제된 howl 애니메이션 때 '워우우우' 느낌이 나도록 낮은 피치의 wolf growl/ambient를 겹쳐 재생
# - 공격음은 기존 설정 유지
#
# v1.8
# - 전투 스킬 로직 변경 없음
# - 몹 파일에서 players 타겟 셀렉터 제거, 피격 후 반격형으로 변경
#
# v1.7 수정
# - h_head는 원본 그대로 유지
# - 모델 mechanic을 ~onSpawn에서 즉시 실행하지 않고 Init 내부에서 2틱 지연 후 적용
# - 모델 적용 후 추가 5틱 대기 뒤 idle 및 AI 시작
# - ~onSpawnOrLoad로 서버 재시작 후 로드까지 같은 초기화 경로 사용
#
# v1.4 수정
# - 물기 희귀 문제 원인 수정: 3.2블럭에서 할퀴기가 먼저 발동해 늑대가 접근을 멈추던 구조 제거
# - AttackRouter를 2.1블럭 이내에서만 실행 -> Swipe/Bite가 항상 동시에 후보가 됨
# - 공격 선택 비율을 원래 기획대로 할퀴기 2 : 물기 1로 고정
# - 할퀴기 본체 애니메이션을 bbmodel에서 약 15% 빠르게 조정
# - 빨라진 모션에 맞춰 할퀴기 타격 시점을 6틱 -> 5틱으로 보정
# ============================================================

DirewolfDesert_Init:
  Skills:
    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    - setvariable{var=caster.anim_move;value=0;type=INTEGER} @self
    - setAI{ai=false} @self
    - delay 2
    - model{mid=direwolf_desert;n=false} @self
    - delay 5
    - state{mid=direwolf_desert;s=idle;f=true} @self
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self
    - setAI{ai=true} @self

DirewolfDesert_WalkStart:
  Conditions:
    - variableEquals{var=caster.busy;value=0} true
    - variableEquals{var=caster.anim_move;value=0} true
    - moving true
  Skills:
    - setvariable{var=caster.anim_move;value=1;type=INTEGER} @self
    - state{mid=direwolf_desert;s=walk;f=true} @self

DirewolfDesert_IdleStart:
  Conditions:
    - variableEquals{var=caster.busy;value=0} true
    - variableEquals{var=caster.anim_move;value=1} true
    - moving false
  Skills:
    - setvariable{var=caster.anim_move;value=0;type=INTEGER} @self
    - state{mid=direwolf_desert;s=idle;f=true} @self

DirewolfDesert_AttackRouter:
  Conditions:
    - variableEquals{var=caster.busy;value=0} true
    - targetwithin{d=2.1} true
  Skills:
    - randomskill{skills=DirewolfDesert_Swipe 2,DirewolfDesert_Bite 1} @self

DirewolfDesert_SwipeRangeFX:
  Skills:

DirewolfDesert_BiteRangeFX:
  Skills:

DirewolfDesert_Swipe:
  Conditions:
    - variableEquals{var=caster.busy;value=0} true
    - targetwithin{d=2.1} true
  Skills:
    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    - setvariable{var=caster.anim_move;value=0;type=INTEGER} @self
    - look{headOnly=false;force=true;immediately=true} @target
    - skill{s=DirewolfDesert_SwipeRangeFX} @self
    - attribute{attribute=KNOCKBACK_RESISTANCE;a=1;duration=17} @self
    - setAI{ai=false} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - state{mid=direwolf_desert;s=swipe;f=true} @self
    - delay 3
    - sound{s=entity.player.attack.sweep;v=0.32;p=1.22} @self
    - delay 2
    - summon{type=Direwolf_Desert_SlashFX;amount=1;radius=0} @Forward{f=1}
    - damage{a=6} @LivingInCone{a=60;r=3;rot=0;target=players}
    - sound{s=entity.player.attack.sweep;v=0.30;p=1.42} @self
    - delay 12
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - setAI{ai=true} @self
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self
    - setvariable{var=caster.anim_move;value=0;type=INTEGER} @self
    - state{mid=direwolf_desert;s=idle;f=true} @self

DirewolfDesert_Bite:
  Conditions:
    - variableEquals{var=caster.busy;value=0} true
    - targetwithin{d=2.1} true
  Skills:
    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    - setvariable{var=caster.anim_move;value=0;type=INTEGER} @self
    - look{headOnly=false;force=true;immediately=true} @target
    - skill{s=DirewolfDesert_BiteRangeFX} @self
    - attribute{attribute=KNOCKBACK_RESISTANCE;a=1;duration=19} @self
    - setAI{ai=false} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - state{mid=direwolf_desert;s=bite;f=true} @self
    - delay 3
    - summon{type=Direwolf_Desert_BiteFX;amount=1;radius=0} @Forward{f=1.5}
    - damage{a=7} @LivingInCone{a=60;r=2;rot=0;target=players}
    - sound{s=entity.wolf.growl;v=0.45;p=0.84} @self
    - delay 16
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - setAI{ai=true} @self
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self
    - setvariable{var=caster.anim_move;value=0;type=INTEGER} @self
    - state{mid=direwolf_desert;s=idle;f=true} @self

DirewolfDesert_Death:
  Skills:
    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    - setAI{ai=false} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - state{mid=direwolf_desert;s=death;f=true} @self
    - sound{s=entity.wolf.death;v=0.80;p=0.90} @self
