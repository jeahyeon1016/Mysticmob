    NoDamageTicks: 0
    KnockbackResistance: 1
    # Custom death sequence에서 ~onDeath를 취소한 뒤 60틱 동안 엔티티 유지
    ReviveHealth: 1

  Skills:
  # 패턴 변수 초기화
  - skill{s=kurrot_INIT} @self ~onSpawn
  - skill{s=aggro} @self ~onEnterCombat


  # Charge 중 현재 Threat Target을 2틱마다 재추적 + 접근 감지 + watchdog
  - skill{s=kurrot_CHARGE_CHASE} @target ~onTimer:2
  - skill{s=kurrot_charge_attack} @target ~onTimer:2
  - skill{s=kurrot_CHARGE_WATCHDOG} @self ~onTimer:2

  # 1페 death 연출 중에는 추가 피격을 즉시 취소.
  # CancelEvent는 sync 실행이 필수.
  - skill{s=kurrot_TRANSITION_DAMAGE_GUARD;sync=true} @self ~onDamaged

  # 모든 피격: combat_stack +1 (death 전환 중에는 skill 내부에서 차단)
  - skill{s=kurrot_COMBATSTACK_DAMAGED} @self ~onDamaged

  # 7블럭 밖에서 플레이어에게 피격 시 Runner Stack 누적 + 스택별 Threat 전환 확률
  # Bukkit PROJECTILE 판정에 의존하지 않으므로 Fabled Particle Projectile 등도 포함
  - skill{s=kurrot_RANGED_DISTANCE_HIT;sync=true} @Trigger ~onDamaged

  # ThreatTable의 실제 현재 타겟이 바뀔 때마다 전역 로그.
  - skill{s=kurrot_THREAT_TARGET_CHANGED} @self ~onChangeTarget

  # KUR 내부 전투 상태 확인용 디버그.
  - skill{s=kur2_STATE_DEBUG} @self ~onTimer:20

  # ========================================================
  # 행동 패턴 1차 필터 (mob file)
  #
  # 고수분 구조처럼:
  # 1) mob 파일에서 전투 여부 + 대략적인 거리 필터
  # 2) skill 내부에서 실제 실행 거리 / busy / stack 재검사
  # ========================================================

  # 근접 콤보:
  # - 전투 중
  # - 현재 Threat Target이 4.5블럭 이내일 때만 호출
  # - 실제 COMBO_START는 skill 내부에서 4.0블럭을 다시 검사
  - skill{s=kurrot_MeleeRouter} @target ~onTimer:4 ?incombat ?targetwithin{d=4.5}

  # Ground Slam:
  # - 전투 중
  # - 현재 Threat Target이 5블럭 이내
  # - skill 내부에서 combat_stack >= 4 / busy=0 / 거리 5.0 재검사
  - skill{s=kurrot_groundslam} @target ~onTimer:10 ?incombat ?targetwithin{d=5}

  # Charge:
  # - 전투 중
  # - 현재 Threat Target이 7블럭 밖
  # - skill 내부에서 busy=0 / charging=0 / 거리 >7 재검사
  - skill{s=kurrot_charge} @target ~onTimer:10 ?incombat ?targetnotwithin{d=7}

  # ModelEngine Hybrid State Machine
  - meg:model{mid=kur_rot;d=true;i=true;lpitch=true;usm=true;save=true} @self ~onSpawn
  - meg:model{mid=kur_rot;d=true;i=true;lpitch=true;usm=true;save=true} @self ~onLoad

  - skill{s=kurrot_DEATH;sync=true} @self ~onDeath


####### ON FOOT / 2 PHASE ########
#
# 1페 종료 후 kurrot_DEATH가 KUR을 소환.
# idle(하차 점프) -> land -> idle_default 이후 전투 시작.
#

KUR:
  Type: HUSK
  Display: '&6(Lv50) &c아토믹 고블린'

  AIGoalSelectors:
  - clear
  - float
  - meleeattack
  - movetowardstarget
  - randomstroll
  - lookatplayers
  - randomlookaround

  AITargetSelectors:
  - clear
  - players

  Health: 100
  Damage: 0

  BossBar:
    Enabled: true
    Title: '&c아토믹 고블린'
    Range: 64
    Color: RED
    DarkenSky: true

  Modules:
    ThreatTable: true

  Options:
    FollowRange: 64
    MovementSpeed: 0.38
    PreventOtherDrops: true
    Silent: true
    LockPitch: true
    Despawn: false
    NoDamageTicks: 0
    KnockbackResistance: 1
    ReviveHealth: 1

  Skills:
  - remove{delay=6000} @self ~onSpawn

  # 모델 부착.
  - meg:model{mid=kur;d=true;i=true;lpitch=true;usm=true;save=true} @self ~onSpawn
  - meg:model{mid=kur;d=true;i=true;lpitch=true;usm=true;save=true} @self ~onLoad

  # 중요:
  # kur.bbmodel의 'idle'은 하차 회전 모션인데 이름 때문에 기본 idle에 자동 매칭됨.
  # 기본 idle 타입을 실제 평상시 대기 모션인 idle_default로 교체한다.
  - meg:defaultstate{mid=kur;type=idle;state=idle_default;li=2;lo=2} @self ~onSpawn
  - meg:defaultstate{mid=kur;type=idle;state=idle_default;li=2;lo=2} @self ~onLoad

  # death 종료 후 생성된 KUR: 플레이어를 보며 뒤 3블럭 Missile 하차 -> 실제 착지 -> land.
  - skill{s=kurSPAWN} @self ~onSpawn

  # 하차 Missile 이동 후 실제 착지 감지 -> land
  - skill{s=kurSPAWNLAND} @self ~onTimer:1

  # idle_default의 시작/정지는 ModelEngine DefaultState에 맡긴다.

  # Jump Attack 실제 착지 감지
  - skill{s=kur2_JUMP_LAND_CHECK} @self ~onTimer:1

  # ========================================================
  # 분리 멧돼지
  # ========================================================

  # KUR 현재 Threat Target 표식.
  # 이 Aura는 P2 원거리 Runner 이전 Threat 유지 로직에서만 사용한다.
  # BOAR 대상 선정에는 사용하지 않는다.
  - skill{s=kur2_BOAR_MARK_KING_TARGET} @target ~onTimer:2

  # BOAR 대상 선정은 BOAR가 직접 수행한다.
  # BOAR Parent=KUR + Premium origin=@Parent 방식.

  # ========================================================
  # 행동 패턴 1차 필터 (mob file)
  # 스킬 내부에서도 incombat / busy / 거리 재검사.
  # ========================================================

  # Runner Mode 동안 자연 Threat까지 잠금.
  # runner_mode 자체를 기준으로 실행하므로 incombat에 의존하지 않는다.
  - skill{s=kur2_RUNNER_THREAT_LOCK} @self ~onTimer:1

  # 다른 패턴 종료 대기 여부 확인용 디버그.
  - skill{s=kur2_RUNNER_WAIT_DEBUG} @self ~onTimer:10

  # Runner Mode 최우선 실행: busy=0이 되는 즉시 고정 Runner Target에게 Leap.
  - skill{s=kur2_RUNNER_ROUTER} @self ~onTimer:1

  # 특수 패턴 후보: Spin / Jump / Range Slash
  - skill{s=kur2_SpecialRouter} @target ~onTimer:10 ?incombat ?targetwithin{d=18}

  # 근접 콤보 후보: 실제 Attack1 부채꼴은 skill 안에서 다시 검사.
  - skill{s=kur2_MeleeRouter} @self ~onTimer:4 ?incombat ?targetwithin{d=5.5}

  # 바닐라 HUSK 평타 이벤트는 항상 취소.
  - skill{s=kurATTACKsync;sync=true} @self ~onAttack

  # 커스텀 Death Pattern 중 추가 피해 차단

  - skill{s=kur2_DEATH_DAMAGE_GUARD;sync=true} @self ~onDamaged

  # 2페 피격 반응 우선순위:
  # 1) 7블럭 밖이면 Runner 전 기존 타겟 유지
  # 2) Runner Stack 누적 / 7스택이면 Runner Target으로 전환
  # 3) Big Damage / Side-Back은 7블럭 이내 근거리에서만 Threat Swap
  - skill{s=kur2_RANGED_PRE_RUNNER_HOLD;sync=true} @Trigger ~onDamaged
  - skill{s=kur2_RUNNER_STACK_HIT;sync=true} @Trigger ~onDamaged
  - skill{s=kur2_THREAT_BIG_DAMAGE;sync=true} @Trigger ~onDamaged
  - skill{s=kur2_THREAT_BACKSIDE;sync=true} @Trigger ~onDamaged

  # 자연사 취소 -> caster.busy=2 기반 Death Pattern
  - skill{s=kurDEATH;sync=true} @self ~onDeath




# ============================================================
# SEPARATED BOAR / 분리 멧돼지
#
# BetterModel model id: kur_rot_boar
# - 과거 분리 모델에서 idle / walk / charge / shove 등을 보유.
#
# 역할:
# - KUR의 현재 타겟과 다른 플레이어 우선
# - KUR 기준 먼 플레이어(FAR/MID) 우선
# - 최근 타겟을 잠시 후순위
# - 4초마다 KUR이 선정한 script target만 추적
# - 자연 Threat 자체를 사용하지 않으며 KUR이 지정한 script target만 추적
#
# TEST:
# - HP 100
# - 몸박 5
# ============================================================

GOBLIN_KING_BOAR:
  Type: HUSK
  Display: '&6고블린 킹의 멧돼지'

  Health: 100
  Damage: 0

  Modules:
    ThreatTable: true

  Options:
    FollowRange: 256
    MovementSpeed: 0.36
    PreventOtherDrops: true
    PreventItemPickup: true
    Silent: true
    Despawn: false
    NoDamageTicks: 0
    KnockbackResistance: 0.65

  AIGoalSelectors:
    - clear
    - float

    # v5.52:
    # 이동은 MythicMobs goto @target으로 직접 제어.
    # meleeattack / movetowardstarget / randomstroll 제거로 AI Goal 간섭 차단.
    - lookAtTarget

  AITargetSelectors:
    # 자연 자동 선택은 금지.
    # 플레이어 target은 direct origin=@MIR{...KUR...} selector가 BOAR ThreatTable에 직접 지정.
    - clear

  Skills:
    - meg:model{mid=kur_rot_boar;d=true;i=true;lpitch=true;usm=true;save=true} @self ~onSpawn
    - meg:model{mid=kur_rot_boar;d=true;i=true;lpitch=true;usm=true;save=true} @self ~onLoad

    - skill{s=GK_BOAR_INIT} @self ~onSpawn
    - skill{s=GK_BOAR_INIT} @self ~onLoad

    # 스폰 직후 4틱 대기 후 첫 direct-origin target 선정.
    - skill{s=GK_BOAR_INITIAL_SELECT} @self ~onSpawn
    - skill{s=GK_BOAR_INITIAL_SELECT} @self ~onLoad

    # 4초마다 BOAR가 mechanic 자체의 origin을 주변 KUR로 지정하고
    # KUR 기준 FURTHEST 플레이어를 직접 Threat/current target으로 지정.
    - skill{s=GK_BOAR_SELECT_TARGET_DIRECT} @self ~onTimer:80

    # ThreatTOP 상태 확인.
    - skill{s=GK_BOAR_STATE_DEBUG} @self ~onTimer:20

    # v5.52:
    # 실제 current target(@target)으로 5틱마다 직접 pathfinding.
    # 더미 v1.4에서 정상 이동 확인한 방식.
    - skill{s=GK_BOAR_CHASE_TARGET} @self ~onTimer:5

    # Damage:0 / vanilla ~onAttack과 무관하게 직접 커스텀 공격 판정.
    - skill{s=GK_BOAR_ATTACK_ROUTER} @self ~onTimer:2

    - skill{s=GK_BOAR_DEATH} @self ~onDeath


