# - Leap 종료/Death 시 Aura 제거 후 일반 ThreatTable 복귀
# v5.23: Jump Impact를 타점+착지 양방향 재시도 구조로 복구.
# - 1.80초 미착지 즉시 MISS 종료 제거
# - jump_armed 0/1/2 상태값 확장, 새 변수 없음
# - 1.80초 도달 또는 실제 착지 중 늦게 온 순간 Impact 실행
# v5.22: 일반 Jump를 접근기로 재배치.
# - Normal Jump 5.5~11블럭
# - Range Slash 7~18블럭
# - Special 가중치 Spin 2 / Jump 3 / Range Slash 2 / NOOP 2
# - Runner Leap은 거리 제한 없는 강제 추격 유지
# v5.21: 2페 변수/AI 정리 + Threat Reaction + Runner 7스택 Leap.
# - p2_ready / jump_active / jump_damage_ready / jump_done 제거
# - 2페 AI OFF / caster velocity=0 제거, SLOW 중심 제어
# - GroundBreak 전방 3블럭
# - Combo Step / Runner Stack 채팅 디버그
# - Side/Back + Big Hit Threat Swap 100, 공용 Aura Lock 40t
# - 7블럭 밖 피격 7회 -> runner_mode=1 -> Trigger Threat100 -> Runner Leap -> reset
# v5.20: 2페 하차 소환 직후 초기 대기 제거. look/idle/SLOW/Missile 즉시 시작.
# v5.19: 2페 하차 Missile 디버그 강화 / fromorigin=true / sfo=0.
# v5.18: 1/2페 공용 busy lock 통합. busy=2는 죽음/페이즈 전환 전용.
# v5.0: 2페이즈 ON FOOT 패턴 1차 구현.
# v4.2: 행동 진입 스킬에 inCombat 2차 필터 추가
# - MeleeRouter / COMBO_START / SpecialRouter / Ground Slam / Charge
# - 이미 시작된 콤보 단계/히트/cleanup에는 inCombat을 넣지 않음
#   (전투 종료 순간 cleanup이 씹혀 busy가 남는 문제 방지)
#
# v4.1: 피격 시 combat_stack 누적 활성화
# - 패턴 실행 중(busy=1)이어도 피격은 combat_stack +1
# - 원거리 투사체 피격은 combat_stack +1 + runner_stack +1
# - runner_stack은 Charge 조건에 사용하지 않음
# - 7블럭 밖 PROJECTILE 피격마다 runner_stack +1
# - Threat 강제전환 확률: 1=15%, 2=30%, 3=45%, 4=60%, 5+=75%
# - Threat 전환 성공 시 runner_stack=0
# - Charge는 현재 Threat Target이 7블럭 밖이면 combat_stack/runner_stack 없이 발동
# - Charge에서 AI Goal clear / FollowPath 제거
# - Charge 시작 시 AI를 명시적으로 ON
# - SetSpeed 완전 제거: 평상시 MovementSpeed 0.32를 절대 덮어쓰지 않음
# - Charge 중 2틱마다 goto(speed modifier)로만 가속 추적
# - delay 기반 TIMEOUT 제거, charge_watch 카운터로 현재 Charge만 감시
# - 기존 추적 AI를 유지하고 SetSpeed로 이동속도만 올려 타겟을 계속 추적
# - charge 애니메이션은 Slash가 나올 때까지 LOOP 유지
# - Charge 시작/Slash/Timeout/Runner Stack을 디버그 메시지로 표시
#
# 핵심 구조
# 1) 패턴 격리
#    - busy=1인 동안 다른 신규 패턴 진입 차단
#    - 일반 공격도 ATTACKsync -> COMBO_START Router를 통해서만 진입
#    - ChargeAttack은 Charge 내부 하위 패턴이므로 busy=1 상태에서만 동작
#
# 2) 콤보 시스템
#    - Attack1 -> Attack2 -> Shove
#    - 각 단계 사이에 플레이어가 사거리에서 벗어나면 즉시 콤보 종료/AI 복구
#    - 각 타격 성공 시 combat_stack +1
#
# 3) 전투 스택
#    - combat_stack >= 4 : Ground Slam 후보 / 사용 시 4 소비
#    - Charge는 전투스택과 완전히 독립
#
# 4) Charge = 거리 좁히기 전용 돌진
#    - 현재 Target이 7블럭 밖이면 후보
#    - 현재 Target을 짧게 조준 후 즉시 돌진
#    - charge 모델링은 LOOP 상태로 유지
#    - Target이 5.2블럭 안에 들어오면 달리는 상태 위에 Slash를 겹침
#    - 접근하지 못하면 10초 후 failsafe 종료
#
# 기존 공식 mob 파일 Skill ID 호환:
# - kurrot_ATTACKsync @self ~onAttack
# - kurrot_groundslam @target ~onTimer:20
# - kurrot_charge @self ~onTimer:20
# - kurrot_charge_attack @self ~onTimer:5
# - kurrot_DEATH
# ============================================================


# ============================================================
# INIT / ENTER COMBAT
# ============================================================

kurrot_INIT:
  Skills:
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self
    - setvariable{var=caster.charging;value=0;type=INTEGER} @self
    - setvariable{var=caster.combo_step;value=0;type=INTEGER} @self
    - setvariable{var=caster.combat_stack;value=0;type=INTEGER} @self
    - setvariable{var=caster.runner_stack;value=0;type=INTEGER} @self
    - setvariable{var=caster.charge_attack_used;value=0;type=INTEGER} @self
    - setvariable{var=caster.charge_attack_armed;value=0;type=INTEGER} @self
    - setvariable{var=caster.charge_watch;value=0;type=INTEGER} @self

aggro:
  Skills:
    - skill{s=kurrot_INIT} @self



# ============================================================
# COMBAT STACK VISUAL DEBUG
#
# 전투스택이 변할 때 주변 플레이어에게 7칸 게이지를 표시한다.
# 4+ = SLAM READY / Charge는 거리 조건으로 별도 관리
# ============================================================

kurrot_STACK_DISPLAY:
  Skills:
    - skill{s=kurrot_STACK_0} @PlayersInRadius{r=32}
    - skill{s=kurrot_STACK_1} @PlayersInRadius{r=32}
    - skill{s=kurrot_STACK_2} @PlayersInRadius{r=32}
    - skill{s=kurrot_STACK_3} @PlayersInRadius{r=32}
    - skill{s=kurrot_STACK_4} @PlayersInRadius{r=32}
    - skill{s=kurrot_STACK_5} @PlayersInRadius{r=32}
    - skill{s=kurrot_STACK_6} @PlayersInRadius{r=32}
    - skill{s=kurrot_STACK_7PLUS} @PlayersInRadius{r=32}

kurrot_STACK_0:
  Conditions:
    - variableEquals{var=caster.combat_stack;value=0} true
  Skills:
    - message{m="&8[P1 Combat] &7□□□□□□□ &f0/7"} @PlayersInWorld

kurrot_STACK_1:
  Conditions:
    - variableEquals{var=caster.combat_stack;value=1} true
  Skills:
    - message{m="&8[P1 Combat] &e■&7□□□□□□ &f1/7"} @PlayersInWorld

kurrot_STACK_2:
  Conditions:
    - variableEquals{var=caster.combat_stack;value=2} true
  Skills:
    - message{m="&8[P1 Combat] &e■■&7□□□□□ &f2/7"} @PlayersInWorld

kurrot_STACK_3:
  Conditions:
    - variableEquals{var=caster.combat_stack;value=3} true
  Skills:
    - message{m="&8[P1 Combat] &e■■■&7□□□□ &f3/7"} @PlayersInWorld

kurrot_STACK_4:
  Conditions:
    - variableEquals{var=caster.combat_stack;value=4} true
  Skills:
    - message{m="&8[P1 Combat] &6■■■■&7□□□ &f4+ &6[SLAM READY]"} @PlayersInWorld

kurrot_STACK_5:
  Conditions:
    - variableEquals{var=caster.combat_stack;value=5} true
  Skills:
    - message{m="&8[P1 Combat] &6■■■■■&7□□ &f5+ &6[SLAM READY]"} @PlayersInWorld

kurrot_STACK_6:
  Conditions:
    - variableEquals{var=caster.combat_stack;value=6} true
  Skills:
    - message{m="&8[P1 Combat] &6■■■■■■&7□ &f6+ &6[SLAM READY]"} @PlayersInWorld

kurrot_STACK_7PLUS:
