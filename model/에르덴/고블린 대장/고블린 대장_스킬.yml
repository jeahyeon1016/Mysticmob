    - variableInRange{var=caster.combat_stack;value=>7} true
  Skills:
    - message{m="&8[P1 Combat] &c■■■■■■■ &f<caster.var.combat_stack>+ &6[SLAM READY]"} @PlayersInWorld


# ============================================================
# RANGED THREAT RESPONSE / RUNNER STACK
#
# runner_stack의 역할:
# - Charge 해금용 아님
# - 원거리 공격을 반복해서 받을수록 '그 공격자에게 관심을 돌릴 확률'을 올리는 기억값
#
# 7블럭 밖 PROJECTILE 피격:
#   stack 1 = 15%
#   stack 2 = 30%
#   stack 3 = 45%
#   stack 4 = 60%
#   stack 5+ = 75%
#
# Threat 전환 성공:
# - 기존 Threat clear
# - 방금 쏜 플레이어 Threat 100
# - runner_stack 0으로 초기화
# ============================================================

kurrot_RANGED_PROJECTILE_HIT:
  Conditions:
    - damagecause{c=PROJECTILE} true
  TargetConditions:
    - distance{d=>7} true
  Skills:
    - variableadd{var=caster.runner_stack;amount=1} @self
    - skill{s=kurrot_RUNNER_STACK_DISPLAY} @self

    # 이 시점은 확률형 강제 Swap을 굴리기 전.
    # <trigger.threat> = 방금 활을 맞힌 공격자의 실제 Threat
    # <caster.tt.top> = 현재 ThreatTable 1위 플레이어 이름
    - message{m="&8[P1 Threat BEFORE ROLL] &fShooter=&e<trigger.name> &7| Threat=&e<trigger.threat> &7| TOP=&c<caster.tt.top> &7| Runner=&f<caster.var.runner_stack>"} @PlayersInWorld

    - skill{s=kurrot_RANGE_THREAT_ROLL} @Trigger

    # 자연 Threat 반영 시점을 확인하기 위한 1틱 후 재측정.
    # FORCED 로그 없이 여기서 Shooter Threat가 올라가고 TOP이 Shooter로 바뀌면
    # 자연 ThreatTable 전환으로 확정 가능.
    - delay 1
    - message{m="&8[P1 Threat AFTER 1T] &fShooter=&e<trigger.name> &7| Threat=&e<trigger.threat> &7| TOP=&c<caster.tt.top> &7| Runner=&f<caster.var.runner_stack>"} @PlayersInWorld


