    - skill{s=kurrot_RUNNER_DBG_2} @self
    - skill{s=kurrot_RUNNER_DBG_3} @self
    - skill{s=kurrot_RUNNER_DBG_4} @self
    - skill{s=kurrot_RUNNER_DBG_5PLUS} @self

kurrot_RUNNER_DBG_1:
