# ============================================================
# v0.75 공통 스킬 범위 표시
# - 빨강/주황 계열: 피해 범위
# - 청록 계열: 습윤/정화 계열
# ============================================================

# 기본공격: 전방 약 3블럭 타격영역을 작은 원 2개로 표시
CopperOrigin_P1_BasicAttack:
  Cooldown: 3.5
  Conditions:
    - variableEquals{var=caster.transitioning;value=0} true
    - variableEquals{var=caster.phase;value=1} true
    - variableEquals{var=caster.busy;value=1} false
    - targetwithin{d=4.2} true
  Skills:
    - state{mid=copper_origin_p1;s=basic_attack} @self
    # 실제 판정: 보스가 바라보는 전방 80도 / 3.0블럭 안의 플레이어만 적중
    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    - setAI{ai=false} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self

    # 주먹을 들어올리는 텔레그래프
    - sound{s=entity.iron_golem.step;v=1.25;p=0.65} @self
    - effect:particles{particle=dust;color=#FFD166;size=1.0;amount=12;hS=0.55;vS=0.35;y=1.2;speed=0.005} @self
    - effect:particles{particle=crit;amount=6;hS=0.35;vS=0.25;y=1.5;speed=0.02} @self
    - delay 20
    - cancelSkill ?variableEquals{var=caster.transitioning;value=1}
    - effect:particles{particle=dust;color=#FFB703;size=1.15;amount=16;hS=0.65;vS=0.40;y=1.2;speed=0.005} @self
    - delay 15
    - cancelSkill ?variableEquals{var=caster.transitioning;value=1}

    - damage{a=10} @LivingInCone{a=80;r=3.0;rot=0;target=players}
    - throw{velocity=0.55;velocityY=0.10} @LivingInCone{a=80;r=3.0;rot=0;target=players}
    - sound{s=entity.iron_golem.attack;v=1.35;p=0.70} @self

    - delay 10
    - cancelSkill ?variableEquals{var=caster.transitioning;value=1}
    - setAI{ai=true} @self ?variableEquals{var=caster.transitioning;value=0}
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self ?variableEquals{var=caster.transitioning;value=0}


