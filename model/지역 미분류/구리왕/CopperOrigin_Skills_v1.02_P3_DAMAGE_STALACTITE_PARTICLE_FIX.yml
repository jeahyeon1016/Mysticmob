# BLOCK_DISPLAY 낙하 이동.
# DisplayOptions.TeleportDuration=50 이므로 실제 텔레포트가 화면에서는
# 약 2.5초 동안 부드럽게 아래로 보간된다.



# ------------------------------------------------------------
# 포효 낙석 시각 전용 ArmorStand 수동 낙하
#
# 블럭 본체만 이동. trail 파티클 없음.
# 26 -> 24 -> 22 -> ... -> 2
# 4틱 간격 × 12회 = 약 2.4~2.8초 체감.
# ------------------------------------------------------------


CopperOrigin_WetStoneCleanseAtOrigin:
  Skills:
    # projectile 착탄 origin 기준 구리화 정확히 -1.
    - command{c="execute positioned <skill.var.origin.x> <skill.var.origin.y> <skill.var.origin.z> as @a[distance=..1.45,tag=copper_1] run tag @s remove copper_1"}

    - command{c="execute positioned <skill.var.origin.x> <skill.var.origin.y> <skill.var.origin.z> as @a[distance=..1.45,tag=copper_2] run tag @s add copper_1"}
    - command{c="execute positioned <skill.var.origin.x> <skill.var.origin.y> <skill.var.origin.z> as @a[distance=..1.45,tag=copper_2] run tag @s remove copper_2"}

    - command{c="execute positioned <skill.var.origin.x> <skill.var.origin.y> <skill.var.origin.z> as @a[distance=..1.45,tag=copper_3] run tag @s add copper_2"}
    - command{c="execute positioned <skill.var.origin.x> <skill.var.origin.y> <skill.var.origin.z> as @a[distance=..1.45,tag=copper_3] run tag @s remove copper_3"}

    - command{c="execute positioned <skill.var.origin.x> <skill.var.origin.y> <skill.var.origin.z> as @a[distance=..1.45,tag=copper_4] run tag @s add copper_3"}
    - command{c="execute positioned <skill.var.origin.x> <skill.var.origin.y> <skill.var.origin.z> as @a[distance=..1.45,tag=copper_4] run tag @s remove copper_4"}

    - command{c="execute positioned <skill.var.origin.x> <skill.var.origin.y> <skill.var.origin.z> as @a[distance=..1.45,tag=copper_5] run tag @s add copper_4"}
    - command{c="execute positioned <skill.var.origin.x> <skill.var.origin.y> <skill.var.origin.z> as @a[distance=..1.45,tag=copper_5] run tag @s remove copper_5"}



