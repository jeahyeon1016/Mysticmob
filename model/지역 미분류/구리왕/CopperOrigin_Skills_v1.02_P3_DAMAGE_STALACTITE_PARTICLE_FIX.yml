# 습윤석은 반경 1블럭 플레이어의 구리화 정확히 -1
# 산화수와 동일한 command 방식 사용.
CopperOrigin_WetStoneCleanse:
  Skills:
    - command{c="execute at <caster.uuid> as @a[distance=..1,tag=copper_1] run tag @s remove copper_1"} @self

    - command{c="execute at <caster.uuid> as @a[distance=..1,tag=copper_2] run tag @s add copper_1"} @self
    - command{c="execute at <caster.uuid> as @a[distance=..1,tag=copper_2] run tag @s remove copper_2"} @self

    - command{c="execute at <caster.uuid> as @a[distance=..1,tag=copper_3] run tag @s add copper_2"} @self
    - command{c="execute at <caster.uuid> as @a[distance=..1,tag=copper_3] run tag @s remove copper_3"} @self

    - command{c="execute at <caster.uuid> as @a[distance=..1,tag=copper_4] run tag @s add copper_3"} @self
    - command{c="execute at <caster.uuid> as @a[distance=..1,tag=copper_4] run tag @s remove copper_4"} @self

    - command{c="execute at <caster.uuid> as @a[distance=..1,tag=copper_5] run tag @s add copper_4"} @self
    - command{c="execute at <caster.uuid> as @a[distance=..1,tag=copper_5] run tag @s remove copper_5"} @self


# 행동 종료.
# 패턴 중간에 종유석 그로기가 걸리면 busy는 groggy recover가 해제하므로
# 여기서는 그로기가 아닐 때만 해제.
CopperOrigin_P3_EndAction:
  Conditions:
  Skills:
    - setAI{ai=true} @self
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self


# ============================================================
# 실제 점적석 낙하 감지 브리지
#
# 기존 v0.1~0.2의 CopperOrigin_StalactiteHit은
# "맵 기믹이 이 스킬을 직접 호출한다"는 전제의 수동 훅이었음.
# 그래서 바닐라 점적석을 그냥 떨어뜨려 맞혀도 자동 발동하지 않았음.
#
# v0.3부터는 보스가 FALLING_STALACTITE 피해를 받으면
# 자동으로 CopperOrigin_StalactiteHit을 호출.
# 혹시 서버/Paper에서 FALLING_BLOCK으로 들어오는 경우도 보조 처리.
# ============================================================

CopperOrigin_DripstoneDamageCheck:
  Skills:
    - skill{s=CopperOrigin_DripstoneCause_Stalactite} @self
    - skill{s=CopperOrigin_DripstoneCause_FallingBlock} @self

CopperOrigin_DripstoneCause_Stalactite:
  Conditions:
    - damagecause{cause=FALLING_STALACTITE} true
  Skills:
    - skill{s=CopperOrigin_StalactiteHit} @self

CopperOrigin_DripstoneCause_FallingBlock:
  Conditions:
    - damagecause{cause=FALLING_BLOCK} true
  Skills:
    - skill{s=CopperOrigin_StalactiteHit} @self
# ============================================================
# 종유석 외피 파괴 기믹
#
# 종유석은 일반 기절을 만들지 않으며,
# HP 봉인 상태에서 다음 페이즈 외피를 깨는 용도로만 사용.
# ============================================================


CopperOrigin_OxidationWater_OnP2:
  Conditions:
    - variableEquals{var=caster.phase;value=2} true
  Skills:
    - skill{s=CopperOrigin_OxidationWaterPool} @self




CopperOrigin_UnlockP2ByStalactite:
  Conditions:
    - variableEquals{var=caster.phase;value=1} true
    - variableEquals{var=caster.p2_gate;value=0} true
    - healthpercent{p=<=65%} true
  Skills:
    - setvariable{var=caster.p2_gate;value=1;type=INTEGER} @self
    - setvariable{var=caster.p2_damage_lock;value=0;type=INTEGER} @self
    - auraremove{aura=CopperOriginPhaseDamageLock} @self
    - effect:particles{particle=block;material=STONE;amount=55;hS=1.50;vS=1.35;y=1.25;speed=0.16} @self
    - effect:particlering{particle=dust;color=#F3C969;size=1.12;radius=3.4;points=44;amount=1;y=0.85;speed=0.006} @self
    - skill{s=CopperOrigin_PhaseCheck} @self

CopperOrigin_UnlockP3ByStalactite:
  Conditions:
    - variableEquals{var=caster.phase;value=2} true
    - variableEquals{var=caster.p3_gate;value=0} true
    # 30% 도달 여부는 HP를 재검사하지 않고 봉인 플래그로 판정.
    # ThresholdLock이 먼저 p3_damage_lock=1을 만들었을 때만 종유석이 외피를 파괴함.
    - variableEquals{var=caster.p3_damage_lock;value=1} true
  Skills:
    # 게이트를 먼저 열고 봉인을 해제한 뒤 Phase3Check를 즉시 호출.
    - setvariable{var=caster.p3_gate;value=1;type=INTEGER} @self
    - setvariable{var=caster.p3_damage_lock;value=0;type=INTEGER} @self
    - auraremove{aura=CopperOriginPhaseDamageLock} @self
    - effect:particles{particle=block;material=STONE;amount=70;hS=1.70;vS=1.55;y=1.25;speed=0.19} @self
    - effect:particlering{particle=dust;color=#FF8A2B;size=1.20;radius=3.8;points=48;amount=1;y=0.90;speed=0.008} @self
    - skill{s=CopperOrigin_Phase3Check} @self


CopperOrigin_StalactiteHit:
  Skills:
    # 종유석은 이제 "일반 기절" 용도가 아님.
    # 오직 체력 봉인 상태에서 돌 외피/석화를 깨는 기믹으로만 사용.
    - skill{s=CopperOrigin_UnlockP2ByStalactite} @self
    - skill{s=CopperOrigin_UnlockP3ByStalactite} @self

    # 외피 봉인 상태가 아닌 종유석 직격은 무거운 충돌 연출만.
    # 별도 groggy / busy / slowness / weakness / 5초 딜타임 없음.
    - sound{s=block.pointed_dripstone.land;v=1.2;p=0.65} @self
    - effect:particles{particle=block;material=STONE;amount=22;hS=0.65;vS=0.50;y=1.25;speed=0.10} @self


CopperOrigin_GroggyRecover:
  Conditions:
    - variableEquals{var=caster.groggy;value=1} true
  Skills:
    - setvariable{var=caster.groggy;value=0;type=INTEGER} @self
    - setAI{ai=true} @self
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self
    - potionclear{type=SLOWNESS} @self
    - potionclear{type=WEAKNESS} @self
    - sound{s=entity.iron_golem.repair;v=1.15;p=0.80} @self


# ============================================================
# v0.2 예정
#
# - P2 전환
# - 플레이어 변수 copper_stack 0~5
# - 내려치기/내리꽂기/구리 암석 투척의 구리화 부여
# - 강공격 또는 종유석으로 지하수층 파괴
# - 산화수 영역: 0.7~1초마다 copper_stack -1
# ============================================================

# ============================================================
# 보스 사망 시 구리화 즉시 초기화
# ============================================================

# ------------------------------------------------------------
# 보스 사망 처리
#
# BetterModel 쪽 애니메이션 이름은 반드시 'death'.
# BetterModel이 실제 사망 시 built-in death 애니메이션을 자동 재생하고,
# 이 MythicMobs 스킬은 전투 상태/플레이어 구리화 정리를 담당.
# ------------------------------------------------------------

CopperOrigin_Death:
  Skills:
    - skill{s=CopperOrigin_DeathCleanup} @self


CopperOrigin_DeathCleanup:
  Skills:
    - removetag{t=copper_1} @PlayersInRadius{r=50}
    - removetag{t=copper_2} @PlayersInRadius{r=50}
    - removetag{t=copper_3} @PlayersInRadius{r=50}
    - removetag{t=copper_4} @PlayersInRadius{r=50}
    - removetag{t=copper_5} @PlayersInRadius{r=50}
    - potionclear{type=SLOWNESS} @PlayersInRadius{r=50}
    - potionclear{type=WEAKNESS} @PlayersInRadius{r=50}
