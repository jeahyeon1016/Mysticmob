    - effect:particles{particle=block;material=STONE;amount=12;hS=1.20;vS=1.35;y=1.20;speed=0.025} @self

CopperOrigin_P3DamageLockVisual:
  Conditions:
    - variableEquals{var=caster.p3_damage_lock;value=1} true
  Skills:
    - effect:particlering{particle=dust;color=#D9772A;size=1.12;radius=2.8;points=38;amount=1;y=1.10;speed=0.002} @self
    - effect:particlering{particle=dust;color=#B8B8B8;size=0.82;radius=2.25;points=30;amount=1;y=1.55;speed=0.002} @self
    - effect:particles{particle=block;material=STONE;amount=14;hS=1.25;vS=1.45;y=1.25;speed=0.028} @self

