# ------------------------------------------------------------
# P3 패시브: 구리의 근원
#
# 보스를 때린 플레이어에게 구리화 +1
# 단, Fabled의 연타형 스킬 때문에 플레이어별 30틱(1.5초) 내부쿨.
# 그로기 중에는 절대 발동하지 않음.
# ------------------------------------------------------------

CopperOrigin_P3_SourcePassive:
  Conditions:
    - variableEquals{var=caster.phase;value=3} true
    - variableEquals{var=caster.transitioning;value=0} true
    - variableEquals{var=caster.groggy;value=1} false
  # 공식 MythicMobs TriggerConditions: 이 metaskill을 일으킨 실제 공격자를 검사.
  # Mob 파일에서 이 스킬을 @self로 실행해야 caster는 보스, trigger는 공격자로 유지됨.
  TriggerConditions:
    - entitytype{t=PLAYER} true
    - hastag{t=copper_origin_source_cd} false
  Skills:
    - addtag{t=copper_origin_source_cd} @trigger
    - skill{s=CopperOrigin_CopperAdd1} @trigger
    - effect:particles{particle=dust;color=#E8792D;size=0.85;amount=9;hS=0.34;vS=0.55;y=0.9;speed=0.003} @trigger
    - sound{s=block.copper.hit;v=0.65;p=1.15} @trigger
    - delay 30
    - removetag{t=copper_origin_source_cd} @trigger


