# 구리화 0~5 스택 - v0.6 TAG 방식
#
# 기존 target.copper_stack 변수가 플레이어에게 정상 유지되지 않아
# 매번 1/5로 다시 잡히는 현상이 있었음.
#
# v0.6부터는 플레이어 scoreboard tag로 스택 관리:
# copper_1 ~ copper_5
#
# 장점:
# - 서버에서 직접 /tag <player> list 로 확인 가능
# - nested skill target context 영향을 덜 받음
# - 산화수 정화 구현도 단순해짐
# ============================================================

CopperOrigin_CopperAdd1:
