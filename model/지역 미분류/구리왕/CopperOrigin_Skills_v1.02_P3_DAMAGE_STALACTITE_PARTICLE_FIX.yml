# ============================================================
# CopperOrigin Skills v1.02 - P3 DAMAGE + STALACTITE PROXY + PARTICLE FEEDBACK FIX
# - P1 모델만 attach, P2/P3는 remapmodel로 실제 텍스처/파츠 변경
# - 모델 remove/apply 없음 -> 페이즈 전환 깜빡임 제거
# - 모델 정면은 -Z이므로 실제 등 뒤(+Z)는 stone_front_bone임
# - P2/P3 등판 유지
# - P2: top/right/left/bottom/front 표시, back만 숨김
# - P3: top/right/left/bottom/front 표시, back만 숨김
# ============================================================
# v0.97
# - P1->P2 / P2->P3 전환 중 AI/이동/기존 패턴 후속 실행 완전 차단
# - 전환 시작 시 공격 state 제거 후 combat_idle 고정
# - P2/P3 전환 종료 시 타겟 즉시 재획득 + anim_move 리셋으로 보행 복구
# - P2/P3 모델 뒤쪽 torso core 투명 UV는 bbmodel에서 별도 수정
#
# v0.96
# - P3 일반 패턴 라우터/쿨다운/딜레이 약 1.4배 가속
# - P3 전용 fast 애니메이션 사용 (walk/basic/slam/piledrive/roar)
# - P3 공기파/포효 낙석 투사체 속도 약 1.4배
# - 구리의 근원 패시브: outer skill은 @self로 실행해 caster=보스 / trigger=공격자 보존
# - TriggerConditions는 공식 entitytype PLAYER + 공격자별 30틱 태그 쿨다운 사용
# ============================================================
# ============================================================
# v0.90 P3 FIX
# - P3 진입 시 healthpercent 중복 검사 제거
# - p3_damage_lock(30% 봉인 도달) + p3_gate(종유석 파괴)로 확정 전환
# - phase=2 / p3_gate=1 stuck 상태 방지
# ============================================================
# ============================================================
# 구리의 근원 / Copper Origin
# MythicMobs + BetterModel v0.90 P3 TRANSITION FIX
#
#
# v0.89 추가:
# - P1/P2/P3 모델 실제 교체 연결
# - P1=copper_origin_p1 / P2=copper_origin_p2 / P3=copper_origin_p3
# - 공통 idle/walk를 현재 phase의 모델로 자동 라우팅
# - 각 페이즈 공격 animation state도 해당 phase 모델 ID로 분리
#
# v0.88 기반:
# - P1 -> P2 전환 컷신 3.5초
# - P2 -> P3 전환 컷신 4.5초
# - 전환 중 AI/행동/피해 잠금
# - 돌 외피 균열 -> 파괴 -> 구리 노출 -> 페이즈 돌입 사운드 단계 연출
# - 향후 P2/P3 텍스처 모델 교체 지점을 주석으로 표시
# 구현 범위:
# P1
# 0. 묵직한 기본공격
# 1. 내려치기 - 반경 5 진동영역
# 2. 내리꽂기 - 3초간 바닥에 박힌 느낌
# 3. 암석 투척 - 피격 시 넉백
#
# 맵 기믹
# - CopperOrigin_StalactiteHit 을 보스에게 호출하면 5초 그로기
# - 실제 "활로 종유석 격추 -> 낙하 -> 보스 충돌" 연결은 맵 제작 단계에서 연결
# ============================================================


# ============================================================
# 0. 초기화 / 공통
# ============================================================

CopperOrigin_Init:
  Skills:
    - setvariable{var=caster.phase;value=1;type=INTEGER} @self
    - setvariable{var=caster.groggy;value=0;type=INTEGER} @self
    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    - setAI{ai=false} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - setvariable{var=caster.dormant;value=1;type=INTEGER} @self
    - setvariable{var=caster.p2_gate;value=0;type=INTEGER} @self
    - setvariable{var=caster.p3_gate;value=0;type=INTEGER} @self
    - setvariable{var=caster.p2_damage_lock;value=0;type=INTEGER} @self
    - setvariable{var=caster.p3_damage_lock;value=0;type=INTEGER} @self
    - setvariable{var=caster.p2_lock_notice;value=0;type=INTEGER} @self
    - setvariable{var=caster.p3_lock_notice;value=0;type=INTEGER} @self
    - setvariable{var=caster.p3_roar1_done;value=0;type=INTEGER} @self
    - setvariable{var=caster.p3_roar2_done;value=0;type=INTEGER} @self
    - setvariable{var=caster.roaring;value=0;type=INTEGER} @self
    - setvariable{var=caster.anim_move;value=0;type=INTEGER} @self
    - setvariable{var=caster.transitioning;value=0;type=INTEGER} @self

    # 이전 테스트에서 플레이어에게 남아 있던 구리화 태그 초기화
    - removetag{t=copper_1} @PlayersInRadius{r=35}
    - removetag{t=copper_2} @PlayersInRadius{r=35}
    - removetag{t=copper_3} @PlayersInRadius{r=35}
    - removetag{t=copper_4} @PlayersInRadius{r=35}
    - removetag{t=copper_5} @PlayersInRadius{r=35}

    - skill{s=CopperOrigin_BM_SpawnSequence} @self
    - effect:particles{particle=ash;amount=18;hS=1.0;vS=1.2;y=1.1;speed=0.01} @self
    - skill{s=CopperOrigin_InitialStalactiteRefresh} @self


# ============================================================
# BetterModel - uploaded animation set
#
# active model_identifier: copper_origin_p1 (P2/P3는 remap source)
# Animation:
# - sleep_sit_idle      : loop, 잠든 상태
# - wake_up_from_hit    : once, 첫 피격 기상
# - combat_idle         : loop, 전투 대기
# - walk                : 이동
# - lost_target_idle    : 타겟 상실 대기
# - basic_attack        : 기본 공격
# ============================================================

# ============================================================
# v0.95 REMAPMODEL NO-FLICKER PHASES
# P1 모델을 한 번만 부착하고 P2/P3는 remapmodel로 파츠/텍스처만 교체.
# 돌 외피 6개 bone은 partvis로 단계적으로 벗기고, 본체 텍스처/파츠는 remapmodel로 변경.
# 세 모델은 동일 bone 구조를 유지하며 별도 정상 텍스처를 사용. 모델 엔티티는 제거하지 않음.
# ============================================================
CopperOrigin_PhaseVisualInit:
  Skills:
    # 모델 부착 직후 원본 돌 외피 6조각을 전부 표시 = P1
    - delay 1
    - partvis{m=copper_origin_p1;p=stone_front_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_back_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_left_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_right_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_top_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_bottom_bone;v=true} @self

CopperOrigin_PhaseVisualEnsureP1:
  Conditions:
    - variableEquals{var=caster.phase;value=1} true
  Skills:
    - partvis{m=copper_origin_p1;p=stone_front_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_back_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_left_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_right_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_top_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_bottom_bone;v=true} @self

CopperOrigin_PhaseVisualEnsureP2:
  Conditions:
    - variableEquals{var=caster.phase;value=2} true
    - variableEquals{var=caster.transitioning;value=0} true
  Skills:
    # P2: 위/오른쪽/왼쪽/아래/등판은 모두 유지, 정면측 1장만 숨김
    - partvis{m=copper_origin_p1;p=stone_front_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_right_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_top_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_back_bone;v=false} @self
    - partvis{m=copper_origin_p1;p=stone_left_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_bottom_bone;v=true} @self

CopperOrigin_PhaseVisualEnsureP3:
  Conditions:
    - variableEquals{var=caster.phase;value=3} true
    - variableEquals{var=caster.transitioning;value=0} true
  Skills:
    # P3: 위/오른쪽/왼쪽/아래/등판은 모두 유지, 정면측 1장만 숨김
    - partvis{m=copper_origin_p1;p=stone_front_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_back_bone;v=false} @self
    - partvis{m=copper_origin_p1;p=stone_left_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_right_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_top_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_bottom_bone;v=true} @self

CopperOrigin_BM_SpawnSequence:
  Skills:
    # 스폰 직후에는 계속 잠든 자세 유지.
    # 첫 피격 전까지 자동 기상하지 않음.
    - state{mid=copper_origin_p1;s=sleep_sit_idle} @self


# 첫 피격 시 한 번만 기상
CopperOrigin_BM_WakeOnHit:
  Conditions:
    - variableEquals{var=caster.dormant;value=1} true
  Skills:
    - setvariable{var=caster.dormant;value=2;type=INTEGER} @self
    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    - setAI{ai=false} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - state{mid=copper_origin_p1;s=wake_up_from_hit} @self
    - sound{s=entity.iron_golem.repair;v=0.85;p=0.55} @self

    # 업로드 모델의 wake_up_from_hit 길이 기준 약 4.4초
    - delay 88

    - setvariable{var=caster.anim_move;value=0;type=INTEGER} @self
    - state{mid=copper_origin_p1;s=combat_idle} @self
    - setvariable{var=caster.dormant;value=0;type=INTEGER} @self
    - setAI{ai=true} @self
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self
    - potionclear{type=SLOWNESS} @self


CopperOrigin_BM_DormantHold:
  Conditions:
    - variableInRange{var=caster.dormant;value=>0} true
  Skills:
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - potion{type=SLOWNESS;duration=8;level=10} @self


# 페이즈 전환 중에는 매 틱(몹 파일 ~onTimer:1) 위치/AI를 강제로 고정.
# 이전 공격의 후딜이 AI를 켜려고 해도 transitioning=1 동안 즉시 다시 잠근다.
CopperOrigin_TransitionHold:
  Conditions:
    - variableEquals{var=caster.transitioning;value=1} true
  Skills:
    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    - setAI{ai=false} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self


CopperOrigin_BM_WalkStart:
  Conditions:
    - variableEquals{var=caster.dormant;value=0} true
    - variableEquals{var=caster.busy;value=1} false
    - variableEquals{var=caster.roaring;value=1} false
    - variableEquals{var=caster.anim_move;value=0} true
    - moving true
  Skills:
    - setvariable{var=caster.anim_move;value=1;type=INTEGER} @self
    - skill{s=CopperOrigin_BM_PlayWalk_P1} @self
    - skill{s=CopperOrigin_BM_PlayWalk_P2} @self
    - skill{s=CopperOrigin_BM_PlayWalk_P3} @self

CopperOrigin_BM_IdleStart:
  Conditions:
    - variableEquals{var=caster.dormant;value=0} true
    - variableEquals{var=caster.busy;value=1} false
    - variableEquals{var=caster.roaring;value=1} false
    - variableEquals{var=caster.anim_move;value=1} true
    - moving false
  Skills:
    - setvariable{var=caster.anim_move;value=0;type=INTEGER} @self
    - skill{s=CopperOrigin_BM_PlayIdle_P1} @self
    - skill{s=CopperOrigin_BM_PlayIdle_P2} @self
    - skill{s=CopperOrigin_BM_PlayIdle_P3} @self

# 공격/기상 후 정지 상태에서 현재 페이즈 모델의 combat_idle이 아직 시작되지 않은 경우의 안전장치.
CopperOrigin_BM_IdleEnsure:
  Conditions:
    - variableEquals{var=caster.dormant;value=0} true
    - variableEquals{var=caster.busy;value=1} false
    - variableEquals{var=caster.roaring;value=1} false
    - variableEquals{var=caster.anim_move;value=0} true
    - moving false
  Skills:
    - skill{s=CopperOrigin_BM_PlayIdle_P1} @self
    - skill{s=CopperOrigin_BM_PlayIdle_P2} @self
    - skill{s=CopperOrigin_BM_PlayIdle_P3} @self

# 현재 phase의 BetterModel에만 state를 보낸다.
CopperOrigin_BM_PlayWalk_P1:
  Conditions:
    - variableEquals{var=caster.phase;value=1} true
  Skills:
    - state{mid=copper_origin_p1;s=walk} @self

CopperOrigin_BM_PlayWalk_P2:
  Conditions:
    - variableEquals{var=caster.phase;value=2} true
  Skills:
    - state{mid=copper_origin_p1;s=walk} @self

CopperOrigin_BM_PlayWalk_P3:
  Conditions:
    - variableEquals{var=caster.phase;value=3} true
  Skills:
    - state{mid=copper_origin_p1;s=walk_p3_fast} @self

CopperOrigin_BM_PlayIdle_P1:
  Conditions:
    - variableEquals{var=caster.phase;value=1} true
  Skills:
    - state{mid=copper_origin_p1;s=combat_idle} @self

CopperOrigin_BM_PlayIdle_P2:
  Conditions:
    - variableEquals{var=caster.phase;value=2} true
  Skills:
    - state{mid=copper_origin_p1;s=combat_idle} @self

CopperOrigin_BM_PlayIdle_P3:
  Conditions:
    - variableEquals{var=caster.phase;value=3} true
  Skills:
    - state{mid=copper_origin_p1;s=combat_idle} @self


# ------------------------------------------------------------
# 종유석 최초 리필
# BetterModel 부착/스폰 애니메이션 시작 뒤 5틱 후 실행
# ------------------------------------------------------------
CopperOrigin_InitialStalactiteRefresh:
  Skills:
    - delay 5
    - skill{s=CopperStalactite_v28_Refresh} @self


CopperOrigin_CancelFallDamage:
  Conditions:
    - damagecause{cause=FALL} true
  Skills:
    - cancelevent



# ============================================================
# 페이즈 전환
#
# 테스트 기준:
# P1 -> P2 : 체력 65% 이하
# (최종 수치는 추후 조정)
# ============================================================

CopperOrigin_PhaseCheck:
  Conditions:
    - variableEquals{var=caster.phase;value=1} true
    - variableEquals{var=caster.p2_gate;value=1} true
    - healthpercent{p=<=65%} true
  Skills:
    # ========================================================
    # v0.94 P1 -> P2 : 100틱 = 5.0초
    # 모델 교체 없음. 돌 외피 bone 3개가 실제로 순서대로 사라짐.
    # ========================================================
    - setvariable{var=caster.phase;value=2;type=INTEGER} @self
    - setvariable{var=caster.transitioning;value=1;type=INTEGER} @self
    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    - setvariable{var=caster.anim_move;value=0;type=INTEGER} @self
    - setAI{ai=false} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self
    # 이미 실행 중이던 P1 공격 애니메이션을 즉시 제거하고 전환 자세로 고정
    - state{mid=copper_origin_p1;s=basic_attack;r=true;i=true} @self
    - state{mid=copper_origin_p1;s=slam_attack;r=true;i=true} @self
    - state{mid=copper_origin_p1;s=overhead_drive_attack;r=true;i=true} @self
    - state{mid=copper_origin_p1;s=rock_throw_attack;r=true;i=true} @self
    - state{mid=copper_origin_p1;s=combat_idle;f=true} @self
    - equip{item=AIR HAND} @self
    - onDamaged{auraName=CopperOriginTransitionLock;duration=120;multiplier=0} @self
    - potionclear{type=SLOWNESS} @self
    - potionclear{type=WEAKNESS} @self

    - removetag{t=copper_1} @PlayersInRadius{r=35}
    - removetag{t=copper_2} @PlayersInRadius{r=35}
    - removetag{t=copper_3} @PlayersInRadius{r=35}
    - removetag{t=copper_4} @PlayersInRadius{r=35}
    - removetag{t=copper_5} @PlayersInRadius{r=35}

    # 0.0s - 균열 시작
    - sound{s=block.deepslate.break;v=1.25;p=0.42} @self
    - sound{s=entity.iron_golem.damage;v=1.00;p=0.52} @self
    - effect:particles{particle=block;material=DEEPSLATE;amount=26;hS=1.15;vS=1.20;y=1.35;speed=0.09} @self
    - delay 20

    # 1.0s - 윗 외피 균열 연출 (벽 자체는 유지)
    - sound{s=block.stone.break;v=1.35;p=0.76} @self
    - effect:particles{particle=block;material=STONE;amount=34;hS=1.25;vS=1.35;y=2.00;speed=0.14} @self
    - partvis{m=copper_origin_p1;p=stone_top_bone;v=true} @self
    - delay 20

    # 2.0s - 오른쪽 외피 균열 연출 (벽 자체는 유지)
    - sound{s=block.deepslate.break;v=1.55;p=0.58} @self
    - effect:particles{particle=block;material=STONE;amount=46;hS=1.55;vS=1.45;y=1.45;speed=0.17} @self
    - effect:particles{particle=cloud;amount=12;hS=0.95;vS=0.80;y=1.25;speed=0.024} @self
    - partvis{m=copper_origin_p1;p=stone_right_bone;v=true} @self
    - delay 20

    # 3.0s - 실제 정면(-Z)의 큰 외피가 무너지며 구리 본체 노출
    - sound{s=entity.generic.explode;v=0.80;p=0.82} @self
    - sound{s=block.stone.break;v=1.65;p=0.55} @self
    - effect:particles{particle=block;material=STONE;amount=70;hS=1.90;vS=1.80;y=1.40;speed=0.21} @self
    - effect:particles{particle=dust;color=#D9772A;size=1.18;amount=30;hS=1.15;vS=1.25;y=1.45;speed=0.022} @self
    - partvis{m=copper_origin_p1;p=stone_back_bone;v=false} @self
    - delay 20

    # 4.0s - 남은 외피는 유지 + P2 텍스처/파츠를 현재 모델에 무깜빡임 remap
    - sound{s=entity.iron_golem.repair;v=1.30;p=0.74} @self
    - sound{s=block.copper.place;v=1.10;p=0.88} @self
    - effect:particlering{particle=dust;color=#C96E2B;size=1.05;radius=3.8;points=32;amount=1;y=0.75;speed=0.006} @self
    - remapmodel{m=copper_origin_p1;n=copper_origin_p2} @self
    # remap 직후 P2 외피 상태 재고정
    - partvis{m=copper_origin_p1;p=stone_front_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_right_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_top_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_back_bone;v=false} @self
    - partvis{m=copper_origin_p1;p=stone_left_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_bottom_bone;v=true} @self
    - state{mid=copper_origin_p1;s=combat_idle} @self
    - delay 20

    # 5.0s - 전투 재개
    - setvariable{var=caster.p2_damage_lock;value=0;type=INTEGER} @self
    - auraremove{aura=CopperOriginPhaseDamageLock} @self
    - auraremove{aura=CopperOriginTransitionLock} @self
    - setvariable{var=caster.transitioning;value=0;type=INTEGER} @self
    - setvariable{var=caster.anim_move;value=0;type=INTEGER} @self
    - potionclear{type=SLOWNESS} @self
    - setAI{ai=true} @self
    - settarget @NearestPlayer{r=32}
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self
    - state{mid=copper_origin_p1;s=combat_idle;f=true} @self


CopperOrigin_Phase3Check:
  Conditions:
    - variableEquals{var=caster.phase;value=2} true
    - variableEquals{var=caster.p3_gate;value=1} true
    - variableEquals{var=caster.transitioning;value=0} true
  Skills:
    # ========================================================
    # v0.94 P2 -> P3 : 120틱 = 6.0초
    # P2에 남아 있던 뒤/왼쪽/아랫 외피를 순서대로 완전 제거.
    # 모델 remove/apply가 없으므로 깜빡임 없음.
    # ========================================================
    - setvariable{var=caster.p3_damage_lock;value=0;type=INTEGER} @self
    - auraremove{aura=CopperOriginPhaseDamageLock} @self
    - setvariable{var=caster.phase;value=3;type=INTEGER} @self
    - setvariable{var=caster.transitioning;value=1;type=INTEGER} @self
    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    - setvariable{var=caster.anim_move;value=0;type=INTEGER} @self
    - setAI{ai=false} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self
    # 이미 실행 중이던 P2 공격 애니메이션을 즉시 제거하고 전환 자세로 고정
    - state{mid=copper_origin_p1;s=basic_attack;r=true;i=true} @self
    - state{mid=copper_origin_p1;s=slam_attack;r=true;i=true} @self
    - state{mid=copper_origin_p1;s=overhead_drive_attack;r=true;i=true} @self
    - state{mid=copper_origin_p1;s=rock_throw_attack;r=true;i=true} @self
    - state{mid=copper_origin_p1;s=combat_idle;f=true} @self
    - equip{item=AIR HAND} @self
    - onDamaged{auraName=CopperOriginTransitionLock;duration=140;multiplier=0} @self
    - setvariable{var=caster.p3_lock_notice;value=0;type=INTEGER} @self

    # 0.0s - 마지막 외피 전체 균열
    - sound{s=block.anvil.land;v=0.72;p=0.48} @self
    - sound{s=entity.iron_golem.damage;v=1.25;p=0.40} @self
    - effect:particles{particle=block;material=STONE;amount=34;hS=1.35;vS=1.40;y=1.35;speed=0.11} @self
    - delay 20

    # 1.0s - 왼쪽 외피 균열 연출 (벽 자체는 유지)
    - sound{s=block.stone.break;v=1.45;p=0.70} @self
    - effect:particles{particle=block;material=STONE;amount=38;hS=1.35;vS=1.45;y=1.35;speed=0.15} @self
    - partvis{m=copper_origin_p1;p=stone_left_bone;v=true} @self
    - delay 20

    # 2.0s - 뒤쪽 외피 대량 탈락
    - sound{s=block.deepslate.break;v=1.65;p=0.52} @self
    - sound{s=block.stone.break;v=1.45;p=0.62} @self
    - effect:particles{particle=block;material=STONE;amount=64;hS=1.85;vS=1.80;y=1.40;speed=0.20} @self
    - effect:particles{particle=cloud;amount=18;hS=1.20;vS=0.95;y=1.20;speed=0.028} @self
    - partvis{m=copper_origin_p1;p=stone_back_bone;v=false} @self
    - delay 20

    # 3.0s - 아래 외피 균열 연출 (벽 자체는 유지)
    - sound{s=entity.generic.explode;v=0.90;p=0.68} @self
    - sound{s=block.stone.break;v=1.70;p=0.50} @self
    - effect:particles{particle=block;material=STONE;amount=78;hS=1.95;vS=1.70;y=0.95;speed=0.22} @self
    - partvis{m=copper_origin_p1;p=stone_bottom_bone;v=true} @self
    - delay 20

    # 4.0s - 완전 구리화 강조 + P3 텍스처/파츠 무깜빡임 remap
    - sound{s=block.copper.break;v=1.70;p=0.58} @self
    - effect:particles{particle=dust;color=#FF8A2B;size=1.38;amount=52;hS=1.45;vS=1.55;y=1.45;speed=0.032} @self
    - effect:particles{particle=dust;color=#63E6BE;size=0.92;amount=18;hS=1.00;vS=1.20;y=1.35;speed=0.020} @self
    - effect:particlering{particle=dust;color=#E9792A;size=1.18;radius=4.2;points=36;amount=1;y=0.80;speed=0.008} @self
    - remapmodel{m=copper_origin_p1;n=copper_origin_p3} @self
    # P3 외피 상태 재고정: 위/오른쪽/왼쪽/아래/등판 유지
    - partvis{m=copper_origin_p1;p=stone_front_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_back_bone;v=false} @self
    - partvis{m=copper_origin_p1;p=stone_left_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_right_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_top_bone;v=true} @self
    - partvis{m=copper_origin_p1;p=stone_bottom_bone;v=true} @self
    - state{mid=copper_origin_p1;s=combat_idle} @self
    - delay 20

    # 5.0s - 태초의 구리 에너지 안정화
    - sound{s=entity.iron_golem.repair;v=1.60;p=0.48} @self
    - sound{s=block.copper.place;v=1.35;p=0.72} @self
    - effect:particlering{particle=dust;color=#FF7A1F;size=1.26;radius=4.8;points=40;amount=1;y=0.85;speed=0.009} @self
    - delay 20

    # 6.0s - 전투 재개
    # P2와 동일하게 별도 메타스킬로 넘기지 않고 여기서 직접 잠금 해제.
    # transitioning을 먼저 0으로 내려 TransitionHold가 더 이상 AI를 다시 끄지 못하게 한다.
    - setvariable{var=caster.p3_damage_lock;value=0;type=INTEGER} @self
    - auraremove{aura=CopperOriginPhaseDamageLock} @self
    - auraremove{aura=CopperOriginTransitionLock} @self
    - setvariable{var=caster.transitioning;value=0;type=INTEGER} @self
    - setvariable{var=caster.anim_move;value=0;type=INTEGER} @self
    - potionclear{type=SLOWNESS} @self
    - potionclear{type=WEAKNESS} @self
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self
    - setAI{ai=true} @self
    - settarget @NearestPlayer{r=32}
    - state{mid=copper_origin_p1;s=combat_idle;f=true} @self

    # 2틱 뒤 한 번 더 AI/타겟을 강제 복구.
    # 전환 마지막 틱과 ~onTimer:1 TransitionHold가 겹쳐도 P3가 멈춘 채 남지 않게 한다.
    - delay 2
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self
    - setvariable{var=caster.anim_move;value=0;type=INTEGER} @self
    - setAI{ai=true} @self
    - settarget @NearestPlayer{r=32}


# ------------------------------------------------------------
# 체력 봉인
#
# 65% / 30% 도달 후 종유석을 맞기 전까지:
# - 모든 판정은 현재 체력 비율(healthpercent) 기준
# - 최대 체력이 얼마든 같은 퍼센트에서 기믹 발동
# - 임계치 도달 뒤 damage_lock 활성화
# - 이후 공격 이벤트는 cancel -> 타격 시도는 보이나 HP는 더 내려가지 않음
# ------------------------------------------------------------

CopperOrigin_P2ThresholdLock:
  Conditions:
    - variableEquals{var=caster.phase;value=1} true
    - variableEquals{var=caster.p2_gate;value=0} true
    - healthpercent{p=<=65%} true
  Skills:
    - setvariable{var=caster.p2_damage_lock;value=1;type=INTEGER} @self
    - auraremove{aura=CopperOriginPhaseDamageLock} @self
    - onDamaged{auraName=CopperOriginPhaseDamageLock;duration=12000;multiplier=0} @self
    - skill{s=CopperOrigin_P2LockNotice} @self

CopperOrigin_P2LockNotice:
  Conditions:
    - variableEquals{var=caster.p2_lock_notice;value=0} true
  Skills:
    - setvariable{var=caster.p2_lock_notice;value=1;type=INTEGER} @self
    - sound{s=block.anvil.land;v=0.7;p=0.55} @self
    - effect:particles{particle=dust;color=#AAAAAA;size=0.95;amount=24;hS=0.85;vS=1.10;y=1.3;speed=0.012} @self
    - effect:particlering{particle=dust;color=#D0D0D0;size=1.05;radius=3.0;points=42;amount=1;y=1.0;speed=0.003} @self

CopperOrigin_P3ThresholdLock:
  Conditions:
    - variableEquals{var=caster.phase;value=2} true
    - variableEquals{var=caster.p3_gate;value=0} true
    - healthpercent{p=<=30%} true
  Skills:
    - setvariable{var=caster.p3_damage_lock;value=1;type=INTEGER} @self
    - auraremove{aura=CopperOriginPhaseDamageLock} @self
    - onDamaged{auraName=CopperOriginPhaseDamageLock;duration=12000;multiplier=0} @self
    - skill{s=CopperOrigin_P3LockNotice} @self

CopperOrigin_P3LockNotice:
  Conditions:
    - variableEquals{var=caster.p3_lock_notice;value=0} true
  Skills:
    - setvariable{var=caster.p3_lock_notice;value=1;type=INTEGER} @self
    - sound{s=block.anvil.land;v=0.7;p=0.48} @self
    - effect:particles{particle=dust;color=#C66A2B;size=1.00;amount=28;hS=0.90;vS=1.15;y=1.3;speed=0.014} @self
    - effect:particlering{particle=dust;color=#E58A3A;size=1.10;radius=3.1;points=44;amount=1;y=1.0;speed=0.003} @self



# ============================================================
# v1.02 DAMAGE LOCK SAFETY / PARTICLE FEEDBACK
# ============================================================

# 포효가 끝난 상태에서는 포효 무적이 절대 남지 않게 강제 제거.
CopperOrigin_P3_RoarInvulnSafety:
  Conditions:
    - variableEquals{var=caster.roaring;value=0} true
  Skills:
    - auraremove{aura=CopperOriginRoarInvulnerable} @self

# 실제 3페(phase=3)에서는 이전 30% 봉인 오라가 남아 있으면 안 됨.
CopperOrigin_P3_DamageLockSafety:
  Conditions:
    - variableEquals{var=caster.phase;value=3} true
    - variableEquals{var=caster.p3_damage_lock;value=0} true
  Skills:
    - auraremove{aura=CopperOriginPhaseDamageLock} @self

# 체력 봉인 중에는 채팅 대신 보스 주위에 지속적인 '석화 방벽' 링을 표시.
