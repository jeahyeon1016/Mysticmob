CopperOrigin_P3_RoarMarkerStart:
  Skills:
    # 약 25% 습윤석
    - randomskill{skills=CopperOrigin_P3_Roar_Normal,CopperOrigin_P3_Roar_Normal,CopperOrigin_P3_Roar_Normal,CopperOrigin_P3_Roar_Wet} @self


# 실제 보이는 낙석은 MythicMobs native summonfallingblock.
# 마커는 바닥 판정/타이밍만 담당.
CopperOrigin_P3_Roar_Normal:
  Skills:
    # 착탄 위치 경고
    - effect:particlering{particle=dust;color=#FF7A24;size=0.90;radius=0.95;points=24;amount=1;y=0.22;speed=0.001} @self

    # MythicMobs 정식 METEOR + BLOCK bullet.
    # marker(@self) 위 hfs=14에서 RAW_COPPER_BLOCK 투사체가 실제로 낙하.
    # sE=false: 중간에 플레이어를 스쳐도 사라지지 않음.
    # sB=true: 바닥 블럭에 닿으면 종료 -> onEnd에서 착탄 판정.
    - projectile{
        type=METEOR;
        bulletType=BLOCK;
        material=RAW_COPPER_BLOCK;
        bulletspin=0.25;
        hfs=26;
        v=1.75;
        i=1;
        hR=0.70;
        vR=0.90;
        mr=24;
        md=100;
        sE=false;
        sB=true;
        onStart=CopperOrigin_P3_Roar_NormalStart;
        onHit=CopperOrigin_P3_Roar_NormalDirectHit;
        onEnd=CopperOrigin_P3_Roar_NormalImpact
      } @self

    # projectile 종료 후 marker 정리 여유
    - delay 300
    - remove @self

CopperOrigin_P3_Roar_NormalStart:
  Skills:
    # 상공에서 나타나는 순간만 짧은 반짝임. trail 없음.
    - effect:particles{particle=dust;color=#FFB073;size=0.85;amount=8;hS=0.12;vS=0.12;speed=0.001} @origin
    - sound{s=block.pointed_dripstone.drip_lava_into_cauldron;v=0.50;p=0.72} @origin


# [v0.47] 미사용: onTick 콜백 제거로 클라이언트/서버 부하 감소
CopperOrigin_P3_Roar_NormalTick:
  Skills:
    # RAW_COPPER_BLOCK 주변: 무거운 구리 파편 + 약한 주황 불티.
    - effect:particles{particle=block;material=RAW_COPPER_BLOCK;amount=5;hS=0.18;vS=0.18;speed=0.025} @origin
    - effect:particles{particle=dust;color=#C96A2B;size=0.62;amount=3;hS=0.16;vS=0.16;speed=0.006} @origin
    # 낙하 중 휘이익 소리. 매 tick 너무 겹치지 않게 낮은 볼륨.
    - sound{s=entity.breeze.wind_burst;v=0.22;p=1.65} @origin


CopperOrigin_P3_Roar_NormalDirectHit:
  Skills:
    # IMPORTANT:
    # projectile onHit은 맞은 엔티티를 자동으로 이 metaskill의 target으로 넘김.
    # 여기서 @target 같은 명시 targeter를 쓰면 원래 projectile target(marker)로
    # 덮어써질 수 있으므로 직격 스킬에서는 targeter를 쓰지 않는다.
    - damage{a=18}
    - skill{s=CopperOrigin_CopperAdd4_OnHit}
    - throw{velocity=0.45;velocityY=-0.45}
    - effect:particles{particle=dust;color=#FF7A1F;size=1.15;amount=22;hS=0.48;vS=0.65;speed=0.025}
    - sound{s=block.pointed_dripstone.land;v=1.25;p=0.62}
    - sound{s=entity.generic.explode;v=0.65;p=0.75}
    - effect:particles{particle=block;material=RAW_COPPER_BLOCK;amount=26;hS=0.50;vS=0.50;speed=0.11}
    - effect:particles{particle=dust;color=#D66A25;size=0.95;amount=14;hS=0.40;vS=0.45;speed=0.015}


