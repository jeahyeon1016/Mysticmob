    - sound{s=block.anvil.land;v=0.95;p=0.48} @self
    - sound{s=block.deepslate.break;v=1.30;p=0.58} @self
    - sound{s=entity.generic.explode;v=1.05;p=0.48} @self
    - effect:particles{particle=block;material=DEEPSLATE;amount=42;hS=2.40;vS=0.38;y=0.08;speed=0.15} @self
    - effect:particles{particle=block;material=STONE;amount=34;hS=1.85;vS=0.32;y=0.10;speed=0.12} @self
    - effect:particles{particle=cloud;amount=34;hS=2.20;vS=0.22;y=0.08;speed=0.055} @self
    - effect:particlering{particle=cloud;radius=5;points=54;amount=2;y=0.10;speed=0.055} @self


CopperOrigin_P1_Slam:
  Cooldown: 30
  Conditions:
    - variableEquals{var=caster.transitioning;value=0} true
    - variableEquals{var=caster.phase;value=1} true
    - variableEquals{var=caster.busy;value=1} false
    - targetwithin{d=3} true
  Skills:
    - state{mid=copper_origin_p1;s=slam_attack} @self
    # slam_attack 실제 길이 3.35s(67t), ROOT 최저점 2.84s≈57t
    # 피해/폭발 판정을 정확히 t=57에 맞춤
    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    - setAI{ai=false} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self

    # 큰 공격 예고: 실제 피해 반경 5를 미리 보여줌
    - sound{s=block.stone.break;v=1.2;p=0.55} @self
    - effect:particlering{particle=dust;color=#FFB000;size=1.05;radius=5;points=44;amount=1;y=0.10;speed=0.001} @self
    - delay 8
    - cancelSkill ?variableEquals{var=caster.transitioning;value=1}
    - effect:particlering{particle=dust;color=#FF7A00;size=1.15;radius=5;points=44;amount=1;y=0.10;speed=0.001} @self
    - effect:particlering{particle=cloud;radius=2.6;points=24;amount=1;y=0.12;speed=0.01} @self
    - delay 8
    - cancelSkill ?variableEquals{var=caster.transitioning;value=1}
    - effect:particlering{particle=dust;color=#FF3B30;size=1.20;radius=5;points=44;amount=1;y=0.10;speed=0.001} @self
    - effect:particlering{particle=cloud;radius=4.0;points=32;amount=1;y=0.12;speed=0.01} @self
    - delay 41
    - cancelSkill ?variableEquals{var=caster.transitioning;value=1}

    # 충격 발생 - 플레이어가 빗나가도 지면 충격 연출은 항상 발생
    - skill{s=CopperOrigin_SlamImpactFX} @self
    - damage{a=14} @PlayersInRadius{r=5}
    - skill{s=CopperStalactite_v28_Refresh} @self

    # 진동이 남아있는 느낌
    - delay 4
    - cancelSkill ?variableEquals{var=caster.transitioning;value=1}
    - effect:particlering{particle=cloud;radius=4.3;points=28;amount=1;y=0.08;speed=0.012} @self
    - delay 3
    - cancelSkill ?variableEquals{var=caster.transitioning;value=1}
    - effect:particlering{particle=cloud;radius=3.6;points=24;amount=1;y=0.08;speed=0.008} @self

    - delay 3
    - cancelSkill ?variableEquals{var=caster.transitioning;value=1}
    - setAI{ai=true} @self ?variableEquals{var=caster.transitioning;value=0}
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self ?variableEquals{var=caster.transitioning;value=0}


# ============================================================
# P1-2. 내리꽂기
#
# 트리거: 3블럭 이내
# 쿨: 25초
#
# 현재 프로토타입에서는 실제 블록 속에 플레이어를 끼우지 않고
# 아래쪽 속도 + 강한 둔화 + 멀미로 "바닥에 박힘"을 재현.
# 실제 매몰 지형 연출은 맵과 함께 제작하는 편이 안전.
# ============================================================

CopperOrigin_P1_Piledrive:
  Cooldown: 25
  Conditions:
    - variableEquals{var=caster.transitioning;value=0} true
    - variableEquals{var=caster.phase;value=1} true
    - variableEquals{var=caster.busy;value=1} false
    - targetwithin{d=3} true
  Skills:
    # overhead_drive_attack = 4.20s / 84 ticks
    # 실제 손이 바닥에 완전히 꽂히는 프레임 ~= 3.30s / 66 ticks
    - state{mid=copper_origin_p1;s=overhead_drive_attack} @self
    # 내리꽂기 판정: 전방 45도 / 약 2.2블럭, 고정 타겟 추적 아님
    # 딜 타이밍: t=66 = 3.30s (이전 76t보다 0.50s 빠름)
    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    - setAI{ai=false} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self

    # 긴 차징 텔레그래프
    - sound{s=entity.iron_golem.repair;v=1.0;p=0.55} @self
    - delay 20
    - cancelSkill ?variableEquals{var=caster.transitioning;value=1}
    - delay 20
    - cancelSkill ?variableEquals{var=caster.transitioning;value=1}
    - delay 14
    - cancelSkill ?variableEquals{var=caster.transitioning;value=1}
    - delay 4
    - cancelSkill ?variableEquals{var=caster.transitioning;value=1}
    - sound{s=block.anvil.place;v=0.55;p=0.75} @self
    - delay 8
    - cancelSkill ?variableEquals{var=caster.transitioning;value=1}

    # t=66 (3.20s): 손이 바닥/대상 위치에 꽂히는 순간과 피해 동기화
    - damage{a=12} @EntitiesInCone{angle=45;range=2.2;rotation=0}
    - velocity{mode=ADD;x=0;y=-1.35;z=0} @EntitiesInCone{angle=45;range=2.2;rotation=0}
    - potion{type=SLOWNESS;duration=60;level=10} @EntitiesInCone{angle=45;range=2.2;rotation=0}
    - potion{type=NAUSEA;duration=60;level=1} @EntitiesInCone{angle=45;range=2.2;rotation=0}
    - sound{s=block.deepslate.break;v=1.35;p=0.60} @LivingInCone{a=45;r=2.2;rot=0;target=players}
    - sound{s=entity.generic.explode;v=0.80;p=0.62} @LivingInCone{a=45;r=2.2;rot=0;target=players}
    - effect:particles{particle=cloud;amount=18;hS=0.65;vS=0.16;y=0.05;speed=0.025} @LivingInCone{a=45;r=2.2;rot=0;target=players}
    - effect:particles{particle=block;material=STONE;amount=22;hS=0.8;vS=0.22;y=0.08;speed=0.10} @LivingInCone{a=45;r=2.2;rot=0;target=players}

    # 애니메이션 종료까지 남은 8틱(0.4초) 동안 공격 잠금
    - delay 18
    - cancelSkill ?variableEquals{var=caster.transitioning;value=1}
    - setAI{ai=true} @self ?variableEquals{var=caster.transitioning;value=0}
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self ?variableEquals{var=caster.transitioning;value=0}
CopperOrigin_P1_RockThrow:
  Cooldown: 8
  Conditions:
    - variableEquals{var=caster.transitioning;value=0} true
    - variableEquals{var=caster.phase;value=1} true
    - variableEquals{var=caster.busy;value=1} false
    - targetwithin{d=4} false
    - targetwithin{d=28} true
  Skills:
    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    - setAI{ai=false} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self
    # AI가 꺼져 있어도 투석 대상 쪽으로 몸 전체를 회전
    - look{headOnly=false;force=true;immediately=true} @target
    # AI/이동 상태가 완전히 멈춘 다음 공격 state를 재생해 default/walk 덮어쓰기 방지
    - delay 1
    - cancelSkill ?variableEquals{var=caster.transitioning;value=1}
    - state{mid=copper_origin_p1;s=rock_throw_attack} @self

    # 손에 돌을 들고 있는 것처럼 보이도록 실제 STONE을 장비.
    # MythicMobs 공식 equip mechanic 사용.
    - equip{item=STONE HAND} @self

    - sound{s=block.stone.break;v=1.25;p=0.70} @self
    - effect:particles{particle=block;material=STONE;amount=18;hS=0.75;vS=0.22;y=0.15;speed=0.08} @self
    - effect:particles{particle=dust;color=#B08968;size=1.0;amount=10;hS=0.55;vS=0.40;y=1.4;speed=0.01} @self

    # 준비/장전 모션
    - delay 20
    - cancelSkill ?variableEquals{var=caster.transitioning;value=1}
    - look{headOnly=false;force=true;immediately=false} @target
    - effect:particles{particle=dust;color=#DDB892;size=1.1;amount=14;hS=0.45;vS=0.35;y=1.6;speed=0.01} @self
    - delay 20
    - cancelSkill ?variableEquals{var=caster.transitioning;value=1}
    - look{headOnly=false;force=true;immediately=false} @target
    - delay 17
    - cancelSkill ?variableEquals{var=caster.transitioning;value=1}
    # 릴리즈 직전 현재 대상 위치를 다시 바라봄
    - look{headOnly=false;force=true;immediately=true} @target

    # t=58 (2.90s): 실제 팔이 앞으로 뻗는 릴리즈 순간에 투사체 생성
    - equip{item=AIR HAND} @self
    - projectile{onTick=CopperOrigin_RockTick;onHit=CopperOrigin_RockHit;v=14;i=1;hR=1.65;vR=1.65;mr=34} @target

    # rock_throw_attack 종료 72t까지 후딜 유지
    - delay 14
    - cancelSkill ?variableEquals{var=caster.transitioning;value=1}
    - setAI{ai=true} @self ?variableEquals{var=caster.transitioning;value=0}
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self ?variableEquals{var=caster.transitioning;value=0}


CopperOrigin_RockTick:
  Skills:
    # 흩어지는 파편보다 중앙에 뭉친 '한 덩어리 암석'이 보이도록 밀도 강화
    - effect:particles{particle=BLOCK;material=STONE;amount=64;hS=0.58;vS=0.58;speed=0.018} @origin
