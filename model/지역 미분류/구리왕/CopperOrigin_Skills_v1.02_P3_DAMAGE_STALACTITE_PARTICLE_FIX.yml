    - effect:particlering{particle=cloud;radius=6.5;points=34;amount=1;y=0.35;speed=0.035} @self


CopperOrigin_P3_RoarEnd:
  Skills:
    - setvariable{var=caster.roaring;value=0;type=INTEGER} @self
    - setvariable{var=caster.roar_repel;value=0;type=INTEGER} @self
    - auraremove{aura=CopperOriginRoarInvulnerable} @self
    - setAI{ai=true} @self
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self
    - potionclear{type=SLOWNESS} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - sound{s=block.anvil.land;v=0.35;p=0.72} @self
    - effect:particles{particle=cloud;amount=20;hS=2.4;vS=0.25;y=0.25;speed=0.025} @self


