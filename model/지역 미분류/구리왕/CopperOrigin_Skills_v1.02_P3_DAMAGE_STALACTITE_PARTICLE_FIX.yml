# ------------------------------------------------------------
# P3 구리 포효
#
# - 구리 암석 투척 삭제
# - 천장 낙석 패턴으로 대체
# - 일반 낙석: 피해 + 구리화 +1
# - 습윤석: 구리화 -1
#
# ★ groggy 안전장치:
# 시작 조건뿐 아니라 웨이브마다 groggy=0 확인.
# 도중 종유석으로 그로기 걸리면 남은 웨이브는 즉시 무효화.
# ------------------------------------------------------------

# ------------------------------------------------------------
# P3 구리 포효 = 궁극기
#
# P3에서 체력 조건으로 정확히 2회:
# - 22 이하 : 1회
# - 10 이하 : 1회
#
# 랜덤 라우터에서는 제거.
# ------------------------------------------------------------



CopperOrigin_P3_Roar1Check:
  Conditions:
    - variableEquals{var=caster.phase;value=3} true
    - variableEquals{var=caster.p3_roar1_done;value=0} true
    - variableEquals{var=caster.busy;value=1} false
    - healthpercent{p=<=22%} true
  Skills:
    - setvariable{var=caster.p3_roar1_done;value=1;type=INTEGER} @self
    - skill{s=CopperOrigin_P3_Roar} @self

CopperOrigin_P3_Roar2Check:
  Conditions:
    - variableEquals{var=caster.phase;value=3} true
    - variableEquals{var=caster.p3_roar2_done;value=0} true
    - variableEquals{var=caster.busy;value=1} false
    - healthpercent{p=<=10%} true
  Skills:
    - setvariable{var=caster.p3_roar2_done;value=1;type=INTEGER} @self
    - skill{s=CopperOrigin_P3_Roar} @self


CopperOrigin_P3_Roar:
  Conditions:
    - variableEquals{var=caster.phase;value=3} true
    - variableEquals{var=caster.groggy;value=1} false
  Skills:
    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    - setAI{ai=false} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - setvariable{var=caster.roaring;value=1;type=INTEGER} @self
    - setvariable{var=caster.roar_repel;value=1;type=INTEGER} @self

    # 포효 무적은 포효 실길이(약 147t)에 맞춰 150t만 유지.
    # RoarEnd 제거 + 별도 safety timer까지 3중으로 잔류를 방지한다.
    - auraremove{aura=CopperOriginRoarInvulnerable} @self
    - onDamaged{auraName=CopperOriginRoarInvulnerable;duration=150;cancelEvent=true} @self

    # 이동/AI 상태를 먼저 멈춘 뒤 포효 애니메이션 재생
    - delay 1
    - state{mid=copper_origin_p1;s=roar_attack_p3_fast} @self
    - potion{type=SLOWNESS;duration=360;level=10} @self


    # 시작부터 근접 플레이어 밀쳐내기
    - skill{s=CopperOrigin_P3_RoarRepel} @self

    # 포효 사운드
    - sound{s=entity.ender_dragon.growl;v=1.35;p=0.45} @self
    - sound{s=entity.ravager.roar;v=1.25;p=0.58} @self
    - sound{s=entity.generic.explode;v=0.75;p=0.38} @self
    - potion{type=NAUSEA;duration=22;level=0} @PlayersInRadius{r=16}

    # roar_attack의 힘 모으기 구간과 연동
    - effect:particlering{particle=cloud;radius=2.0;points=38;amount=1;y=1.0;speed=0.055} @self
    - effect:particles{particle=gust;amount=18;hS=1.4;vS=0.75;y=1.25;speed=0.070} @self
    - delay 4
    - effect:particlering{particle=cloud;radius=3.5;points=48;amount=1;y=1.0;speed=0.065} @self
    - effect:particles{particle=gust;amount=22;hS=2.0;vS=0.85;y=1.25;speed=0.080} @self
    - delay 4
    - effect:particlering{particle=cloud;radius=5.0;points=60;amount=1;y=1.0;speed=0.075} @self
    - effect:particles{particle=gust;amount=26;hS=2.7;vS=0.95;y=1.25;speed=0.095} @self
    - skill{s=CopperOrigin_P3_RoarAirflow} @self
    - sound{s=block.anvil.land;v=0.5;p=0.50} @self
    - delay 8

    # P3 x1.4: 약 0.8초 후 접근 차단 해제. fast roar는 약 7.21초로 패턴과 동기화.
    - setvariable{var=caster.roar_repel;value=0;type=INTEGER} @self

    # 불규칙 낙석 리듬
    - skill{s=CopperOrigin_P3_RoarRandomSmall} @self
    - skill{s=CopperOrigin_P3_RoarAirflow} @self
    - delay 13

    - skill{s=CopperOrigin_P3_RoarRandomTiny} @self
    - delay 4
    - skill{s=CopperOrigin_P3_RoarRandomTiny} @self
    - delay 4
    - skill{s=CopperOrigin_P3_RoarTargeted} @self
    - delay 5

    - skill{s=CopperOrigin_P3_RoarRandomMedium} @self
    - skill{s=CopperOrigin_P3_RoarAirflow} @self
    - delay 16

    - skill{s=CopperOrigin_P3_RoarTargeted} @self
    - delay 4
    - skill{s=CopperOrigin_P3_RoarRandomSmall} @self
    - skill{s=CopperOrigin_P3_RoarAirflow} @self
    - delay 12

    - skill{s=CopperOrigin_P3_RoarRandomTiny} @self
    - delay 5
    - skill{s=CopperOrigin_P3_RoarRandomMedium} @self
    - skill{s=CopperOrigin_P3_RoarAirflow} @self
    - delay 6

    - delay 13
    - skill{s=CopperOrigin_P3_RoarTargeted} @self
    - skill{s=CopperOrigin_P3_RoarAirflow} @self
    - delay 4
    - skill{s=CopperOrigin_P3_RoarRandomTiny} @self
    - delay 4
    - skill{s=CopperOrigin_P3_RoarRandomTiny} @self
    - delay 4
    - skill{s=CopperOrigin_P3_RoarRandomMedium} @self
    - skill{s=CopperOrigin_P3_RoarAirflow} @self

    - delay 36
    - skill{s=CopperOrigin_P3_RoarEnd} @self


CopperOrigin_P3_RoarAirflow:
  Conditions:
    - variableEquals{var=caster.roaring;value=1} true
  Skills:
    # 몸 주변에서 공기가 바깥으로 밀려나는 반복 파동
    - effect:particlering{particle=cloud;radius=2.8;points=30;amount=1;y=1.15;speed=0.065} @self
    - effect:particlering{particle=cloud;radius=5.2;points=42;amount=1;y=1.05;speed=0.080} @self
    - effect:particles{particle=gust;amount=24;hS=3.8;vS=0.85;y=1.35;speed=0.115} @self
    - effect:particles{particle=cloud;amount=18;hS=4.4;vS=0.45;y=0.80;speed=0.090} @self


CopperOrigin_P3_RoarHold:
  Conditions:
    - variableEquals{var=caster.roaring;value=1} true
  Skills:
    # 포효 패턴이 끝나기 전에는 애니메이션 상태와 무관하게 절대 이동하지 않음.
    # Mob 파일에서 ~onTimer:2로 계속 호출되므로 다른 스킬이 AI를 건드려도 즉시 다시 잠금.
    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    - setAI{ai=false} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - potion{type=SLOWNESS;duration=8;level=10} @self


CopperOrigin_P3_RoarRepel:
  Conditions:
    - variableEquals{var=caster.roar_repel;value=1} true
  Skills:
