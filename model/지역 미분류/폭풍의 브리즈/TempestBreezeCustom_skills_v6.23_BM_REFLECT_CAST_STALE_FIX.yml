TempestStormTest_Helper1:
  Skills:
    # 중요:
    # helper의 eye-height를 이용해 조준하지 않는다.
    #
    # execute 위치 자체를 실제 Wind Charge 위치로 옮긴 뒤
    # 그 실행 위치에서 '현재 시점의 가장 가까운 서바이벌 플레이어 눈'을 바라보게 한다.
    # 따라서 계산 시작점 = Wind Charge 실제 좌표.
    - command{c="execute at @e[type=minecraft:breeze_wind_charge,tag=tempest_pending_1,sort=nearest,limit=1] facing entity @p[gamemode=survival,sort=nearest,limit=1] eyes run tp <caster.uuid> ~ ~ ~ ~ ~"} @self

    # 회전 적용을 확실히 한 뒤 Motion 계산.
    - delay 1
    - velocity{mode=SET;x=0;y=0;z=1.105;relative=true} @self

    # helper의 실제 Motion을 오직 tempest_pending_1 한 발에만 복사.
    - delay 1
    - command{c="data modify entity @e[type=minecraft:breeze_wind_charge,tag=tempest_pending_1,sort=nearest,limit=1] Motion set from entity <caster.uuid> Motion"} @self
    - command{c="tag @e[type=minecraft:breeze_wind_charge,tag=tempest_pending_1,sort=nearest,limit=1] remove tempest_pending_1"} @self

    - remove @self


