# ============================================================
# 돌풍구 발사 직전 공간 확보 넉백
# - P1/P2 공통
# - 돌풍구가 나오기 바로 직전에 1회만 발동
# - 분노 진입 넉백과는 별개
# ============================================================

TempestCustom_PreStormKnockback:
  Skills:
    - throw{velocity=1.45;velocityY=0.30} @PlayersInRadius{r=7}
    - sound{s=entity.breeze.wind_burst;v=1.15;p=0.95} @self

TempestCustom_StormOrbPattern:
  TargetConditions:
    - entitytype{t=PLAYER} true
    - insurvivalmode true
  Conditions:
    - onground true
    - targetwithin{d=30} true
    - variableEquals{var=caster.enraged;value=1} false
    - variableEquals{var=caster.broken;value=1} false
    - variableEquals{var=caster.storm_casting;value=1} false
  Skills:
    # 기믹 중 다른 이동/공격 완전 잠금.
    # duration은 안전장치이며 정상 종료 시 아래에서 직접 0으로 복구.
    - setvariable{var=caster.storm_casting;value=1;type=INTEGER;duration=120} @self
    - setvariable{var=caster.busy;value=1;type=INTEGER;duration=120} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - look{headOnly=false;force=true;immediately=true} @target

    # 이전 테스트/실패탄 중 완전히 정지한 Tempest 돌풍구만 정리.
    # 정상 비행 중인 돌풍구는 건드리지 않음.
    - command{c="execute at <caster.uuid> run kill @e[type=minecraft:breeze_wind_charge,tag=tempest_wc,distance=..40,nbt={Motion:[0.0d,0.0d,0.0d]}]"} @self

    # 전조
    - sound{s=entity.breeze.charge;v=1.4;p=0.7} @self
    - effect:particles{particle=gust;amount=36;hS=0.8;vS=0.7;speed=0.08} @self
    - message{m="&b[돌풍구] &f받아칠 준비!"} @PlayersInRadius{r=22}
    # 돌풍구 패턴 전체 동안 발사 자세 유지
    - state{mid=tempest_breeze;s=storm_cast_p1} @self
    - delay 30

    # 발사 직전 공간 확보: 플레이어를 한 번 밀어낸 뒤 발사.
    - skill{s=TempestCustom_PreStormKnockback} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self

    # ========================================================
    # 격리 테스트에서 검증 완료된 5/5 발사 구조
    #
    # - 각 발마다 고유 pending tag
    # - 각 발마다 고유 Helper 1~5
    # - Helper가 자기 발만 처리
    # - 발 간격 3틱
    # - 실제 Wind Charge 좌표에서 최신 @p eyes 기준 조준
    # ========================================================

    # ===== 1발 =====
    - command{c="execute at <caster.uuid> run summon minecraft:breeze_wind_charge ~ ~1.35 ~ {Tags:['tempest_wc','tempest_wc_1','tempest_pending_1']}"} @self
    - summon{type=TempestWindVectorHelper1;amount=1} @self
    - delay 4
    # ===== 2발 =====
    - command{c="execute at <caster.uuid> run summon minecraft:breeze_wind_charge ~ ~1.35 ~ {Tags:['tempest_wc','tempest_wc_2','tempest_pending_2']}"} @self
    - summon{type=TempestWindVectorHelper2;amount=1} @self
    - delay 4
    # ===== 3발 =====
    - command{c="execute at <caster.uuid> run summon minecraft:breeze_wind_charge ~ ~1.35 ~ {Tags:['tempest_wc','tempest_wc_3','tempest_pending_3']}"} @self
    - summon{type=TempestWindVectorHelper3;amount=1} @self
    - delay 4
    # ===== 4발 =====
