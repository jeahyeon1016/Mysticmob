# ============================================================
# 6초 무력화
# ============================================================

TempestCustom_EnterBroken:
  Conditions:
    - variableEquals{var=caster.broken;value=1} false
  Skills:
    - setvariable{var=caster.broken;value=1;type=INTEGER} @self
    - setvariable{var=caster.wind_barrier;value=0;type=INTEGER} @self
    - setvariable{var=caster.busy;value=1;type=INTEGER} @self
    - setvariable{var=caster.movement_pause;value=1;type=INTEGER} @self
    - setvariable{var=caster.storm_casting;value=0;type=INTEGER} @self

    # 무력화에 들어간 순간 이미 날아가던 전용 돌풍구를 제거.
    # 기절 종료 직후 예전 반사탄이 새 스택으로 잡히는 현상 방지.
    - command{c="execute at <caster.uuid> run kill @e[type=minecraft:breeze_wind_charge,tag=tempest_wc,distance=..40]"} @self
    - command{c="tag <caster.uuid> remove tempest_reflected_wc_hit"} @self

    - skill{s=TempestAnim_Stunned} @self
    - velocity{mode=SET;x=0;y=0;z=0} @self

    - potion{type=SLOWNESS;duration=130;level=10} @self
    - potion{type=WEAKNESS;duration=130;level=10} @self

    - sound{s=entity.breeze.death;v=0.95;p=1.3} @self
    - effect:particles{particle=cloud;amount=48;hS=1.0;vS=0.72;speed=0.05} @self
    - message{m="&c[무력화] &f바람장벽 해제! 6초 동안 공격 기회!"} @PlayersInRadius{r=30}

    # 정확히 6초(120틱) 후 자동 복구.
    # 단, 그 전에 30% 이하가 되어 P2로 전환되면 broken=0이므로 이 Recover는 자동 무시됨.
    - delay 120
    - skill{s=TempestCustom_Recover} @self


TempestCustom_Recover:
  Conditions:
    - variableEquals{var=caster.broken;value=1} true
  Skills:
    # 혹시 무력화 중 외곽에서 들어온 오래된 전용 돌풍구가 남아있다면
    # 장벽을 켜기 전에 한 번 더 정리한다.
    - command{c="execute at <caster.uuid> run kill @e[type=minecraft:breeze_wind_charge,tag=tempest_wc,distance=..40]"} @self
    - command{c="tag <caster.uuid> remove tempest_reflected_wc_hit"} @self
    - skill{s=TempestAnim_BarrierRestore} @self
    - potionclear{type=SLOWNESS} @self
    - potionclear{type=WEAKNESS} @self

    - setvariable{var=caster.reflect_hits;value=0;type=INTEGER} @self
    - setvariable{var=caster.enrage_reflect_hits;value=0;type=INTEGER} @self
    - setvariable{var=caster.wind_barrier;value=1;type=INTEGER} @self
    - setvariable{var=caster.broken;value=0;type=INTEGER} @self
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self
    - setvariable{var=caster.storm_casting;value=0;type=INTEGER} @self
    - setvariable{var=caster.movement_pause;value=0;type=INTEGER} @self

    - sound{s=entity.breeze.charge;v=1.2;p=0.95} @self
    - effect:particles{particle=gust;amount=30;hS=0.9;vS=0.75;speed=0.11} @self
    - message{m="&b[회복] &f바람장벽 복구 / 패턴 재개"} @PlayersInRadius{r=30}


# ============================================================
# 반사된 전용 Wind Charge 근접 감지
#
# 중요:
# onDamaged 이벤트가 발생할 때는 Wind Charge 엔티티가 이미 충돌로 제거되어
# 주변 엔티티 검색이 실패할 수 있다.
#
# 따라서 매 틱 보스 주변 4블럭을 검사한다.
# 조건:
#   1) breeze_wind_charge
#   2) tempest_wc 태그 보유
#   3) origin이 PLAYER (플레이어가 받아친 뒤 projectile origin이 플레이어로 변경된 경우만 성립)
#
# 조건이 맞으면 반사 성공으로 처리하고, 가장 가까운 해당 돌풍구를 제거한다.
# ============================================================

TempestCustom_ReflectedWindProximityCheck:
  Conditions:
    - variableEquals{var=caster.broken;value=1} false
  Skills:
    # --------------------------------------------------------
    # STEP 1. 플레이어가 받아친 tempest_wc 자체를 표시
    #
    # 'on origin'으로 발사 주체가 PLAYER가 된 돌풍구를 찾은 뒤,
    # 그 돌풍구 위치 근처의 tempest_wc에 tempest_reflected_wc 태그를 부여한다.
    # 일반/분노 돌풍구 모두 동일하게 작동한다.
    # --------------------------------------------------------
    - command{c="execute at <caster.uuid> as @e[type=minecraft:breeze_wind_charge,tag=tempest_wc,distance=..35] at @s on origin if entity @s[type=minecraft:player] run tag @e[type=minecraft:breeze_wind_charge,tag=tempest_wc,distance=..0.8,sort=nearest,limit=1] add tempest_reflected_wc"} @self

    # --------------------------------------------------------
    # STEP 2. 반사 표시된 돌풍구가 보스 6블럭 안으로 돌아오면 1회 성공
    # --------------------------------------------------------
    - command{c="execute at <caster.uuid> if entity @e[type=minecraft:breeze_wind_charge,tag=tempest_reflected_wc,distance=..6.0,limit=1] run tag <caster.uuid> add tempest_reflected_wc_hit"} @self

    - skill{s=TempestCustom_ConfirmReflectedWindCharge} @self


TempestCustom_ConfirmReflectedWindCharge:
  Conditions:
    - hastag{t=tempest_reflected_wc_hit} true
    - variableEquals{var=caster.broken;value=1} false
    - variableEquals{var=caster.wind_barrier;value=1} true
  Skills:
    # 실제로 되돌아온 반사탄만 제거
    - command{c="execute at <caster.uuid> run kill @e[type=minecraft:breeze_wind_charge,tag=tempest_reflected_wc,distance=..6.0,sort=nearest,limit=1]"} @self

    # 일반: 2스택 / 분노: 5스택
    - skill{s=TempestCustom_ReflectedStormOrbHit} @self

    # 같은 탄 중복 카운트 방지
    - command{c="execute as <caster.uuid> if entity @s[tag=tempest_reflected_wc_hit] run tag @s remove tempest_reflected_wc_hit"} @self


TempestCustom_BrokenProjectileCleanup:
  Conditions:
    - variableEquals{var=caster.broken;value=1} true
  Skills:
    - command{c="execute at <caster.uuid> run kill @e[type=minecraft:breeze_wind_charge,tag=tempest_wc,distance=..40]"} @self
    - command{c="tag <caster.uuid> remove tempest_reflected_wc_hit"} @self

TempestCustom_DamageDebug:
  Skills:
    - message{m="&8[DMG DEBUG] &7cause=<skill.var.damage-cause> / amount=<skill.var.damage-amount> / trigger=<trigger.name> / trigger.type=<trigger.type> / reflect=<caster.var.reflect_hits> / broken=<caster.var.broken>"} @PlayersInRadius{r=20}

# ============================================================
# 6. 원거리 무효 / 근접 장벽
# ============================================================

TempestCustom_BlockRangedDamage:
  Conditions:
    - variableEquals{var=caster.wind_barrier;value=1} true
    - variableEquals{var=caster.broken;value=1} false
    - damagecause{cause=PROJECTILE} true
  Skills:
    - cancelevent


TempestCustom_BarrierDamageReduction:
  Conditions:
    - variableEquals{var=caster.wind_barrier;value=1} true
    - variableEquals{var=caster.broken;value=1} false
    - damagecause{cause=FALL} false
    - damagecause{cause=PROJECTILE} false
  Skills:
    # 바람장벽 활성 중 근접/기타 피해는 최종 30%만 통과
    - modifyDamage{a=-0.70;action=ADDITIVE_MULTIPLIER;sync=true} @self


TempestCustom_MeleeBarrier:
  Conditions:
    - damagecause{cause=ENTITY_ATTACK} true
    - variableEquals{var=caster.wind_barrier;value=1} true
    - variableEquals{var=caster.broken;value=1} false
  Skills:
    # 물리적인 밀쳐내기는 캐스팅 중에도 유지.
    - throw{velocity=15.0;velocityY=1.10} @PlayersInRadius{r=4.5}
    - effect:particles{particle=gust;amount=18;hS=1.2;vS=0.55;speed=0.10} @self
    - sound{s=entity.breeze.wind_burst;v=1.2;p=0.85} @self
    # barrier_repel 애니메이션은 돌풍구 캐스팅 중이 아닐 때만.
    - skill{s=TempestCustom_MeleeBarrierVisual} @self

TempestCustom_MeleeBarrierVisual:
  Conditions:
    - variableEquals{var=caster.storm_casting;value=1} false
  Skills:
    - state{mid=tempest_breeze;s=barrier_repel} @self
    - delay 14
    - skill{s=TempestBM_SyncIdle} @self


# ============================================================
# 7. 장거리 복귀
# ============================================================

TempestCustom_FarReturn:
  TargetConditions:
    - entitytype{t=PLAYER} true
    - distance{d=>=18} true
    - distance{d=<24} true
  Conditions:
    - variableEquals{var=caster.broken;value=1} false
    - variableEquals{var=caster.busy;value=1} false
    - variableEquals{var=caster.storm_casting;value=1} false
  Skills:
    - look{headOnly=false;force=true;immediately=true} @target
    - state{mid=tempest_breeze;s=jump_charge} @self
    - delay 8
    - velocity{mode=SET;x=0;y=1.00;z=0.58;relative=true} @self
    - skill{s=TempestBM_SyncIdle} @self
    - effect:particles{particle=cloud;amount=7;hS=0.28;vS=0.18;speed=0.03} @self

# ============================================================
# 8. 분노 플래그
# 테스트 체력 40 / 30% = 12 HP 이하에서 P2 진입
# ============================================================

TempestCustom_EnrageCheck:
  Conditions:
    - health{h=<12} true
    - variableEquals{var=caster.enraged;value=1} false
  Skills:
    # 30% 이하가 되는 순간 P1 상태를 전부 끊고 바로 P2로 전환.
    # P1 무력화 중이어도 6초를 끝까지 기다리지 않는다.
    - setvariable{var=caster.enraged;value=1;type=INTEGER} @self
    - setvariable{var=caster.broken;value=0;type=INTEGER} @self
    - setvariable{var=caster.wind_barrier;value=1;type=INTEGER} @self
    - setvariable{var=caster.reflect_hits;value=0;type=INTEGER} @self
    - setvariable{var=caster.enrage_reflect_hits;value=0;type=INTEGER} @self
    - setvariable{var=caster.storm_casting;value=0;type=INTEGER} @self
    - setvariable{var=caster.movement_pause;value=0;type=INTEGER} @self
    - setvariable{var=caster.busy;value=1;type=INTEGER;duration=20} @self

    # P1 기절 효과 즉시 해제
    - potionclear{type=SLOWNESS} @self
    - potionclear{type=WEAKNESS} @self

    # P2 시각/상태로 즉시 전환
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - skill{s=TempestAnim_EnrageStart} @self
    - sound{s=entity.breeze.charge;v=1.65;p=0.55} @self
    - skill{s=TempestCustom_EnrageBurst} @self
    - message{m="&4[분노] &f폭풍의 브리즈가 즉시 2페이즈로 전환합니다!"} @PlayersInRadius{r=30}


# ------------------------------------------------------------
# 분노 진입 연출
# - 작은 링 -> 중간 링 -> 큰 링 순서로 빠르게 퍼져나가
#   "지금 P2에 들어갔다"는 것을 즉시 읽히게 한다.
# ------------------------------------------------------------

TempestCustom_EnrageBurst:
  Skills:
    # 분노 진입 시 폭발형 파티클 없음.
    # 순간적으로 파란 기운만 짧게 보여준다.
    - effect:particles{particle=dust;color=#77BFFF;size=1.15;amount=8;hS=0.55;vS=0.18;y=0.18;speed=0.005} @self
    - effect:particles{particle=dust;color=#A8D8FF;size=0.95;amount=6;hS=0.40;vS=0.15;y=2.35;speed=0.005} @self


# ------------------------------------------------------------
# 분노 지속 오라 - 최소 표현
# - 바닥 근처: 옅은 파란 연무처럼 보이는 dust
# - 머리 위: 아주 소량의 밝은 파란 입자
# - 폭발/링/전기 파티클 없음
# ------------------------------------------------------------

TempestCustom_EnrageAura:
  Conditions:
    - variableEquals{var=caster.enraged;value=1} true
    - variableEquals{var=caster.broken;value=1} false
