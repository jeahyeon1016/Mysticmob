    - effect:particles{particle=cloud;amount=6;hS=0.25;vS=0.18;speed=0.03} @self


# ============================================================
# 1B. 물 회피 / 비상 탈출
#
# 목적:
# - 브리즈의 이동은 pathfinding이 아니라 velocity 기반이라
#   바닐라 AI가 물을 알아서 피하지 못한다.
# - 주변 2블럭 범위에 물이 감지되면 water_lock=1로 두어
#   새 점프 및 공중 2차 점프를 막는다.
# - 이미 물에 빠졌다면 위쪽 + 뒤쪽으로 튀어올라 탈출한다.
#
# 주의:
# - 안전 우선형 구현이라 아주 좁은 물가에서는 잠깐 멈출 수 있다.
# ============================================================

TempestCustom_WaterGuard:
  Skills:
    - setvariable{var=caster.water_lock;value=0;type=INTEGER} @self
    - command{c="execute as <caster.uuid> if entity @s[tag=tempest_water_near] run tag @s remove tempest_water_near"} @self

    # 발 높이 주변
    - command{c="execute at <caster.uuid> if block ~2 ~ ~ minecraft:water run tag <caster.uuid> add tempest_water_near"} @self
    - command{c="execute at <caster.uuid> if block ~-2 ~ ~ minecraft:water run tag <caster.uuid> add tempest_water_near"} @self
    - command{c="execute at <caster.uuid> if block ~ ~ ~2 minecraft:water run tag <caster.uuid> add tempest_water_near"} @self
    - command{c="execute at <caster.uuid> if block ~ ~ ~-2 minecraft:water run tag <caster.uuid> add tempest_water_near"} @self
    - command{c="execute at <caster.uuid> if block ~2 ~ ~2 minecraft:water run tag <caster.uuid> add tempest_water_near"} @self
    - command{c="execute at <caster.uuid> if block ~-2 ~ ~2 minecraft:water run tag <caster.uuid> add tempest_water_near"} @self
    - command{c="execute at <caster.uuid> if block ~2 ~ ~-2 minecraft:water run tag <caster.uuid> add tempest_water_near"} @self
    - command{c="execute at <caster.uuid> if block ~-2 ~ ~-2 minecraft:water run tag <caster.uuid> add tempest_water_near"} @self

    # 착지 지점 높이(~-1) 주변도 함께 검사
    - command{c="execute at <caster.uuid> if block ~2 ~-1 ~ minecraft:water run tag <caster.uuid> add tempest_water_near"} @self
    - command{c="execute at <caster.uuid> if block ~-2 ~-1 ~ minecraft:water run tag <caster.uuid> add tempest_water_near"} @self
    - command{c="execute at <caster.uuid> if block ~ ~-1 ~2 minecraft:water run tag <caster.uuid> add tempest_water_near"} @self
    - command{c="execute at <caster.uuid> if block ~ ~-1 ~-2 minecraft:water run tag <caster.uuid> add tempest_water_near"} @self
    - command{c="execute at <caster.uuid> if block ~2 ~-1 ~2 minecraft:water run tag <caster.uuid> add tempest_water_near"} @self
    - command{c="execute at <caster.uuid> if block ~-2 ~-1 ~2 minecraft:water run tag <caster.uuid> add tempest_water_near"} @self
    - command{c="execute at <caster.uuid> if block ~2 ~-1 ~-2 minecraft:water run tag <caster.uuid> add tempest_water_near"} @self
    - command{c="execute at <caster.uuid> if block ~-2 ~-1 ~-2 minecraft:water run tag <caster.uuid> add tempest_water_near"} @self

    - skill{s=TempestCustom_WaterLockOn} @self


TempestCustom_WaterLockOn:
  Conditions:
    - hastag{t=tempest_water_near} true
  Skills:
    - setvariable{var=caster.water_lock;value=1;type=INTEGER} @self


TempestCustom_WaterEmergency:
  Skills:
    - command{c="execute as <caster.uuid> if entity @s[tag=tempest_in_water] run tag @s remove tempest_in_water"} @self
    - command{c="execute at <caster.uuid> if block ~ ~ ~ minecraft:water run tag <caster.uuid> add tempest_in_water"} @self
    - command{c="execute at <caster.uuid> if block ~ ~1 ~ minecraft:water run tag <caster.uuid> add tempest_in_water"} @self
    - skill{s=TempestCustom_WaterEscape} @self


TempestCustom_WaterEscape:
  Conditions:
    - hastag{t=tempest_in_water} true
    - variableEquals{var=caster.broken;value=1} false
  Skills:
    - setvariable{var=caster.water_lock;value=1;type=INTEGER} @self
    - velocity{mode=SET;x=0;y=1.25;z=-0.42;relative=true} @self
    - effect:particles{particle=gust;amount=14;hS=0.45;vS=0.35;speed=0.06} @self
    - sound{s=entity.breeze.jump;v=0.8;p=1.15} @self
    - command{c="execute as <caster.uuid> if entity @s[tag=tempest_in_water] run tag @s remove tempest_in_water"} @self


