# ============================================================
# 3. 일반 에어슬래시
# ============================================================

TempestCustom_NormalWindShot:
  TargetConditions:
    - entitytype{t=PLAYER} true
    - insurvivalmode true
  Conditions:
    - variableEquals{var=caster.broken;value=1} false
    - variableEquals{var=caster.storm_casting;value=1} false
  Skills:
    # 분노/일반 상태에 따라 서로 다른 에어슬래시 사용
    - skill{s=TempestCustom_EnragedWindShot} @target
    - skill{s=TempestCustom_BaseWindShot} @target


TempestCustom_BaseWindShot:
  Conditions:
    - variableEquals{var=caster.enraged;value=1} false
  Skills:
    - setvariable{var=caster.busy;value=1;type=INTEGER;duration=10} @self
    - sound{s=entity.breeze.shoot;v=0.85;p=1.2} @self
    - projectile{onTick=TempestCustom_NormalWindTick;onHit=TempestCustom_NormalWindHit;v=13;i=1;hR=0.35;vR=0.35;mr=24} @target


TempestCustom_EnragedWindShot:
  Conditions:
    - variableEquals{var=caster.enraged;value=1} true
  Skills:
    - setvariable{var=caster.busy;value=1;type=INTEGER;duration=12} @self
    - sound{s=entity.breeze.shoot;v=1.15;p=0.82} @self
    # 분노: 판정 크기 약 1.6배, P1 대비 속도 50% 증가 / 기존 P2 대비 30% 증가
    - projectile{onTick=TempestCustom_EnragedWindTick;onHit=TempestCustom_EnragedWindHit;v=19.5;i=1;hR=0.58;vR=0.58;mr=28} @target


TempestCustom_NormalWindTick:
  Skills:
    - effect:particles{particle=cloud;amount=2;hS=0.12;vS=0.12;speed=0.02} @origin
    - effect:particles{particle=gust;amount=1;hS=0.10;vS=0.10;speed=0.01} @origin


TempestCustom_EnragedWindTick:
  Skills:
    - effect:particles{particle=cloud;amount=4;hS=0.22;vS=0.22;speed=0.040} @origin
    - effect:particles{particle=gust;amount=2;hS=0.18;vS=0.18;speed=0.030} @origin
    # P2 에어슬래시 자체에만 옅은 파란색 포인트.
    - effect:particles{particle=dust;color=#72B7FF;size=0.85;amount=2;hS=0.13;vS=0.13;speed=0.002} @origin


TempestCustom_NormalWindHit:
  TargetConditions:
    - entitytype{t=PLAYER} true
  Conditions:
    - variableEquals{var=caster.broken;value=1} false
  Skills:
    - damage{amount=5} @target
    - throw{velocity=0.35;velocityY=0.55} @target


