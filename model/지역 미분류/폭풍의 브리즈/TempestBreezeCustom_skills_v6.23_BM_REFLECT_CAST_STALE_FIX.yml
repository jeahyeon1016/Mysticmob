# ============================================================
# BETTERMODEL PORT HELPERS
# - BetterModel용 state 호출은 최소 문법(mid/s)만 사용
# - one-shot 종료 뒤 페이즈 idle을 명시적으로 복귀
# ============================================================


TempestBM_InitVisual:
  Skills:
    - skill{s=TempestBM_InitVisualP2} @self
    - skill{s=TempestBM_InitVisualP1} @self

TempestBM_InitVisualP1:
  Conditions:
    - variableEquals{var=caster.enraged;value=1} false
  Skills:
    - skill{s=TempestBM_Vis_P1_Base} @self
    - state{mid=tempest_breeze;s=idle_phase1} @self

TempestBM_InitVisualP2:
  Conditions:
    - variableEquals{var=caster.enraged;value=1} true
  Skills:
    - skill{s=TempestBM_Vis_P2_Base} @self
    - state{mid=tempest_breeze;s=idle_phase2} @self

TempestBM_SyncIdle:
  Conditions:
    # 기절 중에는 stunned를, 돌풍구 캐스팅 중에는 storm_cast_p1/p2를
    # 지연된 이동/피격 callback이 덮어쓰지 못하게 한다.
    - variableEquals{var=caster.broken;value=1} false
    - variableEquals{var=caster.storm_casting;value=1} false
  Skills:
    - skill{s=TempestBM_IdleP2} @self
    - skill{s=TempestBM_IdleP1} @self
TempestBM_IdleP1:
  Conditions:
    - variableEquals{var=caster.broken;value=1} false
    - variableEquals{var=caster.enraged;value=1} false
  Skills:
    - state{mid=tempest_breeze;s=idle_phase1} @self

TempestBM_IdleP2:
  Conditions:
    - variableEquals{var=caster.broken;value=1} false
    - variableEquals{var=caster.enraged;value=1} true
  Skills:
    - state{mid=tempest_breeze;s=idle_phase2} @self

TempestBM_StunnedP1:
  Conditions:
    - variableEquals{var=caster.enraged;value=1} false
  Skills:
    - state{mid=tempest_breeze;s=stunned_p1} @self

TempestBM_StunnedP2:
  Conditions:
    - variableEquals{var=caster.enraged;value=1} true
  Skills:
    - state{mid=tempest_breeze;s=stunned_p2} @self

TempestCustom_FaceNearestPlayer:
  Conditions:
    # 무력화 6초 동안은 시선 추적도 정지.
    # stunned 상태의 head/root 포즈만 유지한다.
    - variableEquals{var=caster.broken;value=1} false
  Skills:
    # BetterModel에서는 base entity 방향 갱신을 확실히 전달하기 위해
    # 짧은 주기로 즉시 nearest-player 방향을 바라보게 한다.
    # teleport는 사용하지 않으므로 velocity 점프에는 간섭하지 않는다.
    - look{headOnly=false;force=true;immediately=true} @NearestPlayer{r=32}

TempestAnim_Idle:
  Skills:
    - skill{s=TempestBM_SyncIdle} @self
TempestCustom_CancelFallDamage:
  Conditions:
    - damagecause{cause=FALL} true
  Skills:
    - cancelevent


# ============================================================
# 1A. 단일 이동 라우터 v4.5
#
# - 플레이어가 24블럭 안에 있을 때만
# - 지상에 있을 때만 새 점프
# - 최대 2회 기동 후 5초 대기
# - 돌풍구/다른 패턴 중 이동 금지
# ============================================================

TempestCustom_MovementRouter:
  TargetConditions:
    - entitytype{t=PLAYER} true
    - insurvivalmode true
  Conditions:
    # 돌풍구 패턴 대기(step 7) 중에는 새 점프를 시작하지 않음
    - variableEquals{var=caster.pattern_step;value=7} false
    - targetwithin{d=24} true
    - onground true
    - variableEquals{var=caster.broken;value=1} false
    - variableEquals{var=caster.busy;value=1} false
    - variableEquals{var=caster.storm_casting;value=1} false
    - variableEquals{var=caster.movement_pause;value=1} false
    - variableEquals{var=caster.water_lock;value=1} false
  Skills:
    # 한 번의 이동 사이클 = 지상 첫 점프 + 공중 두 번째 점프
    - setvariable{var=caster.movement_pause;value=1;type=INTEGER} @self

    # 첫 점프: 거리별 기존 이동
    - skill{s=TempestCustom_TooCloseReposition} @target
    - skill{s=TempestCustom_OrbitBand} @target
    - skill{s=TempestCustom_TooFarApproachRing} @target
    - skill{s=TempestCustom_FarReturn} @target

    # 공중에서 두 번째 점프
    - delay 8
    - skill{s=TempestCustom_AirSecondHop} @target

    # 2연속 기동 후 쿨타임
    - delay 60
    - setvariable{var=caster.movement_pause;value=0;type=INTEGER} @self


TempestCustom_AirSecondHop:
  TargetConditions:
    - entitytype{t=PLAYER} true
    - insurvivalmode true
  Conditions:
    - variableEquals{var=caster.broken;value=1} false
    - variableEquals{var=caster.busy;value=1} false
    - variableEquals{var=caster.storm_casting;value=1} false
    - variableEquals{var=caster.water_lock;value=1} false
  Skills:
    # 공중 2차 점프 시 idle 상태가 풀리는 경우만 다시 보장.
    # force=false라 이미 idle이 정상 재생 중이면 강제로 처음부터 리셋하지 않음.

    # 공중에서 플레이어 방향 다시 잡고 두 번째 도약
    - look{headOnly=false;force=true;immediately=true} @target
    - randomskill{skills=TempestCustom_AirHopLeft,TempestCustom_AirHopRight,TempestCustom_AirHopBack}


TempestCustom_AirHopLeft:
  Skills:
    - state{mid=tempest_breeze;s=jump_charge} @self
    - delay 8
    - velocity{mode=SET;x=-0.62;y=0.92;z=0.18;relative=true} @self
    - skill{s=TempestBM_SyncIdle} @self
    - effect:particles{particle=cloud;amount=7;hS=0.26;vS=0.18;speed=0.03} @self

TempestCustom_AirHopRight:
  Skills:
    - state{mid=tempest_breeze;s=jump_charge} @self
    - delay 8
    - velocity{mode=SET;x=0.62;y=0.92;z=0.18;relative=true} @self
    - skill{s=TempestBM_SyncIdle} @self
    - effect:particles{particle=cloud;amount=7;hS=0.26;vS=0.18;speed=0.03} @self

TempestCustom_AirHopBack:
  Skills:
    - state{mid=tempest_breeze;s=jump_charge} @self
    - delay 8
    - velocity{mode=SET;x=0;y=0.96;z=-0.38;relative=true} @self
    - skill{s=TempestBM_SyncIdle} @self
    - effect:particles{particle=cloud;amount=8;hS=0.28;vS=0.20;speed=0.03} @self
# ============================================================
# 1. 커스텀 이동
#
# 이 스킬 자체가 @NearestPlayer를 inherited target으로 받는다.
# RLNTE = 그 플레이어 주변 랜덤 위치.
# r=9 / minr=4 이므로 플레이어 바로 위로만 달려들지 않고
# 4~9블럭 주변을 이리저리 점프한다.
# ============================================================

# ============================================================
# 1. 거리 유지형 이동 컨트롤러 v3.6
#
# 핵심 변경:
# leap로 '플레이어 주변 위치'를 찍는 방식을 버림.
# 이 방식은 궤적 계산 특성상 플레이어 쪽으로 돌진하는 느낌이 강했음.
#
# 이제:
# 1) 먼저 플레이어를 바라봄
# 2) 자기 기준 relative velocity를 사용
#
# 0~4.5블럭 : 뒤로 + 위로 점프 -> 자연스럽게 거리 벌림
# 4.5~7블럭 : 좌/우 + 위로 점프 -> 플레이어 주변 횡이동
# 7블럭 이상: 앞으로 조금 + 위로 점프 -> 천천히 링으로 복귀
#
# 전부 순간이동 없음.
# ============================================================


# ------------------------------------------------------------
# 너무 가까움: 플레이어를 바라본 다음 뒤로 튀기
# z 음수 = 바라보는 방향의 뒤쪽
# y 높게 = 브리즈처럼 통통 뜨는 느낌
# ------------------------------------------------------------
TempestCustom_TooCloseReposition:
  TargetConditions:
    - entitytype{t=PLAYER} true
    - distance{d=<4.5} true
  Conditions:
    - variableEquals{var=caster.broken;value=1} false
    - variableEquals{var=caster.busy;value=1} false
    - variableEquals{var=caster.storm_casting;value=1} false
  Skills:
    - look{headOnly=false;force=true;immediately=true} @target


    - randomskill{skills=TempestCustom_BackHopLeft,TempestCustom_BackHopRight}


TempestCustom_BackHopLeft:
  Conditions:
    - variableEquals{var=caster.storm_casting;value=1} false
  Skills:
    - state{mid=tempest_breeze;s=jump_charge} @self
    - delay 8
    - velocity{mode=SET;x=-0.38;y=0.96;z=-0.88;relative=true} @self
    - skill{s=TempestBM_SyncIdle} @self
    - effect:particles{particle=cloud;amount=6;hS=0.25;vS=0.18;speed=0.03} @self

TempestCustom_BackHopRight:
  Conditions:
    - variableEquals{var=caster.storm_casting;value=1} false
  Skills:
    - state{mid=tempest_breeze;s=jump_charge} @self
    - delay 8
    - velocity{mode=SET;x=0.38;y=0.96;z=-0.88;relative=true} @self
    - skill{s=TempestBM_SyncIdle} @self
    - effect:particles{particle=cloud;amount=6;hS=0.25;vS=0.18;speed=0.03} @self


# ------------------------------------------------------------
# 이상적 거리 4.5~7블럭:
# 플레이어를 바라본 상태에서 좌/우 횡점프.
