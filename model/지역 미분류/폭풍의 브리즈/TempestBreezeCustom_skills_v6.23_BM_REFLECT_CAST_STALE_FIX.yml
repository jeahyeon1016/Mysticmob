# ============================================================
# 4C. 분노 전방위 무작위 탄막
#
# - 현재 플레이어 방향을 매 발사 스텝의 0도 기준으로 사용
# - 2줄기, 180도 간격 유지
# - 플레이어 기준에서 30도씩 회전
# - 따라서 완전한 고정 원형이 아니라 플레이어 쪽으로 탄막 축이 따라옴
# - 12스텝 = 1바퀴
# - 총 3바퀴 = 36스텝 = 72발
# - 발사 중 5회 반사 성공 시 broken=1이 되어 남은 발사가 즉시 무효화됨
# ============================================================

TempestCustom_EnrageSpiralPattern:
  TargetConditions:
    - entitytype{t=PLAYER} true
    - insurvivalmode true
  Conditions:
    - onground true
    - variableEquals{var=caster.enraged;value=1} true
    - variableEquals{var=caster.broken;value=1} false
    - variableEquals{var=caster.storm_casting;value=1} false
    - targetwithin{d=30} true
  Skills:
    - setvariable{var=caster.storm_casting;value=1;type=INTEGER;duration=200} @self
    - setvariable{var=caster.busy;value=1;type=INTEGER;duration=200} @self
    # reflect_hits는 탄막 패턴마다 초기화하지 않는다.
    # 예: 이전 탄막에서 3/5까지 맞췄다면 다음 탄막은 3/5에서 이어진다.
    # 초기화는 장벽이 실제로 파괴된 뒤 Recover 시점에만 수행한다.
    - velocity{mode=SET;x=0;y=0;z=0} @self
    - state{mid=tempest_breeze;s=storm_cast_p2} @self

    - sound{s=entity.breeze.charge;v=1.6;p=0.55} @self
    - effect:particles{particle=gust;amount=60;hS=1.2;vS=0.9;speed=0.12} @self
    - message{m="&c[분노 탄막] &f전방위 탄막 속에서 5발을 되받아치세요!"} @PlayersInRadius{r=30}
    - delay 18

    # 탄막 시작 직전 한 번 밀어내 공간 확보.
    - skill{s=TempestCustom_PreStormKnockback} @self

    # --------------------------------------------------------
    # 총 36회 발사
    # 대부분: 12방향 중 무작위 1쌍
    # 6,12,18,24,30,36번째: 현재 플레이어 정면 + 정확히 반대편 1쌍
    # 즉 전체 72발 중 12발(6쌍)은 확정적인 플레이어 방향 탄
    # --------------------------------------------------------
    # 1번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 2번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 3번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 4번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 5번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 6번째 - 플레이어 확정 조준
    - skill{s=TempestCustom_EnrageAimedPair} @self
    - delay 3
    # 7번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 8번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 9번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 10번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 11번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 12번째 - 플레이어 확정 조준
    - skill{s=TempestCustom_EnrageAimedPair} @self
    - delay 3
    # 13번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 14번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 15번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 16번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 17번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 18번째 - 플레이어 확정 조준
    - skill{s=TempestCustom_EnrageAimedPair} @self
    - delay 3
    # 19번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 20번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 21번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 22번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 23번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 24번째 - 플레이어 확정 조준
    - skill{s=TempestCustom_EnrageAimedPair} @self
    - delay 3
    # 25번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 26번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 27번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 28번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 29번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 30번째 - 플레이어 확정 조준
    - skill{s=TempestCustom_EnrageAimedPair} @self
    - delay 3
    # 31번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 32번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 33번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 34번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 35번째 - 전방위 무작위
    - skill{s=TempestCustom_EnrageRandomPair} @self
    - delay 3
    # 36번째 - 플레이어 확정 조준
    - skill{s=TempestCustom_EnrageAimedPair} @self
    - delay 3

    - delay 8
    # 분노 탄막 종료: 먼저 캐스팅 잠금을 해제한 뒤 idle 복귀.
    - setvariable{var=caster.storm_casting;value=0;type=INTEGER} @self
    - setvariable{var=caster.busy;value=0;type=INTEGER} @self
    - skill{s=TempestBM_SyncIdle} @self



# ============================================================
# 장벽 피격 전환 후 현재 액션 복귀
#
# 문제 원인:
# 반사 성공 1~4회 처리에서 barrier_*_transition 재생 후
# 무조건 idle_phase2로 복귀하고 있었음.
# 따라서 P2 탄막 도중 반사에 성공하는 순간 storm_cast_p2가 끊겼다.
#
# 수정:
# storm_casting=1 이면 해당 페이즈의 cast 모션으로 복귀.
# storm_casting=0 이면 idle로 복귀.
# ============================================================

TempestBM_ResumeAfterBarrierHit:
  Skills:
    - skill{s=TempestBM_ResumeCastP2} @self
    - skill{s=TempestBM_ResumeCastP1} @self
    - skill{s=TempestBM_ResumeIdleP2_AfterHit} @self
    - skill{s=TempestBM_ResumeIdleP1_AfterHit} @self

TempestBM_ResumeCastP2:
  Conditions:
    - variableEquals{var=caster.enraged;value=1} true
    - variableEquals{var=caster.storm_casting;value=1} true
    - variableEquals{var=caster.broken;value=1} false
  Skills:
    - state{mid=tempest_breeze;s=storm_cast_p2} @self

TempestBM_ResumeCastP1:
  Conditions:
    - variableEquals{var=caster.enraged;value=1} false
    - variableEquals{var=caster.storm_casting;value=1} true
    - variableEquals{var=caster.broken;value=1} false
  Skills:
    - state{mid=tempest_breeze;s=storm_cast_p1} @self

TempestBM_ResumeIdleP2_AfterHit:
  Conditions:
    - variableEquals{var=caster.enraged;value=1} true
    - variableEquals{var=caster.storm_casting;value=1} false
    - variableEquals{var=caster.broken;value=1} false
  Skills:
    - state{mid=tempest_breeze;s=idle_phase2} @self

TempestBM_ResumeIdleP1_AfterHit:
  Conditions:
    - variableEquals{var=caster.enraged;value=1} false
    - variableEquals{var=caster.storm_casting;value=1} false
    - variableEquals{var=caster.broken;value=1} false
  Skills:
    - state{mid=tempest_breeze;s=idle_phase1} @self

# ============================================================
# 5. 반사 돌풍구 -> 2회 적중 시 무력화
#
# 실제 바닐라 breeze_wind_charge를 사용한다.
# 이전 BREEZE 테스트에서 반사된 Wind Charge는 PROJECTILE 피해로 들어왔고
# trigger가 발사 주체 쪽으로 보이는 특성이 확인된 적이 있다.
#
# 커스텀 ZOMBIE 베이스에서는 서버 버전/이벤트 전달 방식 차이가 있을 수 있으므로
# 아래 Debug 메시지를 같이 유지한다.
# ============================================================

TempestCustom_ReflectedStormOrbHit:
  Conditions:
    - variableEquals{var=caster.broken;value=1} false
  Skills:
    # 분노는 5회, 일반은 2회
    - skill{s=TempestCustom_EnrageReflectHit5} @self
