# ------------------------------------------------------------
# 지락
# ------------------------------------------------------------
ClockworkGolem_GroundCheck:
  Conditions:
    - variableIsSet{var=caster.recent_hit} false
    - variableInRange{var=caster.charge;range=>0}
    - variableEquals{var=caster.overloading;value=1} false
  Skills:
    - variablesubtract{var=caster.charge;amount=1}
    - sound{s=block.redstone_torch.burnout;v=0.45;p=0.8} @self
    - effect:particles{particle=electric_spark;amount=4;hS=0.25;vS=0.3;speed=0.02} @SelfLocation{y=1.72}
    - skill{s=ClockworkGolem_ResetChargeVisual} @self

ClockworkGolem_ResetChargeVisual:
  Skills:
    - skill{s=ClockworkGolem_ClearChargeEyes} @self
    - skill{s=ClockworkGolem_ShowCharge1} @self
    - skill{s=ClockworkGolem_ShowCharge2} @self
    - skill{s=ClockworkGolem_ShowCharge3} @self
    - skill{s=ClockworkGolem_ShowCharge4} @self
